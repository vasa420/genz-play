<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VETRI AI STUDIO | Multi-Domain Knowledge & Game Intel Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&family=JetBrains+Mono:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00FFFF;
            --primary-glow: rgba(0, 255, 255, 0.45);
            --secondary: #8A2BE2;
            --green: #00FF88;
            --green-glow: rgba(0, 255, 136, 0.35);
            --gold: #FFD700;
            --gold-glow: rgba(255, 215, 0, 0.35);
            --bg: #03030b;
            --card-bg: rgba(10, 10, 24, 0.85);
            --border: rgba(0, 255, 255, 0.25);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body, html {
            width: 100%; height: 100%;
            background: var(--bg); color: #fff;
            font-family: 'Outfit', sans-serif;
            overflow: hidden; display: flex; flex-direction: column;
        }

        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.14), rgba(0,0,0,0.14) 1.5px, transparent 1.5px, transparent 3px);
            pointer-events: none; z-index: 9999; opacity: 0.6;
        }

        #particle-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
        }

        .top-navbar {
            width: 100%; padding: 18px 35px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 100; background: rgba(5, 5, 18, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(0, 255, 255, 0.15);
        }

        .nav-logo {
            font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 900;
            letter-spacing: 3px; text-transform: uppercase;
            background: linear-gradient(135deg, #00FFFF, #8A2BE2);
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
            display: flex; align-items: center; gap: 10px;
        }

        .btn-back {
            background: rgba(0, 255, 255, 0.08); border: 1px solid rgba(0, 255, 255, 0.3);
            color: var(--primary); padding: 10px 20px; font-family: 'JetBrains Mono', monospace;
            font-size: 11px; font-weight: 700; letter-spacing: 2px; border-radius: 8px;
            cursor: pointer; transition: 0.3s; text-decoration: none;
            display: inline-flex; align-items: center; gap: 8px;
        }

        .btn-back:hover {
            background: var(--primary); color: #000; box-shadow: 0 0 20px var(--primary-glow);
        }

        .chat-container {
            position: relative; z-index: 10;
            flex: 1; width: 100%; max-width: 100%; margin: 0;
            display: flex; flex-direction: column; padding: 15px 25px 20px;
            box-sizing: border-box; height: calc(100vh - 65px);
        }

        .chat-card {
            flex: 1; width: 100%; display: flex; flex-direction: column;
            background: var(--card-bg); border: 1.5px solid var(--border);
            border-radius: 20px; padding: 20px; backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 35px rgba(0, 255, 255, 0.15);
            overflow: hidden;
        }

        .mode-tabs {
            display: flex; gap: 12px; margin-bottom: 12px; width: 100%; justify-content: center;
        }

        .mode-tab-btn {
            flex: 1; padding: 12px 18px;
            background: rgba(0, 255, 255, 0.06);
            border: 1.5px solid rgba(0, 255, 255, 0.25);
            color: rgba(255, 255, 255, 0.7);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px; font-weight: 900; letter-spacing: 2px;
            border-radius: 12px; cursor: pointer; text-decoration: none;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            text-transform: uppercase; text-align: center; backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center;
        }

        .mode-tab-btn:hover {
            color: #fff; border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow); transform: translateY(-2px);
        }

        .mode-tab-btn.active {
            background: linear-gradient(135deg, #00FFFF, #8A2BE2);
            color: #fff; border-color: var(--primary);
            box-shadow: 0 0 25px var(--primary-glow);
        }

        .terminal-box {
            flex: 1; background: rgba(4, 4, 12, 0.95);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 16px; padding: 20px;
            overflow-y: auto; display: flex; flex-direction: column; gap: 16px;
            scroll-behavior: smooth; margin-bottom: 18px;
        }

        .terminal-box::-webkit-scrollbar { width: 6px; }
        .terminal-box::-webkit-scrollbar-thumb { background: rgba(0, 255, 255, 0.3); border-radius: 4px; }

        .chat-msg {
            display: flex; flex-direction: column; gap: 4px;
            max-width: 96%; width: 96%; animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .chat-msg.user { align-self: flex-end; align-items: flex-end; }
        .chat-msg.ai { align-self: flex-start; align-items: flex-start; }

        .msg-sender {
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px; letter-spacing: 2px; color: rgba(255,255,255,0.4);
            text-transform: uppercase;
        }

        .msg-body {
            padding: 14px 20px; border-radius: 14px;
            font-family: 'Outfit', sans-serif; font-size: 14px; line-height: 1.6;
            white-space: pre-wrap; word-break: break-word; width: 100%;
        }

        .chat-msg.user .msg-body {
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.2), rgba(138, 43, 226, 0.2));
            border: 1px solid rgba(0, 255, 255, 0.4); color: #fff;
            border-bottom-right-radius: 2px; width: auto;
        }

        .chat-msg.ai .msg-body {
            background: rgba(10, 24, 40, 0.85);
            border: 1px solid rgba(0, 255, 136, 0.35); color: var(--green);
            border-bottom-left-radius: 2px; text-shadow: 0 0 5px rgba(0,255,136,0.2);
        }

        .knowledge-card {
            background: rgba(5, 15, 30, 0.9);
            border: 1.5px solid rgba(0, 255, 255, 0.35);
            border-radius: 14px; padding: 16px; margin-top: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .knowledge-card-title {
            font-family: 'JetBrains Mono', monospace; font-size: 11px;
            letter-spacing: 2px; color: var(--primary); text-transform: uppercase;
            margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between;
        }

        .intent-tag {
            background: rgba(255, 215, 0, 0.15); border: 1px solid var(--gold);
            color: var(--gold); padding: 3px 10px; border-radius: 6px; font-size: 10px;
        }

        .links-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px;
        }

        .know-link-btn {
            background: rgba(0, 255, 255, 0.08); border: 1px solid rgba(0, 255, 255, 0.25);
            color: #fff; padding: 10px 14px; border-radius: 8px; font-family: 'JetBrains Mono', monospace;
            font-size: 11px; text-decoration: none; transition: 0.25s; display: flex; align-items: center; justify-content: space-between;
        }

        .know-link-btn:hover {
            background: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary-glow);
            transform: translateY(-2px);
        }

        .chat-input-wrapper { display: flex; gap: 12px; align-items: center; }

        .chat-input {
            flex: 1; padding: 16px 22px;
            background: rgba(4, 4, 12, 0.9);
            border: 1.5px solid rgba(0, 255, 255, 0.35);
            border-radius: 14px; color: #fff;
            font-family: 'Outfit', sans-serif; font-size: 15px;
            outline: none; transition: 0.3s;
        }

        .chat-input:focus {
            border-color: var(--primary); box-shadow: 0 0 20px var(--primary-glow);
        }

        .btn-mic {
            width: 52px; height: 52px; border-radius: 14px;
            background: rgba(0, 255, 255, 0.1); border: 1.5px solid rgba(0, 255, 255, 0.35);
            color: var(--primary); font-size: 20px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: 0.3s;
        }

        .btn-mic:hover {
            background: var(--primary); color: #000; box-shadow: 0 0 20px var(--primary-glow);
        }

        .btn-mic.listening {
            background: #FF2244; border-color: #FF2244; color: #fff;
            animation: pulseMic 1s infinite;
        }

        @keyframes pulseMic { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }

        .btn-send {
            padding: 16px 28px;
            background: linear-gradient(90deg, 
                #00FFFF 0%, 
                #00FF88 20%, 
                #8A2BE2 40%, 
                #FF007F 60%, 
                #FF9900 80%, 
                #00FFFF 100%
            );
            background-size: 300% 100%;
            color: #000; border: none; border-radius: 14px;
            font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 900;
            letter-spacing: 2px; cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
            animation: sendGradientWave 5s ease-in-out infinite;
        }

        @keyframes sendGradientWave {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .btn-send:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 0 35px rgba(0, 255, 255, 0.8);
        }

        @keyframes slowFadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slowZoomIn { from { opacity: 0; transform: scale(0.92) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    </style>
</head>
<body>

    <div class="scanlines"></div>
    <canvas id="particle-bg"></canvas>

    <!-- INTRO SPLASH OVERLAY: WELCOME TO VETRI STUDIOS -->
    <div id="vetri-intro-overlay" style="
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #03030b; z-index: 99999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), filter 1s ease;
        text-align: center; padding: 30px; box-sizing: border-box;
    ">
        <div style="
            font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 8px;
            color: #00FFFF; margin-bottom: 20px; text-transform: uppercase;
            text-shadow: 0 0 20px rgba(0,255,255,0.6);
            animation: slowFadeIn 1.5s ease-out forwards;
        ">
            ⚡ SYSTEM INITIALIZING
        </div>

        <h1 style="
            font-size: clamp(32px, 6vw, 68px); font-weight: 900; letter-spacing: 6px;
            background: linear-gradient(135deg, #FFFFFF 0%, #00FFFF 40%, #8A2BE2 75%, #FFD700 100%);
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
            text-transform: uppercase; margin: 0 0 20px 0;
            text-shadow: 0 10px 40px rgba(0, 255, 255, 0.3);
            opacity: 0; transform: scale(0.95);
            animation: slowZoomIn 2.2s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
        ">
            WELCOME TO VETRI STUDIOS
        </h1>

        <div style="
            font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 4px;
            color: rgba(255,255,255,0.6); text-transform: uppercase;
            opacity: 0; animation: slowFadeIn 1.5s ease-out 1.2s forwards;
        ">
            CONNECTING FLIPKART, AMAZON, MOBILE BRANDS & KNOWLEDGE API...
        </div>

        <div style="
            width: 200px; height: 3px; background: rgba(255,255,255,0.1);
            border-radius: 10px; margin-top: 35px; overflow: hidden; position: relative;
        ">
            <div id="intro-progress-bar" style="
                width: 0%; height: 100%; background: linear-gradient(90deg, #00FFFF, #8A2BE2, #FFD700);
                border-radius: 10px; transition: width 2.5s cubic-bezier(0.16, 1, 0.3, 1);
            "></div>
        </div>
    </div>

    <!-- Top Navigation Bar -->
    <nav class="top-navbar">
        <div class="nav-logo">
            <span>⚡</span> VETRI AI STUDIO · UNIVERSAL KNOWLEDGE ENGINE
        </div>
        <a class="btn-back" href="arcade_hub.html">← RETURN BACK</a>
    </nav>

    <!-- Main Chat Workspace -->
    <div class="chat-container">
        <div class="chat-card">

            <!-- 3 Dedicated Mode Selection Pages Navigation -->
            <div class="mode-tabs">
                <a class="mode-tab-btn active" href="vetri_normal_chat.html">💬 UNIVERSAL SEARCH & CHAT HUB</a>
                <a class="mode-tab-btn" href="vetri_code_chat.html">💻 CODE CHAT</a>
                <a class="mode-tab-btn" href="vetri_image_gen.html">🎨 IMAGE GENERATION</a>
            </div>

            <!-- Terminal Output Window -->
            <div class="terminal-box" id="terminal-box">
                <div class="chat-msg ai">
                    <span class="msg-sender">🤖 VETRI AI</span>
                    <div class="msg-body" style="font-weight: 700; font-size: 16px; letter-spacing: 1px; color: var(--green);">WELCOME TO VETRI AI</div>
                </div>
            </div>

            <!-- Chat Input Controls -->
            <div class="chat-input-wrapper">
                <button class="btn-mic" id="mic-btn" onclick="toggleVoiceInput()" title="Voice Input Mic">🎙️</button>
                <input type="text" id="chat-input" class="chat-input" placeholder="Ask any question (e.g. iPhone 16 Pro Max, Samsung S24, GTA V, FLAMES)..." onkeydown="if(event.key==='Enter')sendChatMessage()">
                <button class="btn-send" onclick="sendChatMessage()">🌐 SEARCH & CHAT</button>
            </div>

        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const overlay = document.getElementById('vetri-intro-overlay');
            const progress = document.getElementById('intro-progress-bar');
            if (progress) setTimeout(() => { progress.style.width = '100%'; }, 100);
            if (overlay) {
                setTimeout(() => {
                    overlay.style.opacity = '0';
                    overlay.style.filter = 'blur(10px)';
                    setTimeout(() => { overlay.style.display = 'none'; }, 1000);
                }, 2600);
            }
        });

        let isProcessing = false;

        async function sendChatMessage() {
            if (isProcessing) return;
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            appendChatMessage('YOU', text, 'user');
            isProcessing = true;

            const thinkingId = 'thinking-' + Date.now();
            const box = document.getElementById('terminal-box');
            const thinkingDiv = document.createElement('div');
            thinkingDiv.className = 'chat-msg ai';
            thinkingDiv.id = thinkingId;
            thinkingDiv.innerHTML = `<span class="msg-sender">🤖 VETRI AI KNOWLEDGE ENGINE</span><div class="msg-body" style="color:var(--gold);">🟡 Reading query, specs, Flipkart, Amazon & official brand portals for "${escapeHtml(text)}"...</div>`;
            box.appendChild(thinkingDiv);
            box.scrollTop = box.scrollHeight;

            const responseHtml = await generateUniversalIntentResponseAsync(text);
            
            const el = document.getElementById(thinkingId);
            if (el) el.remove();

            appendChatMessage('🤖 VETRI AI KNOWLEDGE ENGINE', responseHtml, 'ai', true);
            speakText(`Details fetched for ${text}`);
            isProcessing = false;
        }

        function appendChatMessage(sender, text, type, isHtml = false) {
            const box = document.getElementById('terminal-box');
            const msgDiv = document.createElement('div');
            msgDiv.className = `chat-msg ${type}`;
            
            const senderSpan = document.createElement('span');
            senderSpan.className = 'msg-sender';
            senderSpan.textContent = sender;
            
            const bodyDiv = document.createElement('div');
            bodyDiv.className = 'msg-body';
            
            if (isHtml) {
                bodyDiv.innerHTML = text;
            } else {
                bodyDiv.textContent = text;
            }

            msgDiv.appendChild(senderSpan);
            msgDiv.appendChild(bodyDiv);
            box.appendChild(msgDiv);
            box.scrollTop = box.scrollHeight;
        }

        // Multi-Domain & Mobile Brand / Flipkart / Amazon Intelligence Engine
        async function generateUniversalIntentResponseAsync(rawQuery) {
            const query = rawQuery.trim();
            const upper = query.toUpperCase();

            let customSummary = "";
            let categoryTag = "UNIVERSAL KNOWLEDGE";
            let customLinksHtml = "";

            // 1. Mobile Brand, Model Specs, Flipkart, Amazon & Official Store Handler
            if (upper.includes('IPHONE') || upper.includes('SAMSUNG') || upper.includes('ONEPLUS') || upper.includes('REALME') || upper.includes('VIVO') || upper.includes('OPPO') || upper.includes('MOBILE') || upper.includes('SMARTPHONE') || upper.includes('XIAOMI') || upper.includes('REDMI') || upper.includes('POCO') || upper.includes('IQOO') || upper.includes('MOTOROLA')) {
                categoryTag = "📱 MOBILE SPECS, FLIPKART & AMAZON STORES";
                let mobileIntel = getMobileIntelDetails(query, upper);
                customSummary = mobileIntel.summary;

                const flipkartUrl = `https://www.flipkart.com/search?q=${encodeURIComponent(query)}`;
                const amazonUrl = `https://www.amazon.in/s?k=${encodeURIComponent(query)}`;
                const gsmarenaUrl = `https://www.gsmarena.com/res.php3?sSearch=${encodeURIComponent(query)}`;
                const mobiles91Url = `https://www.91mobiles.com/search.php?q=${encodeURIComponent(query)}`;

                customLinksHtml = `
                    <a href="${flipkartUrl}" target="_blank" class="know-link-btn" style="border-color:#2874f0; color:#2874f0;">🛒 Flipkart Store Search ↗</a>
                    <a href="${amazonUrl}" target="_blank" class="know-link-btn" style="border-color:#FF9900; color:#FF9900;">📦 Amazon India Store ↗</a>
                    <a href="${mobileIntel.officialLink}" target="_blank" class="know-link-btn" style="border-color:var(--green); color:var(--green);">🏢 Official Brand Store ↗</a>
                    <a href="${gsmarenaUrl}" target="_blank" class="know-link-btn">📱 GSMArena Detailed Specs ↗</a>
                    <a href="${mobiles91Url}" target="_blank" class="know-link-btn">⚡ 91mobiles Price Compare ↗</a>
                `;
            }

            // 2. Video Games, Play Store Games & Composer Intel Engine (500+ Game Portals)
            else if (upper.includes('GAME') || upper.includes('PLAYSTORE') || upper.includes('GTA') || upper.includes('PUBG') || upper.includes('BGMI') || upper.includes('FREE FIRE') || upper.includes('MINECRAFT') || upper.includes('GOD OF WAR') || upper.includes('CYBERPUNK') || upper.includes('SUBWAY SURFERS') || upper.includes('CLASH OF CLANS') || upper.includes('ELDEN RING') || upper.includes('WITCHER') || upper.includes('LUDO') || upper.includes('CALL OF DUTY') || upper.includes('ROBLOX') || upper.includes('VALORANT') || upper.includes('FORTNITE') || upper.includes('STEAM')) {
                categoryTag = "🎮 GAME INTEL & 500+ GAME PORTALS";
                
                let gameDetails = getGameIntelDetails(query, upper);
                customSummary = gameDetails.summary;

                customLinksHtml = `
                    <a href="https://play.google.com/store/search?q=${encodeURIComponent(query)}&c=apps" target="_blank" class="know-link-btn" style="border-color:var(--green); color:var(--green);">🤖 Google Play Store Games ↗</a>
                    <a href="https://www.apple.com/us/search/${encodeURIComponent(query)}?src=globalnav_apps" target="_blank" class="know-link-btn">🍎 Apple App Store Games ↗</a>
                    <a href="https://rawg.io/search?query=${encodeURIComponent(query)}" target="_blank" class="know-link-btn">🎮 RAWG 500,000+ Game Database ↗</a>
                    <a href="https://store.steampowered.com/search/?term=${encodeURIComponent(query)}" target="_blank" class="know-link-btn">🕹️ Steam PC Gaming Store ↗</a>
                    <a href="https://www.ign.com/search?q=${encodeURIComponent(query)}" target="_blank" class="know-link-btn">⚡ IGN Game Reviews & Guides ↗</a>
                    <a href="https://vgmdb.net/search?q=${encodeURIComponent(query)}" target="_blank" class="know-link-btn">🎵 VGMdb Game Music Composers ↗</a>
                `;
            }

            // 3. FLAMES Game Handler
            else if (upper.includes('FLAMES') || upper.includes('LOVE CALCULATOR') || upper.includes('FRIEND OR ENEMY')) {
                categoryTag = "🔥 FLAMES GAME CALCULATOR";
                let names = extractNamesFromFlames(query);
                let flamesRes = runFlamesAlgorithm(names.n1, names.n2);
                
                customSummary = `🔥 <strong>FLAMES GAME RESULT FOR: ${escapeHtml(names.n1.toUpperCase())} & ${escapeHtml(names.n2.toUpperCase())}</strong><br><br>
                • <strong>Name 1:</strong> ${escapeHtml(names.n1)}<br>
                • <strong>Name 2:</strong> ${escapeHtml(names.n2)}<br>
                • <strong>Common Letter Count:</strong> ${flamesRes.count}<br>
                • <strong>FLAMES Relationship Outcome:</strong> <span style="color:var(--gold); font-weight:900; font-size:16px;">${flamesRes.result} (${flamesRes.emoji})</span><br><br>
                <em>FLAMES Key: F = Friends, L = Love, A = Affection, M = Marriage, E = Enemies, S = Siblings.</em>`;

                customLinksHtml = `
                    <a href="attacks_flames.html" class="know-link-btn" style="border-color:var(--gold); color:var(--gold);">🔥 Play Vetri Arcade FLAMES ↗</a>
                    <a href="https://www.google.com/search?q=flames+calculator+online" target="_blank" class="know-link-btn">💖 Online FLAMES Hub ↗</a>
                `;
            }

            // 4. Physics, Chemistry, Biology, Zoology & Science
            else if (upper.includes('PHYSICS') || upper.includes('CHEMISTRY') || upper.includes('BIOLOGY') || upper.includes('ZOOLOGY') || upper.includes('BOTANY') || upper.includes('ATOM') || upper.includes('GENETICS')) {
                categoryTag = "⚛️ SCIENCE & ACADEMIC PORTALS";
                customSummary = `🔬 <strong>Science & Experimental Knowledge:</strong> "${escapeHtml(query)}"<br><br>Vetri AI processed science query. Access interactive lab simulations, chemical structures, biological taxonomies, and physics formulas below.`;
                
                customLinksHtml = `
                    <a href="https://phet.colorado.edu/en/simulations/filter?type=html" target="_blank" class="know-link-btn">⚛️ PhET Physics & Chemistry Sims ↗</a>
                    <a href="https://pubchem.ncbi.nlm.nih.gov/#query=${encodeURIComponent(query)}" target="_blank" class="know-link-btn">🧪 PubChem Chemistry Index ↗</a>
                    <a href="https://www.khanacademy.org/science" target="_blank" class="know-link-btn">🏫 Khan Academy Science ↗</a>
                    <a href="https://pubmed.ncbi.nlm.nih.gov/?term=${encodeURIComponent(query)}" target="_blank" class="know-link-btn">🦁 PubMed Biology & Zoology ↗</a>
                `;
            }

            // 5. Maths & Aptitude Engine
            else if (upper.includes('MATH') || upper.includes('APTITUDE') || upper.includes('PERCENTAGE') || upper.includes('PROBABILITY') || upper.includes('SPEED') || upper.includes('DISTANCE') || upper.includes('TIME AND WORK')) {
                categoryTag = "🧮 MATHS & APTITUDE ENGINE";
                const mathResult = tryEvaluateMath(upper);
                if (mathResult) {
                    customSummary = mathResult;
                } else {
                    customSummary = `🧮 <strong>Aptitude & Mathematics Breakdown:</strong> "${escapeHtml(query)}"<br><br>

        // Helper FLAMES Extractor & Algorithm
        function extractNamesFromFlames(str) {
            let cleaned = str.replace(/FLAMES|CALCULATE|LOVE|GAME|AND|WITH|TEST/gi, ' ').trim();
            let parts = cleaned.split(/\s+/).filter(Boolean);
            if (parts.length >= 2) {
                return { n1: parts[0], n2: parts[1] };
            }
            return { n1: parts[0] || "Vijay", n2: "Trisha" };
        }

        function runFlamesAlgorithm(name1, name2) {
            let n1 = name1.toLowerCase().replace(/[^a-z]/g, '');
            let n2 = name2.toLowerCase().replace(/[^a-z]/g, '');
            let arr1 = n1.split('');
            let arr2 = n2.split('');
            
            for (let i = 0; i < arr1.length; i++) {
                let idx = arr2.indexOf(arr1[i]);
                if (idx !== -1) {
                    arr1[i] = '';
                    arr2[idx] = '';
                }
            }
            let count = arr1.join('').length + arr2.join('').length;
            if (count === 0) return { result: "Siblings", emoji: "👫", count: 0 };

            let flames = [
                { name: "Friends", emoji: "🤝" },
                { name: "Love", emoji: "💖" },
                { name: "Affection", emoji: "😊" },
                { name: "Marriage", emoji: "💍" },
                { name: "Enemies", emoji: "⚔️" },
                { name: "Siblings", emoji: "👫" }
            ];
            let idx = 0;
            while (flames.length > 1) {
                idx = (idx + count - 1) % flames.length;
                flames.splice(idx, 1);
            }
            return { result: flames[0].name, emoji: flames[0].emoji, count: count };
        }

        function tryEvaluateMath(str) {

                const cleaned = str.replace(/[^0-9\+\-\*\/\.\(\)\^]/g, '');
                if (cleaned.length >= 3 && /[0-9]/.test(cleaned) && /[\+\-\*\/]/.test(cleaned)) {
                    const ans = Function(`'use strict'; return (${cleaned.replace(/\^/g, '**')})`)();
                    if (typeof ans === 'number' && !isNaN(ans) && isFinite(ans)) {
                        return `🧮 Math Calculation Result:\n${cleaned} = ${ans}`;
                    }
                }
            } catch(e){}
            return null;
        }

        function toggleVoiceInput() {
            if (!SpeechRecognition) {
                alert('Voice speech recognition is not supported in this browser.');
                return;

            const btn = document.getElementById('mic-btn');
            if (isListening) {
                if (speechRecognizer) speechRecognizer.stop();

            } else {
                speechRecognizer = new SpeechRecognition();
                speechRecognizer.continuous = false;
                speechRecognizer.interimResults = false;
                speechRecognizer.lang = 'en-US';

                speechRecognizer.onresult = (event) => {

                    document.getElementById('chat-input').value = text;

                speechRecognizer.onerror = () => {
                    isListening = false;
                    btn.classList.remove('listening');
                };

                speechRecognizer.start();
                isListening = true;
                btn.classList.add('listening');
            }
        }

        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const cleanText = text.replace(/<[^>]*>?/gm, '');
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        (function() {
            const canvas = document.getElementById('particle-bg');
            const ctx = canvas.getContext('2d');
            let W, H, particles = [];

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }

            resize();
            window.addEventListener('resize', resize);

            for (let i = 0; i < 40; i++) {
                particles.push({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight,
                    r: Math.random() * 1.4 + 0.4,
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.3,
                    alpha: Math.random() * 0.35 + 0.1
                });
            }

            function draw() {
                ctx.clearRect(0, 0, W, H);
                particles.forEach(p => {
                    p.x += p.vx; p.y += p.vy;
                    if (p.x < 0 || p.x > W) p.vx *= -1;
                    if (p.y < 0 || p.y > H) p.vy *= -1;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0, 255, 255, ${p.alpha})`;
                    ctx.fill();
                });
                requestAnimationFrame(draw);
            }
            draw();
        })();
    </script>
</body>
</html>
