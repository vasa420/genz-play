<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VETRI AI STUDIO | Context-Aware Universal AI Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&family=JetBrains+Mono:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00FFFF;
            --primary-glow: rgba(0, 255, 255, 0.45);
            --secondary: #8A2BE2;
            --green: #00FF88;
            --green-glow: rgba(0, 255, 136, 0.35);
            --gold: #FFD700;
            --gold-glow: rgba(255, 215, 0, 0.35);
            --bg: #03030b;
            --card-bg: rgba(10, 10, 24, 0.85);
            --border: rgba(0, 255, 255, 0.25);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body, html {
            width: 100%; height: 100%;
            background: var(--bg); color: #fff;
            font-family: 'Outfit', sans-serif;
            overflow: hidden; display: flex; flex-direction: column;
        }

        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.14), rgba(0,0,0,0.14) 1.5px, transparent 1.5px, transparent 3px);
            pointer-events: none; z-index: 9999; opacity: 0.6;
        }

        #particle-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
        }

        .top-navbar {
            width: 100%; padding: 18px 35px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 100; background: rgba(5, 5, 18, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(0, 255, 255, 0.15);
        }

        .nav-logo {
            font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 900;
            letter-spacing: 3px; text-transform: uppercase;
            background: linear-gradient(135deg, #00FFFF, #8A2BE2);
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
            display: flex; align-items: center; gap: 10px;
        }

        .btn-back {
            background: rgba(0, 255, 255, 0.08); border: 1px solid rgba(0, 255, 255, 0.3);
            color: var(--primary); padding: 10px 20px; font-family: 'JetBrains Mono', monospace;
            font-size: 11px; font-weight: 700; letter-spacing: 2px; border-radius: 8px;
            cursor: pointer; transition: 0.3s; text-decoration: none;
            display: inline-flex; align-items: center; gap: 8px;
        }

        .btn-back:hover {
            background: var(--primary); color: #000; box-shadow: 0 0 20px var(--primary-glow);
        }

        .chat-container {
            position: relative; z-index: 10;
            flex: 1; width: 100%; max-width: 100%; margin: 0;
            display: flex; flex-direction: column; padding: 15px 25px 20px;
            box-sizing: border-box; height: calc(100vh - 65px);
        }

        .chat-card {
            flex: 1; width: 100%; display: flex; flex-direction: column;
            background: var(--card-bg); border: 1.5px solid var(--border);
            border-radius: 20px; padding: 20px; backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 35px rgba(0, 255, 255, 0.15);
            overflow: hidden;
        }

        .mode-tabs {
            display: flex; gap: 12px; margin-bottom: 12px; width: 100%; justify-content: center;
        }

        .mode-tab-btn {
            flex: 1; padding: 12px 18px;
            background: rgba(0, 255, 255, 0.06);
            border: 1.5px solid rgba(0, 255, 255, 0.25);
            color: rgba(255, 255, 255, 0.7);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px; font-weight: 900; letter-spacing: 2px;
            border-radius: 12px; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            text-transform: uppercase; text-align: center; backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center;
        }

        .mode-tab-btn:hover {
            color: #fff; border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow); transform: translateY(-2px);
        }

        .mode-tab-btn.active {
            background: linear-gradient(135deg, #00FFFF, #8A2BE2);
            color: #fff; border-color: var(--primary);
            box-shadow: 0 0 25px var(--primary-glow);
        }

        .terminal-box {
            flex: 1; background: rgba(4, 4, 12, 0.95);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 16px; padding: 20px;
            overflow-y: auto; display: flex; flex-direction: column; gap: 16px;
            scroll-behavior: smooth; margin-bottom: 18px;
        }

        .terminal-box::-webkit-scrollbar { width: 6px; }
        .terminal-box::-webkit-scrollbar-thumb { background: rgba(0, 255, 255, 0.3); border-radius: 4px; }

        .chat-msg {
            display: flex; flex-direction: column; gap: 4px;
            max-width: 96%; width: 96%; animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .chat-msg.user { align-self: flex-end; align-items: flex-end; }
        .chat-msg.ai { align-self: flex-start; align-items: flex-start; }

        .msg-sender {
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px; letter-spacing: 2px; color: rgba(255,255,255,0.4);
            text-transform: uppercase;
        }

        .msg-body {
            padding: 14px 20px; border-radius: 14px;
            font-family: 'Outfit', sans-serif; font-size: 14px; line-height: 1.6;
            white-space: pre-wrap; word-break: break-word; width: 100%;
        }

        .chat-msg.user .msg-body {
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.2), rgba(138, 43, 226, 0.2));
            border: 1px solid rgba(0, 255, 255, 0.4); color: #fff;
            border-bottom-right-radius: 2px; width: auto;
        }

        .chat-msg.ai .msg-body {
            background: rgba(10, 24, 40, 0.85);
            border: 1px solid rgba(0, 255, 136, 0.35); color: var(--green);
            border-bottom-left-radius: 2px; text-shadow: 0 0 5px rgba(0,255,136,0.2);
        }

        .code-block-box {
            background: rgba(4, 4, 12, 0.95);
            border: 1.5px solid rgba(0, 255, 136, 0.4);
            border-radius: 10px; padding: 16px 20px;
            font-family: 'JetBrains Mono', monospace; font-size: 13px;
            color: var(--green); overflow-x: auto; white-space: pre;
            margin: 10px 0 4px; box-shadow: inset 0 0 20px rgba(0,255,136,0.1);
        }

        .knowledge-card {
            background: rgba(5, 15, 30, 0.9);
            border: 1.5px solid rgba(0, 255, 255, 0.35);
            border-radius: 14px; padding: 16px; margin-top: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .knowledge-card-title {
            font-family: 'JetBrains Mono', monospace; font-size: 11px;
            letter-spacing: 2px; color: var(--primary); text-transform: uppercase;
            margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between;
        }

        .intent-tag {
            background: rgba(255, 215, 0, 0.15); border: 1px solid var(--gold);
            color: var(--gold); padding: 3px 10px; border-radius: 6px; font-size: 10px;
        }

        .links-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px;
        }

        .know-link-btn {
            background: rgba(0, 255, 255, 0.08); border: 1px solid rgba(0, 255, 255, 0.25);
            color: #fff; padding: 10px 14px; border-radius: 8px; font-family: 'JetBrains Mono', monospace;
            font-size: 11px; text-decoration: none; transition: 0.25s; display: flex; align-items: center; justify-content: space-between;
        }

        .know-link-btn:hover {
            background: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary-glow);
            transform: translateY(-2px);
        }

        .chat-input-wrapper { display: flex; gap: 12px; align-items: center; }

        .chat-input {
            flex: 1; padding: 16px 22px;
            background: rgba(4, 4, 12, 0.9);
            border: 1.5px solid rgba(0, 255, 255, 0.35);
            border-radius: 14px; color: #fff;
            font-family: 'Outfit', sans-serif; font-size: 15px;
            outline: none; transition: 0.3s;
        }

        .chat-input:focus {
            border-color: var(--primary); box-shadow: 0 0 20px var(--primary-glow);
        }

        .btn-mic {
            width: 52px; height: 52px; border-radius: 14px;
            background: rgba(0, 255, 255, 0.1); border: 1.5px solid rgba(0, 255, 255, 0.35);
            color: var(--primary); font-size: 20px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: 0.3s;
        }

        .btn-mic:hover {
            background: var(--primary); color: #000; box-shadow: 0 0 20px var(--primary-glow);
        }

        .btn-mic.listening {
            background: #FF2244; border-color: #FF2244; color: #fff;
            animation: pulseMic 1s infinite;
        }

        @keyframes pulseMic { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }

        .btn-send {
            padding: 16px 28px;
            background: linear-gradient(90deg, 
                #00FFFF 0%, 
                #00FF88 20%, 
                #8A2BE2 40%, 
                #FF007F 60%, 
                #FF9900 80%, 
                #00FFFF 100%
            );
            background-size: 300% 100%;
            color: #000; border: none; border-radius: 14px;
            font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 900;
            letter-spacing: 2px; cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
            animation: sendGradientWave 5s ease-in-out infinite;
        }

        @keyframes sendGradientWave {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .btn-send:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 0 35px rgba(0, 255, 255, 0.8);
        }

        @keyframes slowFadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slowZoomIn { from { opacity: 0; transform: scale(0.92) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    </style>
</head>
<body>

    <div class="scanlines"></div>
    <canvas id="particle-bg"></canvas>

    <!-- INTRO SPLASH OVERLAY: WELCOME TO VETRI STUDIOS -->
    <div id="vetri-intro-overlay" style="
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #03030b; z-index: 99999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), filter 1s ease;
        text-align: center; padding: 30px; box-sizing: border-box;
    ">
        <div style="
            font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 8px;
            color: #00FFFF; margin-bottom: 20px; text-transform: uppercase;
            text-shadow: 0 0 20px rgba(0,255,255,0.6);
            animation: slowFadeIn 1.5s ease-out forwards;
        ">
            ⚡ SYSTEM INITIALIZING
        </div>

        <h1 style="
            font-size: clamp(32px, 6vw, 68px); font-weight: 900; letter-spacing: 6px;
            background: linear-gradient(135deg, #FFFFFF 0%, #00FFFF 40%, #8A2BE2 75%, #FFD700 100%);
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
            text-transform: uppercase; margin: 0 0 20px 0;
            text-shadow: 0 10px 40px rgba(0, 255, 255, 0.3);
            opacity: 0; transform: scale(0.95);
            animation: slowZoomIn 2.2s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
        ">
            WELCOME TO VETRI STUDIOS
        </h1>

        <div style="
            font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 4px;
            color: rgba(255,255,255,0.6); text-transform: uppercase;
            opacity: 0; animation: slowFadeIn 1.5s ease-out 1.2s forwards;
        ">
            INITIALIZING CONTEXT-AWARE CONVERSATIONAL AI ENGINE...
        </div>

        <div style="
            width: 200px; height: 3px; background: rgba(255,255,255,0.1);
            border-radius: 10px; margin-top: 35px; overflow: hidden; position: relative;
        ">
            <div id="intro-progress-bar" style="
                width: 0%; height: 100%; background: linear-gradient(90deg, #00FFFF, #8A2BE2, #FFD700);
                border-radius: 10px; transition: width 2.5s cubic-bezier(0.16, 1, 0.3, 1);
            "></div>
        </div>
    </div>

    <!-- Top Navigation Bar -->
    <nav class="top-navbar">
        <div class="nav-logo">
            <span>⚡</span> VETRI AI STUDIO · CONVERSATIONAL MEMORY & SEARCH ENGINE
        </div>
        <a class="btn-back" href="arcade_hub.html">← RETURN BACK</a>
    </nav>

    <!-- Main Chat Workspace -->
    <div class="chat-container">
        <div class="chat-card">

            <!-- 3 Dedicated Modes Switcher -->
            <div class="mode-tabs">
                <button type="button" class="mode-tab-btn active" id="tab-btn-normal" onclick="switchStudioMode('normal')">💬 UNIVERSAL SEARCH & CHAT HUB</button>
                <button type="button" class="mode-tab-btn" id="tab-btn-code" onclick="switchStudioMode('code')">💻 CODE CHAT</button>
                <button type="button" class="mode-tab-btn" id="tab-btn-image" onclick="switchStudioMode('image')">🎨 IMAGE GENERATION</button>
            </div>

            <!-- Terminal Output Window -->
            <div class="terminal-box" id="terminal-box">
                <div class="chat-msg ai">
                    <span class="msg-sender">🤖 VETRI AI</span>
                    <div class="msg-body" style="font-weight: 700; font-size: 16px; letter-spacing: 1px; color: var(--green);">WELCOME TO VETRI AI</div>
                </div>
            </div>

            <!-- Chat Input Controls -->
            <div class="chat-input-wrapper">
                <button class="btn-mic" id="mic-btn" onclick="toggleVoiceInput()" title="Voice Input Mic">🎙️</button>
                <input type="text" id="chat-input" class="chat-input" placeholder="ASK ANYTHING WITH VETRI AI..." onkeydown="if(event.key==='Enter')sendChatMessage()">
                <button class="btn-send" id="main-send-btn" onclick="sendChatMessage()">🌐 SEARCH & CHAT</button>
            </div>

        </div>
    </div>

    <script>
        let currentMode = 'normal';
        let isProcessing = false;
        let conversationMemory = []; // Conversation Memory History Array

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const initialMode = urlParams.get('mode');
            if (initialMode && ['normal', 'code', 'image'].includes(initialMode)) {
                switchStudioMode(initialMode, true);
            }

            const overlay = document.getElementById('vetri-intro-overlay');
            const progress = document.getElementById('intro-progress-bar');
            if (progress) setTimeout(() => { progress.style.width = '100%'; }, 100);
            if (overlay) {
                setTimeout(() => {
                    overlay.style.opacity = '0';
                    overlay.style.filter = 'blur(10px)';
                    setTimeout(() => { overlay.style.display = 'none'; }, 1000);
                }, 2600);
            }
        });

        // Smart Conversational Context Resolver (Connects follow-up questions to previous chat context)
        function resolveContextualQuery(rawQuery) {
            const text = rawQuery.trim();
            const upper = text.toUpperCase();

            // Record current user input into memory
            conversationMemory.push({ role: 'user', text: text });

            // Check if current input is a follow-up pronoun or question
            const isFollowUp = (
                upper.includes('YEAR') || upper.includes('WHEN') || upper.includes('WHO') ||
                upper.includes('FOUNDER') || upper.includes('LEADER') || upper.includes('PRICE') ||
                upper.includes('WHERE') || upper.includes('HOW') || upper.includes('MORE') ||
                upper.includes('WHY') || upper.includes('DATE') || upper.includes('AGE') ||
                upper.includes('IT') || upper.includes('THAT') || upper.includes('HE') || upper.includes('SHE') ||
                text.split(' ').length <= 4
            );

            let resolvedQuery = text;
            let topicContext = "";
            let hasContext = false;

            if (isFollowUp && conversationMemory.length > 1) {
                // Find the previous primary user question in conversation memory
                for (let i = conversationMemory.length - 2; i >= 0; i--) {
                    if (conversationMemory[i].role === 'user') {
                        const prevTopic = conversationMemory[i].text;
                        resolvedQuery = `${prevTopic} ${text}`;
                        topicContext = prevTopic;
                        hasContext = true;
                        console.log(`🧠 Vetri AI Context Linked: "${text}" ➔ "${resolvedQuery}"`);
                        break;
                    }
                }
            }

            return { resolvedQuery, topicContext, hasContext };
        }

        function switchStudioMode(mode, silent = false) {
            if (currentMode === mode && !silent) return;
            currentMode = mode;

            document.getElementById('tab-btn-normal').classList.toggle('active', mode === 'normal');
            document.getElementById('tab-btn-code').classList.toggle('active', mode === 'code');
            document.getElementById('tab-btn-image').classList.toggle('active', mode === 'image');

            const input = document.getElementById('chat-input');
            const sendBtn = document.getElementById('main-send-btn');

            if (mode === 'normal') {
                input.placeholder = "ASK ANYTHING WITH VETRI AI...";
                sendBtn.innerHTML = "🌐 SEARCH & CHAT";
                if (!silent) appendSystemModeNotice("💬 Switched to Universal Search & Knowledge Hub Mode");
            } else if (mode === 'code') {
                input.placeholder = "Describe code requirement... (e.g. C++ Binary Search, Java Quicksort, Python Script)";
                sendBtn.innerHTML = "💻 GENERATE CODE";
                if (!silent) appendSystemModeNotice("💻 Switched to Code Generator Mode (C, C++, Java, Python, HTML/JS)");
            } else if (mode === 'image') {
                input.placeholder = "Describe 8K photo to generate... (e.g. Futuristic Cyberpunk City at sunset)";
                sendBtn.innerHTML = "🎨 GENERATE PHOTO";
                if (!silent) appendSystemModeNotice("🎨 Switched to 8K AI Image Studio (High Resolution Downloadable Art)");
            }
        }

        function appendSystemModeNotice(text) {
            const box = document.getElementById('terminal-box');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'chat-msg ai';
            msgDiv.innerHTML = `<span class="msg-sender">⚡ STUDIO MODE CHANGED</span><div class="msg-body" style="background:rgba(0,255,255,0.08); border:1.5px solid var(--primary); color:var(--primary); font-weight:700;">${text}</div>`;
            box.appendChild(msgDiv);
            box.scrollTop = box.scrollHeight;
        }

        async function sendChatMessage() {
            if (isProcessing) return;
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            appendChatMessage('YOU', text, 'user');
            isProcessing = true;

            const thinkingId = 'thinking-' + Date.now();
            const box = document.getElementById('terminal-box');
            const thinkingDiv = document.createElement('div');
            thinkingDiv.className = 'chat-msg ai';
            thinkingDiv.id = thinkingId;

            if (currentMode === 'normal') {
                thinkingDiv.innerHTML = `<span class="msg-sender">🤖 VETRI AI</span><div class="msg-body" style="color:var(--gold);">🟡 Analyzing conversation context & searching web for "${escapeHtml(text)}"...</div>`;
            } else if (currentMode === 'code') {
                thinkingDiv.innerHTML = `<span class="msg-sender">🤖 VETRI CODE AI</span><div class="msg-body" style="color:var(--gold);">🟡 Generating clean syntax code blocks for "${escapeHtml(text)}"...</div>`;
            } else if (currentMode === 'image') {
                thinkingDiv.innerHTML = `<span class="msg-sender">🤖 VETRI ART AI</span><div class="msg-body" style="color:var(--gold);">🎨 Rendering 8K Widescreen AI Photo for "${escapeHtml(text)}"...</div>`;
            }

            box.appendChild(thinkingDiv);
            box.scrollTop = box.scrollHeight;

            if (currentMode === 'normal') {
                const responseHtml = await generateUniversalIntentResponseAsync(text);
                const el = document.getElementById(thinkingId);
                if (el) el.remove();
                appendChatMessage('🤖 VETRI AI', responseHtml, 'ai', true);
                speakText(`Answer retrieved.`);
            } else if (currentMode === 'code') {
                setTimeout(() => {
                    const el = document.getElementById(thinkingId);
                    if (el) el.remove();
                    const codeResp = generateCodeResponse(text);
                    appendChatMessage('🤖 VETRI CODE AI', codeResp, 'ai');
                    speakText('Code generated successfully.');
                }, 600);
            } else if (currentMode === 'image') {
                setTimeout(() => {
                    const el = document.getElementById(thinkingId);
                    if (el) el.remove();
                    const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(text)}?width=1280&height=720&nologo=true`;
                    appendImageMessage('🤖 VETRI ART AI', text, imgUrl);
                    speakText('8K AI Image generated successfully.');
                }, 1200);
            }

            isProcessing = false;
        }

        function appendChatMessage(sender, text, type, isHtml = false) {
            const box = document.getElementById('terminal-box');
            const msgDiv = document.createElement('div');
            msgDiv.className = `chat-msg ${type}`;
            
            const senderSpan = document.createElement('span');
            senderSpan.className = 'msg-sender';
            senderSpan.textContent = sender;
            
            const bodyDiv = document.createElement('div');
            bodyDiv.className = 'msg-body';
            
            if (isHtml) {
                bodyDiv.innerHTML = text;
            } else if (text.includes('```')) {
                bodyDiv.innerHTML = formatCodeBlocks(text);
            } else {
                bodyDiv.textContent = text;
            }

            msgDiv.appendChild(senderSpan);
            msgDiv.appendChild(bodyDiv);
            box.appendChild(msgDiv);
            box.scrollTop = box.scrollHeight;
        }

        function appendImageMessage(sender, promptText, imageUrl) {
            const box = document.getElementById('terminal-box');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'chat-msg ai';

            const senderSpan = document.createElement('span');
            senderSpan.className = 'msg-sender';
            senderSpan.textContent = sender;

            const bodyDiv = document.createElement('div');
            bodyDiv.className = 'msg-body';
            bodyDiv.style.cssText = 'background: rgba(10, 10, 24, 0.95); border: 1.5px solid var(--primary); padding: 18px; border-radius: 18px; width: 100%;';
            bodyDiv.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                    <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 2px; color: var(--primary);">🎨 8K WIDESCREEN AI PHOTO: "${escapeHtml(promptText)}"</div>
                    <a href="${imageUrl}" target="_blank" download="vetri_ai_art.jpg" style="background:rgba(0,255,255,0.15); border:1px solid var(--primary); color:var(--primary); padding:4px 12px; font-family:'JetBrains Mono', monospace; font-size:10px; border-radius:6px; text-decoration:none; font-weight:700;">📥 DOWNLOAD 8K</a>
                </div>
                <img src="${imageUrl}" style="width: 100%; max-height: 550px; object-fit: cover; border-radius: 14px; box-shadow: 0 10px 35px rgba(0,0,0,0.9); border: 1.5px solid rgba(0,255,255,0.4);" alt="AI Image" onerror="this.onerror=null; this.src='https://picsum.photos/1280/720?blur=1';">
            `;

            msgDiv.appendChild(senderSpan);
            msgDiv.appendChild(bodyDiv);
            box.appendChild(msgDiv);
            box.scrollTop = box.scrollHeight;
        }

        function formatCodeBlocks(text) {
            const parts = text.split(/```/);
            let html = '';
            for (let i = 0; i < parts.length; i++) {
                if (i % 2 === 1) {
                    html += `<div class="code-block-box">${escapeHtml(parts[i].trim())}</div>`;
                } else {
                    html += escapeHtml(parts[i]);
                }
            }
            return html;
        }

        // Helper FLAMES Extractor & Algorithm
        function extractNamesFromFlames(str) {
            let cleaned = str.replace(/FLAMES|CALCULATE|LOVE|GAME|AND|WITH|TEST/gi, ' ').trim();
            let parts = cleaned.split(/\s+/).filter(Boolean);
            if (parts.length >= 2) {
                return { n1: parts[0], n2: parts[1] };
            }
            return { n1: parts[0] || "Vijay", n2: "Trisha" };
        }

        function runFlamesAlgorithm(name1, name2) {
            let n1 = name1.toLowerCase().replace(/[^a-z]/g, '');
            let n2 = name2.toLowerCase().replace(/[^a-z]/g, '');
            let arr1 = n1.split('');
            let arr2 = n2.split('');
            
            for (let i = 0; i < arr1.length; i++) {
                let idx = arr2.indexOf(arr1[i]);
                if (idx !== -1) {
                    arr1[i] = '';
                    arr2[idx] = '';
                }
            }
            let count = arr1.join('').length + arr2.join('').length;
            if (count === 0) return { result: "Siblings", emoji: "👫", count: 0 };

            let flames = [
                { name: "Friends", emoji: "🤝" },
                { name: "Love", emoji: "💖" },
                { name: "Affection", emoji: "😊" },
                { name: "Marriage", emoji: "💍" },
                { name: "Enemies", emoji: "⚔️" },
                { name: "Siblings", emoji: "👫" }
            ];
            let idx = 0;
            while (flames.length > 1) {
                idx = (idx + count - 1) % flames.length;
                flames.splice(idx, 1);
            }
            return { result: flames[0].name, emoji: flames[0].emoji, count: count };
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        let speechRecognizer = null;
        let isListening = false;
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        function toggleVoiceInput() {
            if (!SpeechRecognition) {
                alert('Voice speech recognition is not supported in this browser.');
                return;
            }
            const btn = document.getElementById('mic-btn');
            if (isListening) {
                if (speechRecognizer) speechRecognizer.stop();
                isListening = false;
                btn.classList.remove('listening');
            } else {
                speechRecognizer = new SpeechRecognition();
                speechRecognizer.continuous = false;
                speechRecognizer.interimResults = false;
                speechRecognizer.lang = 'en-US';

                speechRecognizer.onresult = (event) => {
                    const text = event.results[0][0].transcript;
                    document.getElementById('chat-input').value = text;
                    sendChatMessage();
                    isListening = false;
                    btn.classList.remove('listening');
                };

                speechRecognizer.onerror = () => {
                    isListening = false;
                    btn.classList.remove('listening');
                };

                speechRecognizer.start();
                isListening = true;
                btn.classList.add('listening');
            }
        }

        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const cleanText = text.replace(/<[^>]*>?/gm, '');
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        (function() {
            const canvas = document.getElementById('particle-bg');
            const ctx = canvas.getContext('2d');
            let W, H, particles = [];

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }

            resize();
            window.addEventListener('resize', resize);

            for (let i = 0; i < 40; i++) {
                particles.push({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight,
                    r: Math.random() * 1.4 + 0.4,
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.3,
                    alpha: Math.random() * 0.35 + 0.1
                });
            }

            function draw() {
                ctx.clearRect(0, 0, W, H);
                particles.forEach(p => {
                    p.x += p.vx; p.y += p.vy;
                    if (p.x < 0 || p.x > W) p.vx *= -1;
                    if (p.y < 0 || p.y > H) p.vy *= -1;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0, 255, 255, ${p.alpha})`;
                    ctx.fill();
                });
                requestAnimationFrame(draw);
            }
            draw();
        })();
