<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SURVIVE IT | Forest Road</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --primary: #39ff14;
            --primary-glow: rgba(57, 255, 20, 0.4);
            --danger: #ff3333;
            --danger-glow: rgba(255, 51, 51, 0.45);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        html, body {
            background: #020205;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            width: 100%; height: 100%;
            overflow: hidden;
        }

        #game-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Scanlines Overlay */
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0.15), rgba(0,0,0,0.15) 1.5px,
                transparent 1.5px, transparent 3px
            );
            pointer-events: none; z-index: 9999; opacity: 0.85;
        }

        /* CRT Screen Glow */
        .crt-glow {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 65%, rgba(0,0,0,0.4) 100%);
            pointer-events: none; z-index: 9998;
        }

        /* Dimming transition overlay */
        #fade-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            opacity: 0;
            pointer-events: none;
            z-index: 10;
            transition: opacity 1.5s ease-in-out;
        }

        /* UI Overlays */
        .hud-container {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }

        .hud-title {
            background: rgba(2, 2, 5, 0.8);
            border: 1px solid var(--danger);
            box-shadow: 0 0 15px var(--danger-glow);
            padding: 8px 24px;
            border-radius: 4px;
            font-size: clamp(12px, 2.5vw, 16px);
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--danger);
            text-transform: uppercase;
        }

        .hud-sub {
            background: rgba(2, 2, 5, 0.7);
            padding: 4px 16px;
            border-radius: 4px;
            font-size: clamp(10px, 2vw, 12px);
            color: #fff;
            letter-spacing: 2px;
        }

        /* Timer HUD */
        .timer-hud {
            position: absolute;
            top: 25px;
            right: 25px;
            background: rgba(2, 2, 5, 0.8);
            border: 1px solid var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
            color: var(--primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 20px;
            font-weight: 700;
            padding: 10px 18px;
            border-radius: 4px;
            letter-spacing: 2px;
            z-index: 5;
            pointer-events: none;
        }

        /* Controls Help Footer */
        .controls-help {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(2, 2, 5, 0.75);
            padding: 10px 24px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-size: clamp(10px, 2.2vw, 13px);
            letter-spacing: 2px;
            text-align: center;
            color: rgba(255, 255, 255, 0.85);
            z-index: 5;
            pointer-events: none;
        }

        .controls-help span {
            color: var(--primary);
            font-weight: 700;
        }

        /* Lobby Return button (always visible) */
        .btn-lobby {
            position: absolute;
            top: 25px;
            left: 25px;
            background: rgba(2, 2, 5, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.8);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            padding: 10px 18px;
            border-radius: 4px;
            cursor: pointer;
            z-index: 5;
            transition: 0.3s;
        }
        .btn-lobby:hover {
            border-color: var(--danger);
            color: #fff;
            box-shadow: 0 0 10px var(--danger-glow);
            transform: translateY(-2px);
        }

        /* Dashcam HUD style */
        .dashcam-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            padding: 30px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
            z-index: 4;
            font-family: 'JetBrains Mono', monospace;
            text-shadow: 0 0 4px #000;
        }

        .dashcam-top {
            display: flex;
            justify-content: space-between;
            font-size: clamp(10px, 2vw, 14px);
            font-weight: 700;
            letter-spacing: 2px;
        }

        .dashcam-rec {
            color: var(--danger);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dashcam-dot {
            width: 10px; height: 10px;
            background: var(--danger);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--danger-glow);
            animation: recBlink 1s infinite alternate;
        }

        @keyframes recBlink {
            0% { opacity: 0.2; }
            100% { opacity: 1; }
        }

        .dashcam-bottom {
            display: flex;
            justify-content: space-between;
            font-size: clamp(10px, 1.8vw, 13px);
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.85);
        }

        .dashcam-speed span {
            color: var(--primary);
            font-weight: 700;
        }

        /* Windshield Blood Overlay Effects */
        .windshield-blood-splat {
            position: absolute;
            background: radial-gradient(circle, #8a0303 10%, #5c0202 55%, rgba(92,2,2,0) 75%);
            border-radius: 50% 38% 62% 45% / 48% 65% 35% 52%;
            transform-origin: center;
            filter: drop-shadow(0 0 6px rgba(0,0,0,0.85)) blur(1px);
            pointer-events: none;
            opacity: 0;
        }

        .windshield-blood-drip {
            position: absolute;
            width: 3px;
            background: linear-gradient(to bottom, rgba(92,2,2,0.95), rgba(50,0,0,0));
            filter: blur(0.5px);
            pointer-events: none;
            opacity: 0;
            transform-origin: top;
        }

        @keyframes bloodDrip {
            0% {
                transform: scale(0.3) translateY(0);
                opacity: 0;
            }
            8% {
                transform: scale(1.1) translateY(0);
                opacity: 0.98;
            }
            15% {
                transform: scale(1.0) translateY(0);
                opacity: 0.95;
            }
            100% {
                transform: scale(0.95) translateY(140px);
                opacity: 0;
            }
        }

        @keyframes bloodDripLine {
            0% {
                transform: scaleY(0);
                opacity: 0;
            }
            8% {
                transform: scaleY(0.1);
                opacity: 0.9;
            }
            100% {
                transform: scaleY(1) translateY(140px);
                opacity: 0;
            }
        }
        .windshield-rain-drop {
            position: absolute;
            background: linear-gradient(to bottom, rgba(160,205,255,0.75), rgba(100,150,220,0));
            width: 2px;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(0.5px);
        }
        @keyframes rainSlide {
            0% { transform: translateY(0) scaleY(1); opacity: 0; }
            10% { opacity: 0.85; }
            90% { opacity: 0.85; }
            100% { transform: translateY(140px) scaleY(0.65); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>
    <div class="crt-glow"></div>
    <div id="fade-overlay"></div>
    <!-- Windshield Blood Overlay Container -->
    <div id="windshield-blood-container" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9997; overflow: hidden;"></div>
    <!-- Windshield Rain Overlay Container -->
    <div id="windshield-rain-container" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9996; overflow: hidden;"></div>

    <!-- Dashcam HUD overlay -->
    <div class="dashcam-overlay" id="dashcam-hud">
        <div class="dashcam-top">
            <div class="dashcam-rec">

                <span>SPEED: <span id="dashcam-speed-val">0</span> MPH</span> · GPS: 35.6192° N, 82.4419° W

    </div>

    <button class="btn-lobby" onclick="returnToLobby()">← LOBBY</button>

    <div class="hud-container">

    <div class="controls-help" id="controls-text">

    <canvas id="game-canvas"></canvas>

    <script>
        // ── Audio Engine ──────────────────────────────────────
        let audioCtx = null;
        const masterVolume = 0.06;

        let radioActive = false;
        let radioGainNode = null;
        let radioFilterNode = null;
        let radioInterval = null;
        let currentRadioBeat = 0;

        const bassRoots = [55.00, 43.65, 65.41, 49.00]; // A1, F1, C2, G1
        const leadNotes = [
            [220, 246.94, 261.63, 329.63, 440],
            [174.61, 196.00, 220.00, 261.63, 349.23],
            [130.81, 146.83, 164.81, 196.00, 261.63],
            [196.00, 220.00, 246.94, 293.66, 392.00]
        ];

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function initCarRadio() {
            // Permanently disabled
        }

        function playRadioStep(time, stepLen) {
            // Permanently disabled
        }

        function stopCarRadio() {
            // Permanently disabled
        }

        function playThudSound() {
            initAudio();
            if (!audioCtx) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const now = audioCtx.currentTime;
                
                // Heavy sub thud
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(75, now);
                osc.frequency.exponentialRampToValueAtTime(10, now + 0.28);
                
                gain.gain.setValueAtTime(masterVolume * 4.5, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
                
                osc.start(now);
                osc.stop(now + 0.3);
                
                // Crunch noise
                const bufferSize = audioCtx.sampleRate * 0.18; 
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(160, now);
                filter.Q.setValueAtTime(2.5, now);
                
                const noiseGain = audioCtx.createGain();
                noiseGain.gain.setValueAtTime(masterVolume * 3.2, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
                
                noise.connect(filter);
                filter.connect(noiseGain);
                noiseGain.connect(audioCtx.destination);
                
                noise.start(now);
            } catch(e) { console.warn(e); }
        }

        function triggerWindshieldBlood() {
            const container = document.getElementById('windshield-blood-container');
            if (!container) return;
            
            const count = 7 + Math.floor(Math.random() * 5);
            for (let i = 0; i < count; i++) {
                const splat = document.createElement('div');
                splat.className = 'windshield-blood-splat';
                
                const size = 35 + Math.random() * 70;
                splat.style.width = size + 'px';
                splat.style.height = size + 'px';
                
                // Concentrated in the driver's front view
                const left = 15 + Math.random() * 70;
                const top = 10 + Math.random() * 55;
                splat.style.left = left + '%';
                splat.style.top = top + '%';
                
                const duration = 3.2 + Math.random() * 1.5;
                const delay = Math.random() * 0.25;
                splat.style.animation = `bloodDrip ${duration}s cubic-bezier(0.12, 0.65, 0.22, 1) ${delay}s forwards`;
                
                container.appendChild(splat);
                
                if (Math.random() > 0.4) {
                    const drip = document.createElement('div');
                    drip.className = 'windshield-blood-drip';
                    drip.style.left = (left + (size / 2) / window.innerWidth * 100) + '%';
                    drip.style.top = (top + (size / 2) / window.innerHeight * 100) + '%';
                    
                    const dripHeight = 35 + Math.random() * 90;
                    drip.style.height = dripHeight + 'px';
                    drip.style.animation = `bloodDripLine ${duration}s ease-in ${delay}s forwards`;
                    
                    container.appendChild(drip);
                }
            }
            
            setTimeout(() => {
                container.innerHTML = '';
            }, 6000);
        }

        function createRoadBloodSplat(chunkGroup, x, z, isBridge) {
            const bloodGroup = new THREE.Group();
            const yPos = isBridge ? 0.81 : 0.09;
            bloodGroup.position.set(x, yPos, z);
            
            const bloodMat = new THREE.MeshLambertMaterial({ 
                color: 0x8a0303, 
                transparent: true, 
                opacity: 0.85,
                roughness: 0.9
            });
            
            const mainSplat = new THREE.Mesh(new THREE.CircleGeometry(1.2 + Math.random() * 0.6, 8), bloodMat);
            mainSplat.rotation.x = -Math.PI / 2;
            bloodGroup.add(mainSplat);
            
            const numDroplets = 5 + Math.floor(Math.random() * 5);
            for (let i = 0; i < numDroplets; i++) {
                const r = 1.0 + Math.random() * 2.0;
                const theta = Math.random() * Math.PI * 2;
                const dx = Math.cos(theta) * r;
                const dz = Math.sin(theta) * r;
                
                const drop = new THREE.Mesh(new THREE.CircleGeometry(0.15 + Math.random() * 0.3, 5), bloodMat);
                drop.rotation.x = -Math.PI / 2;
                drop.position.set(dx, 0, dz);
                bloodGroup.add(drop);
            }
            
            chunkGroup.add(bloodGroup);
        }

        function createWaterBloodRipple(chunkGroup, x, z) {
            const rippleGroup = new THREE.Group();
            rippleGroup.position.set(x, -23.7, z);
            
            const circleGeo = new THREE.CircleGeometry(2.2, 10);
            const circleMat = new THREE.MeshBasicMaterial({ 
                color: 0x5c0202, 
                transparent: true, 
                opacity: 0.8,
                blending: THREE.NormalBlending
            });
            const circle = new THREE.Mesh(circleGeo, circleMat);
            circle.rotation.x = -Math.PI / 2;
            rippleGroup.add(circle);
            
            chunkGroup.add(rippleGroup);
        }

        let lightningLine = null;
        let lightningFlashActive = false;

        function triggerLightning() {
            if (lightningLine) {
                scene.remove(lightningLine);
                lightningLine = null;
            }
            
            lightningFlashActive = true;
            
            const basePos = (stage === 1) ? carGroup.position : camera.position;
            const angle = (stage === 1) ? carAngle : playerAngle;
            
            const dx = Math.sin(angle);
            const dz = Math.cos(angle);
            
            const distance = 40 + Math.random() * 50; // 40-90 units ahead of camera
            const lateral = (Math.random() - 0.5) * 60; // offset left/right
            
            const startX = basePos.x + dx * distance + Math.cos(angle) * lateral;
            const startZ = basePos.z + dz * distance - Math.sin(angle) * lateral;
            const startY = 60 + Math.random() * 20; // high in the sky
            
            const points = [];
            points.push(new THREE.Vector3(startX, startY, startZ));
            
            let curX = startX;
            let curY = startY;
            let curZ = startZ;
            
            const segments = 7;
            const branches = [];
            
            for (let i = 0; i < segments; i++) {
                curY -= startY / segments;
                curX += (Math.random() - 0.5) * 16;
                curZ += (Math.random() - 0.5) * 12;
                const nextPoint = new THREE.Vector3(curX, curY, curZ);
                points.push(nextPoint);
                
                // 35% chance to start a branch from this node, but only if it's high enough and not the very first/last nodes
                if (Math.random() < 0.35 && i > 1 && i < segments - 1) {
                    let branchX = curX;
                    let branchY = curY;
                    let branchZ = curZ;
                    const branchPoints = [new THREE.Vector3(branchX, branchY, branchZ)];
                    
                    const branchSegments = 3 + Math.floor(Math.random() * 3);
                    const branchDir = Math.random() > 0.5 ? 1 : -1;
                    
                    for (let j = 0; j < branchSegments; j++) {
                        branchY -= (curY) / branchSegments;
                        branchX += (Math.random() - 0.5) * 8 + branchDir * 6;
                        branchZ += (Math.random() - 0.5) * 8;
                        branchPoints.push(new THREE.Vector3(branchX, branchY, branchZ));
                    }
                    branches.push(branchPoints);
                }
            }
            
            // Render a thick, glowing bolt by drawing 5 slightly offset lines that ignore fog
            const lightningGroup = new THREE.Group();
            const material = new THREE.LineBasicMaterial({ color: 0xffffff, fog: false });
            
            const offsets = [
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(0.12, 0.05, -0.12),
                new THREE.Vector3(-0.12, -0.05, 0.12),
                new THREE.Vector3(0.24, -0.1, 0.0),
                new THREE.Vector3(-0.24, 0.1, 0.0)
            ];
            
            offsets.forEach(offset => {
                const offsetPoints = points.map(p => p.clone().add(offset));
                const geometry = new THREE.BufferGeometry().setFromPoints(offsetPoints);
                const line = new THREE.Line(geometry, material);
                lightningGroup.add(line);
            });
            
            // Draw branches thinner (only 3 offsets)
            const branchOffsets = [
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(0.06, 0.02, -0.06),
                new THREE.Vector3(-0.06, -0.02, 0.06)
            ];
            
            branches.forEach(branchPoints => {
                branchOffsets.forEach(offset => {
                    const offsetPoints = branchPoints.map(p => p.clone().add(offset));
                    const geometry = new THREE.BufferGeometry().setFromPoints(offsetPoints);
                    const line = new THREE.Line(geometry, material);
                    lightningGroup.add(line);
                });
            });
            
            lightningLine = lightningGroup;
            scene.add(lightningLine);
            
            playThunderSound();
            
            setTimeout(() => {
                if (lightningLine) {
                    scene.remove(lightningLine);
                    lightningLine = null;
                }
                lightningFlashActive = false;
            }, 180);
        }

        function playThunderSound() {
            initAudio();
            if (!audioCtx) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const now = audioCtx.currentTime;
                
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(45, now);
                osc.frequency.linearRampToValueAtTime(10, now + 2.0);
                
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(130, now);
                
                osc.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                
                gain.gain.setValueAtTime(masterVolume * 7.5, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 2.0);
                
                osc.start(now);
                osc.stop(now + 2.1);
                
                const bufferSize = audioCtx.sampleRate * 0.45;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                
                const noiseFilter = audioCtx.createBiquadFilter();
                noiseFilter.type = 'bandpass';
                noiseFilter.frequency.setValueAtTime(260, now);
                noiseFilter.Q.setValueAtTime(3.5, now);
                
                const noiseGain = audioCtx.createGain();
                noiseGain.gain.setValueAtTime(masterVolume * 5.2, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                
                noise.connect(noiseFilter);
                noiseFilter.connect(noiseGain);
                noiseGain.connect(audioCtx.destination);
                
                noise.start(now);
                noise.stop(now + 0.5);
            } catch(e) {}
        }

        function playFootstep() {
            initAudio();
            if (!audioCtx) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                // Synthesize grass/leaf crunch noise
                const bufferSize = audioCtx.sampleRate * 0.12; 
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                
                const noiseSource = audioCtx.createBufferSource();
                noiseSource.buffer = buffer;
                
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 650 + Math.random() * 150; // Crunch frequency variation
                filter.Q.value = 2.5;
                
                const crunchGain = audioCtx.createGain();
                crunchGain.gain.setValueAtTime(masterVolume * 0.7, audioCtx.currentTime);
                crunchGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
                
                noiseSource.connect(filter);
                filter.connect(crunchGain);
                crunchGain.connect(audioCtx.destination);
                noiseSource.start();
                
                // Low thud (heavy boot impact)
                const osc = audioCtx.createOscillator();
                const thudGain = audioCtx.createGain();
                osc.connect(thudGain);
                thudGain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(55, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.09);
                thudGain.gain.setValueAtTime(masterVolume * 1.5, audioCtx.currentTime);
                thudGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.09);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } catch(e) { console.warn(e); }
        }

        let playerEngineOsc = null;
        let playerEngineGain = null;
        let playerEngineFilter = null;

        function startPlayerEngine() {
            // Permanently disabled
        }

        function updatePlayerEngine(speedRatio) {

        function startTrafficSound(vehicle) {
            if (!audioCtx || vehicle.soundOsc) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const filter = audioCtx.createBiquadFilter();
                
                let panner = null;
                if (audioCtx.createStereoPanner) {
                    panner = audioCtx.createStereoPanner();
                    osc.connect(filter);
                    filter.connect(gain);
                    gain.connect(panner);
                    panner.connect(audioCtx.destination);
                } else {
                    osc.connect(filter);
                    filter.connect(gain);
                    gain.connect(audioCtx.destination);
                }
                
                osc.type = 'sawtooth';
                const baseFreq = (vehicle.type === 'car') ? 50 : 35;
                osc.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
                
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(150, audioCtx.currentTime);
                
                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                
                osc.start();
                
                vehicle.soundOsc = osc;
                vehicle.soundGain = gain;
                vehicle.soundPanner = panner;
                vehicle.soundBaseFreq = baseFreq;
            } catch(e) { console.warn(e); }
        }

        function stopTrafficSound(vehicle) {
            if (vehicle.soundOsc) {
                try { vehicle.soundOsc.stop(); } catch(e) {}
                vehicle.soundOsc = null;
                vehicle.soundGain = null;
                vehicle.soundPanner = null;
            }
        }

        // Signboard canvas texture cache
        const signCanvasCache = new Map();
        function getSignMaterial(text) {
            if (signCanvasCache.has(text)) {
                return signCanvasCache.get(text);
            }
            
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = '#39ff14';
            ctx.lineWidth = 6;
            ctx.shadowColor = '#39ff14';
            ctx.shadowBlur = 10;
            ctx.strokeRect(8, 8, canvas.width - 16, canvas.height - 16);
            
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 36px "JetBrains Mono", monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);
            
            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.MeshLambertMaterial({ 
                map: texture, 
                emissive: 0x39ff14, 
                emissiveMap: texture,
                emissiveIntensity: 0.8
            });
            
            signCanvasCache.set(text, material);
            return material;
        }

        // Chunk builder
        function createChunk(index) {
            const isBridge = (Math.abs(index) % 24 === 0 && index !== 0);
            const chunkGroup = new THREE.Group();
            chunkGroup.position.z = index * CHUNK_SIZE;
            scene.add(chunkGroup);
            
            if (isBridge) {
                // ── BRIDGE ROAD DECK ──
                const roadMesh = new THREE.Mesh(new THREE.PlaneGeometry(24, CHUNK_SIZE), new THREE.MeshLambertMaterial({ color: 0x3b3b40 }));
                roadMesh.rotation.x = -Math.PI / 2;
                roadMesh.position.y = 0.08;
                roadMesh.receiveShadow = true;
                chunkGroup.add(roadMesh);
                
                // Lanes dashes
                const dashGeo = new THREE.PlaneGeometry(0.3, 12);
                const dashMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                const numDashes = 10;
                const spacing = CHUNK_SIZE / numDashes;
                for (let i = 0; i < numDashes; i++) {
                    const dash = new THREE.Mesh(dashGeo, dashMat);
                    dash.rotation.x = -Math.PI / 2;
                    dash.position.set(0, 0.09, -CHUNK_SIZE / 2 + i * spacing + spacing / 2);
                    chunkGroup.add(dash);
                }
                
                // Concrete side barriers (guardrails)
                const leftBarrier = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, CHUNK_SIZE), new THREE.MeshLambertMaterial({ color: 0x77777d }));
                leftBarrier.position.set(-12, 0.4, 0);
                leftBarrier.castShadow = true;
                leftBarrier.receiveShadow = true;
                chunkGroup.add(leftBarrier);
                
                const rightBarrier = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, CHUNK_SIZE), new THREE.MeshLambertMaterial({ color: 0x77777d }));
                rightBarrier.position.set(12, 0.4, 0);
                rightBarrier.castShadow = true;
                rightBarrier.receiveShadow = true;
                chunkGroup.add(rightBarrier);
                
                // Vertical railing posts
                const railPostGeo = new THREE.BoxGeometry(0.15, 0.9, 0.15);
                const railPostMat = new THREE.MeshLambertMaterial({ color: 0x99999f });
                const railTubeGeo = new THREE.CylinderGeometry(0.06, 0.06, CHUNK_SIZE, 6);
                railTubeGeo.rotateX(Math.PI / 2);
                const railTubeMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8, roughness: 0.2 });
                
                for (let z = -CHUNK_SIZE / 2; z <= CHUNK_SIZE / 2; z += 16) {
                    const postL = new THREE.Mesh(railPostGeo, railPostMat);
                    postL.position.set(-12, 1.25, z);
                    postL.castShadow = true;
                    chunkGroup.add(postL);
                    
                    const postR = new THREE.Mesh(railPostGeo, railPostMat);
                    postR.position.set(12, 1.25, z);
                    postR.castShadow = true;
                    chunkGroup.add(postR);
                }
                
                // Top metal tubes
                const topRailL = new THREE.Mesh(railTubeGeo, railTubeMat);
                topRailL.position.set(-12, 1.6, 0);
                topRailL.castShadow = true;
                chunkGroup.add(topRailL);
                
                const topRailR = new THREE.Mesh(railTubeGeo, railTubeMat);
                topRailR.position.set(12, 1.6, 0);

        function updateGame(delta, time) {
            // ── Update running clock globally ───────────────────
            let elapsedSec = Math.floor(time);
            let s = elapsedSec % 60;
            let m = 30 + Math.floor(elapsedSec / 60);
            let hr = 6;
            if (m >= 60) {
                hr += Math.floor(m / 60);
                m = m % 60;
            }
            const hrStr = hr.toString().padStart(2, '0');
            const minStr = m.toString().padStart(2, '0');
            const secStr = s.toString().padStart(2, '0');
            
            const hudSub = document.getElementById('hud-sub-title');
            if (hudSub) {
                hudSub.innerText = `TIME: ${hrStr}:${minStr} AM`;

            const isStormActive = (kilometersRemaining <= 65.0 && kilometersRemaining >= 45.0) || stage === 3;

            clouds.forEach(cloud => {
                cloud.mesh.position.x += cloud.speed;
                if (cloud.mesh.position.x > 200) cloud.mesh.position.x = -200;

                if (relZ < -250) cloud.mesh.position.z += 500;
                else if (relZ > 250) cloud.mesh.position.z -= 500;
            });

            // Dynamic Sunrise & Sun Waking Up over Mountains (rising slowly over 10 minutes)
            const sunriseProgress = Math.min(1.0, time / 600.0); 
            
            // Sky & Fog color transition (navy -> thick warm crimson/dark violet gradient)
            let targetSkyColor = new THREE.Color(0x0e060d).lerp(new THREE.Color(0x280c14), sunriseProgress);

            if (isStormActive) {
                // Storm interpolation (dark black sky, low lights)
                targetSkyColor.lerp(new THREE.Color(0x020204), 1.0);
                targetAmbient = 0.12;
                targetSunLight = 0.08;
                
                // Random lightning strikes (about every 3-5 seconds)
                if (Math.random() < 0.0055 && !lightningLine) {
                    triggerLightning();
                }
                
                // Muffle other environment lights
                if (!lightningLine) {
                    ambientLight.intensity = targetAmbient;
                    sunLight.intensity = targetSunLight;
                }
                
                // Lerp clouds color to dark storm black
                cloudMat.color.lerp(new THREE.Color(0x101015), delta * 2.0);
            } else {
                // Return to normal ambient light levels
                if (!lightningLine) {
                    ambientLight.intensity = targetAmbient;
                    sunLight.intensity = targetSunLight;
                }
                
                // Lerp clouds color back to bright morning clouds
                cloudMat.color.lerp(new THREE.Color(0xe0e6ed), delta * 2.0);
            }
            
            if (lightningFlashActive) {
                targetSkyColor = new THREE.Color(0xd0e2ff);
                ambientLight.intensity = 4.2;
                sunLight.intensity = 4.8;
            }

            renderer.setClearColor(targetSkyColor);
            scene.fog.color.copy(targetSkyColor);
            
            ambientLight.color.copy(targetSkyColor);
            
            // Sun color (stays thick, vibrant red and shifts to slightly brighter deep red)
            const sunColor = new THREE.Color(0xff0000).lerp(new THREE.Color(0xcc1100), sunriseProgress);
            sunMat.color.copy(sunColor);
            glowMat.color.copy(sunColor);
            
            // Sun rises behind the mountains
            sunMesh.position.z = carGroup.position.z + 280;
            sunMesh.position.y = 2 + sunriseProgress * 45; // rises from 2 to 47
            sunMesh.position.x = -40 + Math.sin(time * 0.05) * 5;
            
            // Sun lighting adjusts accordingly
            sunLight.color.copy(sunColor);
            sunLight.position.set(sunMesh.position.x, sunMesh.position.y, sunMesh.position.z - 20);

            // Flap and fly crows in circular soaring patterns (frantic during storm)
            birds.forEach(crow => {
                const currentRotSpeed = isStormActive ? crow.rotSpeed * 2.2 : crow.rotSpeed;
                const currentFlapSpeed = isStormActive ? 22 : 12;
                crow.angle += currentRotSpeed * delta;
                crow.mesh.position.x = crow.centerX + Math.cos(crow.angle) * crow.radius;
                crow.mesh.position.z += crow.speed * (isStormActive ? 1.8 : 1.0);
                crow.mesh.position.y = crow.baseY + Math.sin(time * 0.8 + crow.angle) * 3;
                
                // Wing flap animation
                const flap = Math.sin(time * currentFlapSpeed + crow.flapOffset) * 0.5;
                crow.mesh.userData.wingLeft.rotation.z = flap;
                crow.mesh.userData.wingRight.rotation.z = -flap;
                
                // Face the flight heading
                crow.mesh.rotation.y = -crow.angle + Math.PI / 2;
                
                const relZ = crow.mesh.position.z - carGroup.position.z;
                if (relZ < -200) {
                    crow.mesh.position.z += 400;
                    crow.centerX = carGroup.position.x + (Math.random() - 0.5) * 150;
                } else if (relZ > 200) {
                    crow.mesh.position.z -= 400;
                    crow.centerX = carGroup.position.x + (Math.random() - 0.5) * 150;
                }
            });

            // Update Rain Particles
            if (isStormActive) {
                rainMat.opacity = Math.min(0.9, rainMat.opacity + delta * 0.45);
            } else {
                rainMat.opacity = Math.max(0.0, rainMat.opacity - delta * 0.45);
            }
            
            if (rainMat.opacity > 0) {
                const positions = rainGeometry.attributes.position.array;
                const camPos = camera.position;
                
                const windX = -65.0; // blowing left heavily
                const fallSpeed = -80.0; // falling down fast heavily
                
                for (let i = 0; i < rainCount * 3; i += 3) {
                    positions[i] += windX * delta;
                    positions[i + 1] += fallSpeed * delta;
                    positions[i + 2] += carSpeed * 40 * delta; // keep up with car
                    
                    if (positions[i + 1] < 0) {
                        positions[i] = camPos.x + (Math.random() - 0.5) * 160;
                        positions[i + 1] = 80;
                        positions[i + 2] = camPos.z + (Math.random() - 0.5) * 160;
                    }
                    if (Math.abs(positions[i] - camPos.x) > 80) {
                        positions[i] = camPos.x + (Math.random() - 0.5) * 160;
                    }
                    if (Math.abs(positions[i + 2] - camPos.z) > 80) {
                        positions[i + 2] = camPos.z + (Math.random() - 0.5) * 160;
                    }
                }
                rainGeometry.attributes.position.needsUpdate = true;
            }

            // Windshield rain overlay generator
            if (isStormActive && stage === 1 && !wipersOn) {
                const containerRain = document.getElementById('windshield-rain-container');
                if (containerRain && Math.random() < 0.28) {
                    const drop = document.createElement('div');
                    drop.className = 'windshield-rain-drop';
                    
                    const left = Math.random() * 100;
                    const top = Math.random() * 70;
                    drop.style.left = left + '%';
                    drop.style.top = top + '%';
                    
                    const height = 15 + Math.random() * 20;
                    drop.style.height = height + 'px';
                    
                    const duration = 0.6 + Math.random() * 0.6;
                    drop.style.animation = `rainSlide ${duration}s linear forwards`;
                    
                    containerRain.appendChild(drop);
                    
                    setTimeout(() => {
                        try { containerRain.removeChild(drop); } catch(e) {}
                    }, duration * 1000);
                }
            }

            // Parallax Mountains
            mountains.forEach(mount => {
                mount.position.z = carGroup.position.z + mount.userData.relativeZ;
            });

            // Update endless chunks
            const viewZ = (stage === 1) ? carGroup.position.z : camera.position.z;
            const currentChunkIndex = Math.floor((viewZ + CHUNK_SIZE/2) / CHUNK_SIZE);
            
            for (let i = currentChunkIndex - 1; i <= currentChunkIndex + 1; i++) {
                if (!chunks.has(i)) {
                    createChunk(i);
                }
            }
            
            chunks.forEach((chunk, index) => {
                if (index < currentChunkIndex - 1 || index > currentChunkIndex + 1) {
                    scene.remove(chunk.group);
                    chunk.group.traverse(node => {
                        if (node.isMesh) {
                            node.geometry.dispose();
                            if (Array.isArray(node.material)) {
                                node.material.forEach(mat => mat.dispose());
                            } else if (node.material) {
                                node.material.dispose();
                            }
                        }
                    });
                    chunks.delete(index);
                }
            });

            if (stage === 1) {
                carGroup.position.y = 0.1;
                carGroup.rotation.x = 0;
                carGroup.rotation.z = 0;
            }
            let isDrivingOverTree = false;

            // Animate river waves in all active chunks
            // Animate river or bridge water waves in all active chunks
            chunks.forEach(chunk => {
                if (chunk.isBridge && chunk.waterGeo && chunk.waterMesh) {
                    const waterPos = chunk.waterGeo.attributes.position;
                    for (let i = 0; i < waterPos.count; i++) {
                        const xVal = waterPos.getX(i);
                        const zVal = waterPos.getY(i);
                        const worldZ = chunk.group.position.z + zVal;
                        const wave = Math.sin(time * 3.0 + xVal * 0.1 + worldZ * 0.05) * 0.45;
                        waterPos.setZ(i, wave);
                    }
                    chunk.waterGeo.computeVertexNormals();
                    waterPos.needsUpdate = true;
                } else if (chunk.riverGeo && chunk.riverMesh) {
                    const riverPos = chunk.riverGeo.attributes.position;
                    for (let i = 0; i < riverPos.count; i++) {
                        const zVal = riverPos.getY(i);
                        const worldZ = chunk.group.position.z + zVal;
                        const wave = Math.sin(time * 2.5 + worldZ * 0.15) * 0.15;
                        riverPos.setZ(i, wave);
                    }
                    chunk.riverGeo.computeVertexNormals();
                    riverPos.needsUpdate = true;
                }

                // Update pedestrians (including physics for hit ragdolls)
                chunk.pedestrians.forEach(ped => {
                    if (ped.isDead) {
                        if (ped.isFlying) {
                            ped.velY -= 36.0 * delta; // gravity
                            
                            ped.group.position.x += ped.velX * delta;
                            ped.group.position.y += ped.velY * delta;
                            ped.group.position.z += ped.velZ * delta;
                            
                            ped.group.rotation.x += ped.rotX * delta;
                            ped.group.rotation.y += ped.rotY * delta;
                            ped.group.rotation.z += ped.rotZ * delta;
                            
                            let landingHeight = 0.1;
                            let isSplash = false;
                            if (chunk.isBridge) {
                                if (Math.abs(ped.group.position.x) <= 12) {
                                    landingHeight = 0.8;
                                } else {
                                    landingHeight = -23.8;
                                    isSplash = true;
                                }
                            }
                            
                            if (ped.group.position.y <= landingHeight) {
                                ped.group.position.y = landingHeight;
                                ped.isFlying = false;
                                
                                if (isSplash) {
                                    ped.group.rotation.set(Math.PI / 2, 0, Math.random() * Math.PI * 2);
                                    createWaterBloodRipple(chunk.group, ped.group.position.x, ped.group.position.z);
                                } else {
                                    ped.group.rotation.set(Math.PI / 2, 0, Math.random() * Math.PI * 2);
                                    createRoadBloodSplat(chunk.group, ped.group.position.x, ped.group.position.z, chunk.isBridge);
                                }
                            }
                        }
                        return;
                    }
                    
                    // Collision check
                    if (stage === 1) {
                        const pedWorldX = ped.group.position.x;
                        const pedWorldZ = chunk.group.position.z + ped.group.position.z;
                        
                        const dx = pedWorldX - carGroup.position.x;
                        const dz = pedWorldZ - carGroup.position.z;
                        
                        const rx = dx * Math.cos(-carAngle) - dz * Math.sin(-carAngle);
                        const rz = dx * Math.sin(-carAngle) + dz * Math.cos(-carAngle);
                        
                        if (Math.abs(rx) < 1.6 && Math.abs(rz) < 2.8) {
                            const hitSpeed = Math.abs(carSpeed);
                            if (hitSpeed > 0.18) {
                                ped.isDead = true;
                                ped.isFlying = true;
                                
                                playThudSound();
                                triggerWindshieldBlood();
                                
                                ped.velY = 12.0 + Math.random() * 8.0;
                                const sideDir = ped.group.position.x > 0 ? 1.0 : -1.0;
                                ped.velX = sideDir * (8.0 + Math.random() * 10.0);
                                ped.velZ = carSpeed * 50.0 + (Math.random() - 0.5) * 6.0;
                                
                                ped.rotX = (Math.random() - 0.5) * 15;
                                ped.rotY = (Math.random() - 0.5) * 15;
                                ped.rotZ = (Math.random() - 0.5) * 15;
                            }
                        }
                    }
                    
                    // Normal walking
                    ped.localZ += ped.direction * ped.speed * delta;
                    if (ped.localZ > CHUNK_SIZE / 2 - 10) {
                        ped.localZ = CHUNK_SIZE / 2 - 10;
                        ped.direction = -1;
                    } else if (ped.localZ < -CHUNK_SIZE / 2 + 10) {
                        ped.localZ = -CHUNK_SIZE / 2 + 10;
                        ped.direction = 1;
                    }
                    ped.group.position.z = ped.localZ;
                    ped.group.rotation.y = ped.direction > 0 ? 0 : Math.PI;
                    if (ped.group.userData.leftLeg && ped.group.userData.rightLeg) {
                        const swing = Math.sin(time * 8 + ped.offset) * 0.45;
                        ped.group.userData.leftLeg.rotation.x = swing;
                        ped.group.userData.rightLeg.rotation.x = -swing;
                    }
                });

                // Wind bending other trees in the chunk
                if (chunk.trees) {
                    chunk.trees.forEach(tree => {
                        if (!tree.userData.isFallingTree) {
                            const bend = isStormActive ? (Math.sin(time * 9.0 + tree.position.z * 0.05) * 0.38 + 0.32) : 0.0;
                            tree.rotation.z = bend;
                        }
                    });
                }

                // Update falling trees during storm
                if (chunk.fallingTrees) {
                    chunk.fallingTrees.forEach(tree => {
                        const worldTreeZ = chunk.group.position.z + tree.position.z;
                        const distZ = worldTreeZ - carGroup.position.z;
                        
                        // Trigger fall if car is close and approaching
                        if (isStormActive && distZ > 0 && distZ < 125 && !tree.userData.hasFallen && !tree.userData.isFalling) {
                            tree.userData.isFalling = true;
                        }
                        
                        if (tree.userData.isFalling) {
                            const targetAngle = (Math.PI / 2) * 0.85; // fall flat
                            const fallSpeed = 1.1 * delta;
                            tree.userData.fallAngle = Math.min(targetAngle, tree.userData.fallAngle + fallSpeed);
                            
                            tree.rotation.z = tree.userData.fallDirection * tree.userData.fallAngle;
                            
                            if (tree.userData.fallAngle >= targetAngle) {
                                tree.userData.isFalling = false;
                                tree.userData.hasFallen = true;
                            }
                        }
                        
                        // Collision check
                        if (stage === 1 && (tree.userData.hasFallen || tree.userData.isFalling)) {
                            const carRelX = carGroup.position.x;
                            const isBlockedLeft = (tree.userData.fallDirection === 1 && carRelX < 5);
                            const isBlockedRight = (tree.userData.fallDirection === -1 && carRelX > -5);
                            
                            if (Math.abs(distZ) < 5.0 && (isBlockedLeft || isBlockedRight)) {
                                isDrivingOverTree = true;
                                if (!tree.userData.playedThud) {
                                    playThudSound();
                                    tree.userData.playedThud = true;
                                }
                            }
                        }
                    });
                }
            });

            // Apply shaking/bumpy effect if driving over a tree
            if (stage === 1 && isDrivingOverTree && Math.abs(carSpeed) > 0.05) {
                carGroup.position.y = 0.52;
                const shakeAmount = 0.09;
                const frequency = 45.0;
                carGroup.rotation.x = Math.sin(time * frequency) * shakeAmount;
                carGroup.rotation.z = Math.cos(time * (frequency + 5.0)) * shakeAmount;
                
                // Procedural squeaking sound
                if (audioCtx && Math.random() < 0.18) {
                    try {
                        const osc = audioCtx.createOscillator();
                        const oscGain = audioCtx.createGain();
                        osc.connect(oscGain);
                        oscGain.connect(audioCtx.destination);
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(450 + Math.random() * 200, audioCtx.currentTime);
                        osc.frequency.linearRampToValueAtTime(800 + Math.random() * 150, audioCtx.currentTime + 0.08);
                        oscGain.gain.setValueAtTime(masterVolume * 0.2, audioCtx.currentTime);
                        oscGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
                        osc.start();
                        osc.stop(audioCtx.currentTime + 0.09);
                    } catch(e) {}
                }
            }

            // Update traffic vehicles
            if (stage === 1) {
                if (audioCtx && audioCtx.state === 'suspended') {
                    if (keys.w || keys.s || keys.a || keys.d) audioCtx.resume();
                }
                
                trafficVehicles.forEach(vehicle => {
                    vehicle.group.position.z += vehicle.speed;
                    const relZ = vehicle.group.position.z - carGroup.position.z;
                    if (vehicle.speed > 0) {
                        if (relZ < -150) {
                            vehicle.group.position.z = carGroup.position.z + 300 + Math.random() * 100;
                            const lane = Math.random() > 0.5 ? 4 : -4;
                            vehicle.group.position.x = lane;
                            vehicle.speed = (lane === 4) ? (0.3 + Math.random() * 0.4) : -(0.8 + Math.random() * 0.6);
                            stopTrafficSound(vehicle);
                        }
                    } else {
                        if (relZ < -100) {
                            vehicle.group.position.z = carGroup.position.z + 300 + Math.random() * 100;
                            const lane = Math.random() > 0.5 ? 4 : -4;
                            vehicle.group.position.x = lane;
                            vehicle.speed = (lane === 4) ? (0.3 + Math.random() * 0.4) : -(0.8 + Math.random() * 0.6);
                            stopTrafficSound(vehicle);
                        }
                    }

                    // Recycle if too far ahead to keep traffic in circulation
                    if (relZ > 350) {
                        vehicle.group.position.z = carGroup.position.z - 150 - Math.random() * 50;
                        const lane = Math.random() > 0.5 ? 4 : -4;
                        vehicle.group.position.x = lane;
                        vehicle.speed = (lane === 4) ? (0.3 + Math.random() * 0.4) : -(0.8 + Math.random() * 0.6);
                        stopTrafficSound(vehicle);
                    }

                    vehicle.group.rotation.y = vehicle.speed > 0 ? 0 : Math.PI;

                    // Positional Audio Logic
                    const distZ = Math.abs(relZ);
                    const distX = Math.abs(vehicle.group.position.x - carGroup.position.x);
                    const dist = Math.sqrt(distZ * distZ + distX * distX);
                    
                    if (dist < 100 && audioCtx) {
                        if (!vehicle.soundOsc) {
                            startTrafficSound(vehicle);
                        }
                        if (vehicle.soundGain) {
                            const maxDist = 100;
                            const volumeScale = Math.max(0, 1 - dist / maxDist);
                            const targetVol = masterVolume * 0.8 * volumeScale;
                            vehicle.soundGain.gain.setTargetAtTime(targetVol, audioCtx.currentTime, 0.1);
                            
                            if (vehicle.soundPanner) {
                                const panVal = Math.max(-1, Math.min(1, (vehicle.group.position.x - carGroup.position.x) / 10));
                                vehicle.soundPanner.pan.setTargetAtTime(panVal, audioCtx.currentTime, 0.1);
                            }
                            
                            if (vehicle.soundOsc) {
                                const isApproaching = (vehicle.speed < 0 && relZ > 0) || (vehicle.speed > 0 && relZ < 0);
                                const factor = isApproaching ? 1.15 : 0.85;
                                vehicle.soundOsc.frequency.setTargetAtTime(vehicle.soundBaseFreq * factor, audioCtx.currentTime, 0.2);
                            }
                        }
                    } else {
                        stopTrafficSound(vehicle);
                    }
                });
            } else {
                trafficVehicles.forEach(stopTrafficSound);
            }

            // ── STAGE 1: DRIVING ─────────────────────────────
            if (stage === 1) {
                if (keys.w || keys.s || keys.a || keys.d) {
                    initAudio();
                    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                }
                
                const speedRatio = Math.abs(carSpeed) / maxCarSpeed;
                if (audioCtx) {
                    updatePlayerEngine(speedRatio);
                }

                const isDriving = (keys.w || keys.s) && Math.abs(carSpeed) > 0.05;
                if (isDriving) {
                    kilometersRemaining -= delta / 10.0;
                    if (kilometersRemaining <= 0) {
                        kilometersRemaining = 0;
                        stage = 2; // Transition mode
                        
                        // Slowly dim the page over 3.5 seconds
                        fadeOverlay.style.transition = 'opacity 3.5s ease-in-out';
                        fadeOverlay.style.opacity = '1';
                        
                        setTimeout(() => {
                            carSpeed = 0;
                            stopPlayerEngine();
                            trafficVehicles.forEach(stopTrafficSound);
                            parkedCarX = carGroup.position.x;
                            parkedCarZ = carGroup.position.z;
                            playerPos.set(carGroup.position.x - 3, 2, carGroup.position.z);
                            playerAngle = carAngle - Math.PI / 2;
                            camera.rotation.set(0, playerAngle, 0);

                            carGroup.position.x -= 1.8;
                            spotLeft.intensity = 0.5;
                            spotRight.intensity = 0.5;

                            document.getElementById('dashcam-hud').style.display = 'none';

                            stage = 3; // Walking mode
                            hudTitle.innerText = "ACT I: INTO THE WILDERNESS";
                            hudTitle.style.borderColor = "#39ff14";
                            hudTitle.style.color = "#39ff14";
                            hudTitle.style.boxShadow = "0 0 15px rgba(57,255,20,0.45)";
                            controlsHelp.innerHTML = "WALK WITH: <span>W / S</span> (Walk) · <span>A / D</span> (Turn Camera)";
                            timerDisplay.style.display = "none";
                            
                            // Reset transition and fade in slowly
                            fadeOverlay.style.transition = 'opacity 1.5s ease-in-out';
                            fadeOverlay.style.opacity = '0';
                        }, 3500);
                    }
                }
                
                timerDisplay.innerText = kilometersRemaining.toFixed(2) + " KM" + (isDriving ? "" : " (PAUSED)");

                let speedMph = Math.min(80, Math.abs(carSpeed * (80 / maxCarSpeed))).toFixed(0);
                document.getElementById('dashcam-speed-val').innerText = speedMph;
                
                let timeStr = `2026-06-25 ${hrStr}:${minStr}:${secStr} AM`;
                document.getElementById('dashcam-time').innerText = timeStr;

                if (keys.w) carSpeed += carAccel;
                if (keys.s) carSpeed -= carAccel;

                carSpeed *= friction;
                carSpeed = Math.max(Math.min(carSpeed, maxCarSpeed), -maxCarSpeed * 0.4);

                if (Math.abs(carSpeed) > 0.05) {
                    const direction = carSpeed > 0 ? 1 : -1;
                    if (keys.a) carAngle += carTurnSpeed * direction;
                    if (keys.d) carAngle -= carTurnSpeed * direction;
                }

                carGroup.position.x += Math.sin(carAngle) * carSpeed;
                carGroup.position.z += Math.cos(carAngle) * carSpeed;
                carGroup.rotation.y = carAngle;

                wheels.forEach(wheel => {
                    wheel.rotation.x += carSpeed * 0.7;
                });

                let targetWheelRot = 0;
                if (keys.a) targetWheelRot = 1.1;
                if (keys.d) targetWheelRot = -1.1;
                steeringWheel.rotation.z += (targetWheelRot - steeringWheel.rotation.z) * 0.15;

                // Wiper animation
                if (wipersOn) {
                    wiperTime += delta * 5.0;
                    const sweepAngle = Math.sin(wiperTime) * 1.1;
                    wiperGroupL.rotation.z = sweepAngle;
                    wiperGroupR.rotation.z = sweepAngle;
                    
                    const containerBlood = document.getElementById('windshield-blood-container');
                    const containerRain = document.getElementById('windshield-rain-container');
                    
                    if (Math.abs(sweepAngle) > 0.75) {
                        if (containerBlood) containerBlood.innerHTML = '';
                        if (containerRain) containerRain.innerHTML = '';
                    }
                } else {
                    wiperGroupL.rotation.z = -1.3;
                    wiperGroupR.rotation.z = -1.3;
                }

                // Driver Seat POV (left-hand side)
                let camX = carGroup.position.x - Math.cos(carAngle) * 0.55 + Math.sin(carAngle) * 0.2;
                let camZ = carGroup.position.z + Math.sin(carAngle) * 0.55 + Math.cos(carAngle) * 0.2;
                let camY = carGroup.position.y + 1.25;
                
                camera.position.set(camX, camY, camZ);
                
                let lookTarget = new THREE.Vector3(
                    camX + Math.sin(carAngle) * 15 + Math.cos(carAngle) * 0.15,
                    camY - 0.08,
                    camZ + Math.cos(carAngle) * 15 - Math.sin(carAngle) * 0.15
                );
                camera.lookAt(lookTarget);
            }
            // ── STAGE 3: WALKING ─────────────────────────────
            else if (stage === 3) {
                isWalking = false;
                
                if (keys.a) playerAngle += 0.035;
                if (keys.d) playerAngle -= 0.035;

                if (keys.w) {
                    playerPos.x += Math.sin(playerAngle) * walkSpeed;
                    playerPos.z += Math.cos(playerAngle) * walkSpeed;
                    isWalking = true;
                }
                if (keys.s) {
                    playerPos.x -= Math.sin(playerAngle) * walkSpeed;
                    playerPos.z -= Math.cos(playerAngle) * walkSpeed;
                    isWalking = true;
                }

                playerPos.x = Math.max(Math.min(playerPos.x, parkedCarX + 150), parkedCarX - 150);
                playerPos.z = Math.max(Math.min(playerPos.z, parkedCarZ + 200), parkedCarZ - 200);

                const terrainHeight = Math.sin(playerPos.x * 0.05) * Math.cos(playerPos.z * 0.05) * 1.5 + Math.sin(playerPos.x * 0.01) * 3;
                playerPos.y = 1.9 + terrainHeight;

                camera.position.copy(playerPos);
                
                const lookTarget = new THREE.Vector3(
                    playerPos.x + Math.sin(playerAngle),
                    playerPos.y,
                    playerPos.z + Math.cos(playerAngle)
                );
                camera.lookAt(lookTarget);

                if (isWalking) {
                    footstepTimeAcc += delta;
                    if (footstepTimeAcc > 0.42) {
                        playFootstep();
                        footstepTimeAcc = 0;
                    }
                } else {
                    footstepTimeAcc = 0.35;
                }
            }

            // Update car radio parameters (muffle/attenuate on distance when on foot)
            if (radioActive && radioGainNode && radioFilterNode && audioCtx) {
                if (stage === 1) {
                    radioGainNode.gain.setTargetAtTime(1.0, audioCtx.currentTime, 0.15);
                    radioFilterNode.frequency.setTargetAtTime(20000, audioCtx.currentTime, 0.15);
                } else if (stage === 3) {
                    const dx = camera.position.x - parkedCarX;
                    const dz = camera.position.z - parkedCarZ;
                    const dist = Math.sqrt(dx * dx + dz * dz);
                    
                    const maxDist = 85.0;
                    const factor = Math.max(0, 1.0 - dist / maxDist);
                    
                    const targetVol = factor * factor * 0.45; // quadratic falloff
                    const targetCutoff = 120 + factor * 680;  // 120Hz to 800Hz
                    
                    radioGainNode.gain.setTargetAtTime(targetVol, audioCtx.currentTime, 0.15);
                    radioFilterNode.frequency.setTargetAtTime(targetCutoff, audioCtx.currentTime, 0.15);
                }
            }
        }

        // Render loop
        function tick() {
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            updateGame(delta, time);
            renderer.render(scene, camera);

            requestAnimationFrame(tick);
        }
        
        // Start game loop
        tick();

        // Responsive window size
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
