            for (let i = smokeParticles.length - 1; i >= 0; i--) {
                const p = smokeParticles[i];
                p.mesh.position.addScaledVector(p.velocity, delta);
                // Drift with storm wind
                p.mesh.position.x += currentWindX * 0.05 * delta; 
                p.opacity -= delta * 0.35;
                p.mesh.material.opacity = p.opacity;
                p.mesh.scale.addScalar(p.scaleSpeed * delta);
                
                if (p.opacity <= 0) {
                    scene.remove(p.mesh);
                    smokeParticles.splice(i, 1);
                }
            }

            // Update Railway Crossing Cinematic Event
            if (stage === 1) {
                if (kilometersRemaining <= 35.0 && railwayCrossingState === 'none') {
                    railwayCrossingState = 'approaching';
                    railwayChunkIdx = currentChunkIndex + 1; // spawn crossing in the next chunk
                    railwayZ = railwayChunkIdx * CHUNK_SIZE; // center of that chunk
                }
                
                if (railwayCrossingState !== 'none' && railwayCrossingState !== 'completed') {
                    const distToCrossing = railwayZ - carGroup.position.z;
                    const isTick = Math.floor(time * 3.5) % 2 === 0;

                    // A. WARNING LIGHTS FLASHING ANIMATION
                    // Flash road signals and gate arm LEDs if gates are active (approaching, waiting, or train)
                    if (railwayCrossingState === 'approaching' || railwayCrossingState === 'waiting' || railwayCrossingState === 'train') {
                        if (isTick) {
                            if (crossingSignalLight1) crossingSignalLight1.material.color.setHex(0xff0000);
                            if (crossingSignalLight2) crossingSignalLight2.material.color.setHex(0x330000);
                        } else {
                            if (crossingSignalLight1) crossingSignalLight1.material.color.setHex(0x330000);
                            if (crossingSignalLight2) crossingSignalLight2.material.color.setHex(0xff0000);
                        }
                        
                        gateLights.forEach(light => {
                            if (light.type === 'steady') {
                                light.mesh.material.color.setHex(0xff0000);
                            } else {
                                light.mesh.material.color.setHex(isTick ? 0xff0000 : 0x330000);
                            }
                        });
                    } else {
                        // Turn off warning lights
                        if (crossingSignalLight1) crossingSignalLight1.material.color.setHex(0x330000);
                        if (crossingSignalLight2) crossingSignalLight2.material.color.setHex(0x330000);
                        gateLights.forEach(light => {
                            light.mesh.material.color.setHex(0x330000);
                        });
                    }

                    // B. STATE MACHINE UPDATES
                    // 1. Approaching: gates start closing when player is close
                    if (railwayCrossingState === 'approaching') {
                        if (distToCrossing < 160) {
                            // Slowly close gates (speed 0.5)
                            gateAngle = Math.max(0, gateAngle - delta * 0.5);
                            if (railwayGateL) railwayGateL.rotation.z = gateAngle;
                            if (railwayGateR) railwayGateR.rotation.z = -gateAngle;
                            
                            // Keep train signal RED
                            if (trainSignalLightRed) trainSignalLightRed.material.color.setHex(0xff0000);
                            if (trainSignalLightGreen) trainSignalLightGreen.material.color.setHex(0x003300);
                            trainSignalState = 'red';
                            
                            if (gateAngle === 0) {
                                railwayCrossingState = 'waiting';
                                railwayTimer = 0;
                            }
                        }
                    }
                    
                    // 2. Waiting for the train: gates closed, wait brief delay, turn train signal green, play horn, dispatch train
                    else if (railwayCrossingState === 'waiting') {
                        railwayTimer += delta;
                        
                        // Turn train signal green after 1.2s of gate being closed
                        if (railwayTimer >= 1.2 && trainSignalState === 'red') {
                            trainSignalState = 'green';
                            if (trainSignalLightRed) trainSignalLightRed.material.color.setHex(0x330000);
                            if (trainSignalLightGreen) trainSignalLightGreen.material.color.setHex(0x00ff00);
                        }
                        
                        // Dispatch train 0.8s later (at 2.0s)
                        if (railwayTimer >= 2.0) {
                            railwayCrossingState = 'train';
                            railwayTimer = 0;
                            trainX = -450;
                            buildTrainGroup();
                            scene.add(trainGroup);
                            playTrainHorn();
                        }
                    }
                    
                    // 3. Train passing: train zooms past extremely fast, signal changes back to red when engine passes
                    else if (railwayCrossingState === 'train') {
                        // Move train very fast
                        trainX += 8.5; 
                        if (trainGroup) trainGroup.position.x = trainX;
                        
                        // Change train signal back to red when locomotive crosses the road (X = 0)
                        if (trainX >= 0 && trainSignalState === 'green') {
                            trainSignalState = 'red';
                            if (trainSignalLightRed) trainSignalLightRed.material.color.setHex(0xff0000);
                            if (trainSignalLightGreen) trainSignalLightGreen.material.color.setHex(0x003300);
                        }
                        
                        // Transition to opening when train has fully cleared (X > 500)
                        if (trainX > 500) {
                            if (trainGroup) {
                                scene.remove(trainGroup);
                                trainGroup = null;
                            }
                            railwayCrossingState = 'opening';
                            railwayTimer = 0;
                        }
                    }
                    
                    // 4. Opening gates: gates open in slow motion, road lights turn off, traffic resumes
                    else if (railwayCrossingState === 'opening') {
                        // Slowly open gates in slow motion (speed 0.15, approx 3-4x slower than closing)
                        gateAngle = Math.min(Math.PI / 2, gateAngle + delta * 0.15);
                        if (railwayGateL) railwayGateL.rotation.z = gateAngle;
                        if (railwayGateR) railwayGateR.rotation.z = -gateAngle;
                        
                        if (gateAngle === Math.PI / 2) {
                            railwayCrossingState = 'completed';
                            // Resume oncoming stopped vehicles
                            crossingOncomingCars.forEach(car => {
                                const newSpeed = -(0.8 + Math.random() * 0.4);
                                car.speed = newSpeed;
                                car.baseSpeed = newSpeed;
                            });
                        }
                    }
                }
            }

            // Update traffic vehicles
            if (stage === 1 || stage === 0) {
                if (audioCtx && audioCtx.state === 'suspended') {
                    if (keys.w || keys.s || keys.a || keys.d) audioCtx.resume();
                }
                
                const listenerPos = (stage === 1) ? carGroup.position : camera.position;
                
                trafficVehicles.forEach(vehicle => {
                    let obstacleAhead = null;
                    let minDistance = 30; // look ahead distance in units

                    // Wind blow simulation for vehicles in storm (REMOVED: Vehicles no longer fly)
                    /*
                    if (isStormActive && !vehicle.isWindBlown && vehicle.speed !== 0 && !vehicle.isRescueCone) {
                        const relZ = vehicle.group.position.z - listenerPos.z;
                        // Trigger when vehicle is 60 to 110 units ahead of the player (fully visible!)
                        if (relZ > 60 && relZ < 110 && Math.random() < 0.01) {
                            vehicle.isWindBlown = true;
                            vehicle.windBlowTimer = 0;
                            const pushDir = vehicle.group.position.x > 0 ? 1 : -1;
                            vehicle.vy = 8.0 + Math.random() * 6.0; // vertical velocity
                            vehicle.vx = pushDir * (12.0 + Math.random() * 8.0); // sideways velocity
                            vehicle.vz = vehicle.speed * 1.5; // forward momentum
                            // Rotational velocities
                            vehicle.vrx = (Math.random() - 0.5) * 8.0;
                            vehicle.vry = (Math.random() - 0.5) * 5.0;
                            vehicle.vrz = (Math.random() - 0.5) * 8.0;
                            
                            // Play a thud sound
                            playThudSound();
                        }
                    }
                    */

                    if (vehicle.isWindBlown) {
                        vehicle.windBlowTimer += delta;
                        
                        // Physics update
                        vehicle.group.position.x += vehicle.vx * delta;
                        vehicle.group.position.y += vehicle.vy * delta;
                        vehicle.group.position.z += vehicle.vz * delta;
                        
                        // Gravity pulls it down
                        vehicle.vy -= 18.0 * delta; 
                        
                        // Spin
                        vehicle.group.rotation.x += vehicle.vrx * delta;
                        vehicle.group.rotation.y += vehicle.vry * delta;
                        vehicle.group.rotation.z += vehicle.vrz * delta;
                        
                        // Ground collision
                        if (vehicle.group.position.y <= 0.1 && vehicle.vy < 0) {
                            vehicle.group.position.y = 0.1;
                            vehicle.isWindBlown = false;
                            vehicle.speed = 0; // stopped
                            vehicle.vx = 0;
                            vehicle.vy = 0;
                            vehicle.vz = 0;
                            
                            // Align flat on the grass
                            vehicle.group.rotation.set(0, Math.random() * Math.PI * 2, 0);
                            
                            // Play landing crash sound
                            playThudSound();
                        }
                    } else {
                        // Normal vehicle movement with adaptive cruise control to avoid collision
                        let desiredSpeed = vehicle.baseSpeed;
                        if (desiredSpeed === undefined) {
                            vehicle.baseSpeed = vehicle.speed;
                            desiredSpeed = vehicle.speed;
                        }

                        obstacleAhead = null;
                        minDistance = 30; // look ahead distance in units

                        // Check other traffic vehicles
                        trafficVehicles.forEach(other => {
                            if (other === vehicle || other.isWindBlown) return;
                            
                            // Must be in the same lane (approximately)
                            const laneDiff = Math.abs(other.group.position.x - vehicle.group.position.x);
                            if (laneDiff < 2.0) {
                                if (vehicle.baseSpeed > 0) {
                                    // We are moving forward (+Z), check if other is ahead of us
                                    const dist = other.group.position.z - vehicle.group.position.z;
                                    if (dist > 0 && dist < minDistance) {
                                        minDistance = dist;
                                        obstacleAhead = other;
                                    }
                                } else {
                                    // We are moving backward (-Z), check if other is ahead of us (lower Z)
                                    const dist = vehicle.group.position.z - other.group.position.z;
                                    if (dist > 0 && dist < minDistance) {
                                        minDistance = dist;
                                        obstacleAhead = other;
                                    }
                                }
                            }
                        });

                        // Check player car (if stage 1 or 0)
                        if (stage === 1 || stage === 0) {
                            const laneDiff = Math.abs(carGroup.position.x - vehicle.group.position.x);
                            if (laneDiff < 2.0) {
                                if (vehicle.baseSpeed > 0) {
                                    const dist = carGroup.position.z - vehicle.group.position.z;
                                    if (dist > 0 && dist < minDistance) {
                                        minDistance = dist;
                                        const playerZSpeed = Math.cos(carAngle) * carSpeed;
                                        obstacleAhead = { speed: playerZSpeed };
                                    }
                                } else {
                                    const dist = vehicle.group.position.z - carGroup.position.z;
                                    if (dist > 0 && dist < minDistance) {
                                        minDistance = dist;
                                        const playerZSpeed = Math.cos(carAngle) * carSpeed;
                                        obstacleAhead = { speed: playerZSpeed };
                                    }
                                }
                            }
                        }

                        if (obstacleAhead) {
                            // Match the front vehicle's speed, or stop if too close (e.g. distance < 10)
                            if (minDistance < 10) {
                                desiredSpeed = 0;
                            } else {
                                const frontSpeed = obstacleAhead.speed || 0;
                                if (vehicle.baseSpeed > 0) {
                                    desiredSpeed = Math.max(0, Math.min(frontSpeed, vehicle.baseSpeed));
                                } else {
                                    desiredSpeed = Math.min(0, Math.max(frontSpeed, vehicle.baseSpeed));
                                }
                            }
                        }

                        // Smoothly interpolate the vehicle's speed to desired speed
                        vehicle.speed += (desiredSpeed - vehicle.speed) * delta * 4.0;
                        vehicle.group.position.z += vehicle.speed;
                    }
                    const relZ = vehicle.group.position.z - listenerPos.z;
                    if (vehicle.speed > 0) {
                        if (relZ < -150) {
                            vehicle.group.position.z = listenerPos.z + 300 + Math.random() * 100;
                            const lane = Math.random() > 0.5 ? 4 : -4;
                            vehicle.group.position.x = lane;
                            
                            let speed;
                            if (lane === 4) {
                                if (vehicle.type === 'car') {
                                    speed = 0.6 + Math.random() * 0.4;
                                } else if (vehicle.type === 'truck') {
                                    speed = 0.3 + Math.random() * 0.2;
                                } else {
                                    speed = 0.4 + Math.random() * 0.3;
                                }
                            } else {
                                if (vehicle.type === 'car') {
                                    speed = -(1.2 + Math.random() * 0.6);
                                } else if (vehicle.type === 'truck') {
                                    speed = -(0.7 + Math.random() * 0.3);
                                } else {
                                    speed = -(0.9 + Math.random() * 0.4);
                                }
                            }
                            vehicle.speed = speed;
                            vehicle.baseSpeed = speed;
                            vehicle.passbyPlayed = false;
                            stopTrafficSound(vehicle);
                        }
                    } else {
                        if (relZ < -100) {
                            vehicle.group.position.z = listenerPos.z + 300 + Math.random() * 100;
                            const lane = Math.random() > 0.5 ? 4 : -4;
                            vehicle.group.position.x = lane;
                            
                            let speed;
                            if (lane === 4) {
                                if (vehicle.type === 'car') {
                                    speed = 0.6 + Math.random() * 0.4;
                                } else if (vehicle.type === 'truck') {
                                    speed = 0.3 + Math.random() * 0.2;
                                } else {
                                    speed = 0.4 + Math.random() * 0.3;
                                }
                            } else {
                                if (vehicle.type === 'car') {
                                    speed = -(1.2 + Math.random() * 0.6);
                                } else if (vehicle.type === 'truck') {
                                    speed = -(0.7 + Math.random() * 0.3);
                                } else {
                                    speed = -(0.9 + Math.random() * 0.4);
                                }
                            }
                            vehicle.speed = speed;
                            vehicle.baseSpeed = speed;
                            vehicle.passbyPlayed = false;
                            stopTrafficSound(vehicle);
                        }
                    }

                    // Recycle if too far ahead to keep traffic in circulation
                    if (relZ > 350) {
                        vehicle.group.position.z = listenerPos.z - 150 - Math.random() * 50;
                        const lane = Math.random() > 0.5 ? 4 : -4;
                        vehicle.group.position.x = lane;
                        
                        let speed;
                        if (lane === 4) {
                            if (vehicle.type === 'car') {
                                speed = 0.6 + Math.random() * 0.4;
                            } else if (vehicle.type === 'truck') {
                                speed = 0.3 + Math.random() * 0.2;
                            } else {
                                speed = 0.4 + Math.random() * 0.3;
                            }
                        } else {
                            if (vehicle.type === 'car') {
                                speed = -(1.2 + Math.random() * 0.6);
                            } else if (vehicle.type === 'truck') {
                                speed = -(0.7 + Math.random() * 0.3);
                            } else {
                                speed = -(0.9 + Math.random() * 0.4);
                            }
                        }
                        vehicle.speed = speed;
                        vehicle.baseSpeed = speed;
                        vehicle.passbyPlayed = false;
                        stopTrafficSound(vehicle);
                    }

                    vehicle.group.rotation.y = vehicle.speed > 0 ? 0 : Math.PI;

                    // Positional Audio Logic
                    const distZ = Math.abs(relZ);
                    const distX = Math.abs(vehicle.group.position.x - listenerPos.x);
                    const dist = Math.sqrt(distZ * distZ + distX * distX);
                    
                    // Passby Audio Logic
                    if (!vehicle.isRescueCone && !vehicle.isWindBlown && (stage === 1 || stage === 0)) {
                        if (distZ < 65 && !vehicle.passbyPlayed) {
                            vehicle.passbyPlayed = true;
                            if (vehicle.passbyAudio) {
                                vehicle.passbyAudio.currentTime = 0;
                                vehicle.passbyAudio.play().catch(e => {});
                            }
                        }
                    }
                    if (vehicle.passbyAudio && vehicle.passbyPlayed) {
                        const maxDist = 80;
                        const volumeScale = Math.max(0, 1 - dist / maxDist);
                        vehicle.passbyAudio.volume = Math.min(1.0, masterVolume * 8.0 * volumeScale);
                    }

                    // Traffic Horn Logic
                    if (vehicle.hornSound && !vehicle.isRescueCone && !vehicle.isWindBlown && (stage === 1 || stage === 0)) {
                        const distToPlayer = vehicle.group.position.distanceTo(listenerPos);
                        if (distToPlayer < 120) {
                            if (obstacleAhead && minDistance < 12) {
                                // Blocked traffic: 0.4% chance per frame to honk horn in frustration
                                if (Math.random() < 0.004 && vehicle.hornSound.paused) {
                                    const volumeScale = Math.max(0, 1 - distToPlayer / 120);
                                    vehicle.hornSound.volume = Math.min(1.0, masterVolume * 6.0 * volumeScale);
                                    vehicle.hornSound.play().catch(e => {});
                                }
                            } else {
                                // Moving traffic: 0.05% chance per frame to honk randomly (e.g. passing warning/greeting)
                                if (Math.random() < 0.0005 && vehicle.hornSound.paused && distToPlayer > 15 && distToPlayer < 80) {
                                    const volumeScale = Math.max(0, 1 - distToPlayer / 80);
                                    vehicle.hornSound.volume = Math.min(1.0, masterVolume * 5.0 * volumeScale);
                                    vehicle.hornSound.play().catch(e => {});
                                }
                            }
                        }
                    }
                    
                    if (dist < 100 && audioCtx) {
                        if (!vehicle.soundOsc) {
                            startTrafficSound(vehicle);
                        }
                        if (vehicle.soundGain) {
                            const maxDist = 100;
                            const volumeScale = Math.max(0, 1 - dist / maxDist);
                            const targetVol = masterVolume * 0.8 * volumeScale;
                            vehicle.soundGain.gain.setTargetAtTime(targetVol, audioCtx.currentTime, 0.1);
                            
                            if (vehicle.soundPanner) {
                                const panVal = Math.max(-1, Math.min(1, (vehicle.group.position.x - listenerPos.x) / 10));
                                vehicle.soundPanner.pan.setTargetAtTime(panVal, audioCtx.currentTime, 0.1);
                            }
                            
                            if (vehicle.soundOsc) {
                                const isApproaching = (vehicle.speed < 0 && relZ > 0) || (vehicle.speed > 0 && relZ < 0);
                                const factor = isApproaching ? 1.15 : 0.85;
                                vehicle.soundOsc.frequency.setTargetAtTime(vehicle.soundBaseFreq * factor, audioCtx.currentTime, 0.2);
                            }
                        }
                    } else {
                        stopTrafficSound(vehicle);
                    }
                });
            } else {
                trafficVehicles.forEach(stopTrafficSound);
            }

            // ── STAGE 1: DRIVING ─────────────────────────────
            if (stage === 1) {
                if (keys.w || keys.s || keys.a || keys.d) {
                    initAudio();
                    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                }
                
                const speedRatio = Math.abs(carSpeed) / maxCarSpeed;
                if (audioCtx) {
                    updatePlayerEngine(speedRatio);
                }

                const isDriving = (keys.w || keys.s) && Math.abs(carSpeed) > 0.05;
                if (isDriving) {
                    if (restEventState === 0 && kilometersRemaining <= 140.0) {
                        restEventTriggered = true;
                        restEventState = 1;
                        kilometersRemaining = 140.0;
                        originalKilometersVal = 140.0;
                        
                        showSubtitle("Driver", "Haa, I was very tired, I want to take rest.");
                        speakSpeech("Haa, I was very tired, I want to take rest.", () => {
                            const sub = document.getElementById('dialog-subtitle');
                            if (sub) sub.remove();
                            
                            restEventState = 2; // Gated rest area parking spot active
                            spawnParkingLotEvent();
                        });
                    }

                    if (restEventState === 0 || restEventState >= 5) {
                        kilometersRemaining -= delta / 10.0;
                    }

                    // Trigger Phone Call at 135 KM
                    if (restEventState >= 5 && callEventState === 0 && kilometersRemaining <= 135.0) {
                        callEventTriggered = true;
                        callEventState = 1;
                        
                        const banner = document.getElementById('phone-call-banner');
                        if (banner) {
                            banner.style.top = '25px';
                        }
                        playPhoneRing();
                        
                        controlsHelp.innerHTML = "<span style='color: #ff3366; font-weight: bold; text-shadow: 0 0 10px rgba(255,51,102,0.5);'>[!] INCOMING CALL FROM MOM · CLICK ANSWER BUTTON</span>";
                    }
                    if (kilometersRemaining <= 0) {
                        kilometersRemaining = 0;
                        stage = 2; // Transition mode
                        
                        // Slowly dim the page over 3.5 seconds
                        fadeOverlay.style.transition = 'opacity 3.5s ease-in-out';
                        fadeOverlay.style.opacity = '1';
                        
                        setTimeout(() => {
                            carSpeed = 0;
                            stopPlayerEngine();
                            trafficVehicles.forEach(stopTrafficSound);
                            parkedCarX = carGroup.position.x;
                            parkedCarZ = carGroup.position.z;
                            playerPos.set(carGroup.position.x - 3, 2, carGroup.position.z);
                            playerAngle = carAngle - Math.PI / 2;
                            camera.rotation.set(0, playerAngle, 0);

                            carGroup.position.x -= 1.8;
                            spotLeft.intensity = 0.5;
                            spotRight.intensity = 0.5;

                            document.getElementById('dashcam-hud').style.display = 'none';

                            stage = 3; // Walking mode
                            hudTitle.innerText = "ACT I: INTO THE WILDERNESS";
                            hudTitle.style.borderColor = "#39ff14";
                            hudTitle.style.color = "#39ff14";
                            hudTitle.style.boxShadow = "0 0 15px rgba(57,255,20,0.45)";
                            controlsHelp.innerHTML = "WALK WITH: <span>W / S</span> (Walk) · <span>A / D</span> (Turn Camera)";
                            timerDisplay.style.display = "none";
                            
                            // Show lobby button
                            const lobbyBtn = document.getElementById('lobby-btn');
                            if (lobbyBtn) {
                                lobbyBtn.style.display = 'block';
                            }
                            
                            // Reset transition and fade in slowly
                            fadeOverlay.style.transition = 'opacity 1.5s ease-in-out';
                            fadeOverlay.style.opacity = '0';
                        }, 3500);
                    }
                }
                
                if (restEventState >= 1 && restEventState < 5) {
                    timerDisplay.innerText = "140.00 KM (LOCKED)";
                } else {
                    timerDisplay.innerText = kilometersRemaining.toFixed(2) + " KM" + (isDriving ? "" : " (PAUSED)");
                }

                let speedMph = Math.min(80, Math.abs(carSpeed * (80 / maxCarSpeed))).toFixed(0);
                document.getElementById('dashcam-speed-val').innerText = speedMph;
                
                let timeStr = `2026-06-25 ${hrStr}:${minStr}:${secStr} AM`;
                document.getElementById('dashcam-time').innerText = timeStr;

                if (isEngineStarted) {
                    if (keys.w) carSpeed += carAccel;
                    if (keys.s) carSpeed -= carAccel;
                } else {
                    carSpeed *= 0.85; // engine off: slow down quickly
                }

                carSpeed *= friction;
                // Dynamically reduce maximum car speed during pre-storm and storm for a slow-motion weather effect
                const currentMaxSpeed = isStormActive ? maxCarSpeed * 0.65 : (isPreStorm ? maxCarSpeed * 0.85 : maxCarSpeed);
                carSpeed = Math.max(Math.min(carSpeed, currentMaxSpeed), -currentMaxSpeed * 0.4);

                if (Math.abs(carSpeed) > 0.05) {
                    const direction = carSpeed > 0 ? 1 : -1;
                    if (keys.a) carAngle += carTurnSpeed * direction;
                    if (keys.d) carAngle -= carTurnSpeed * direction;
                }

                carGroup.position.x += Math.sin(carAngle) * carSpeed;
                carGroup.position.z += Math.cos(carAngle) * carSpeed;
                
                // Traffic Vehicle Collision check for Player's Car
                trafficVehicles.forEach(vehicle => {
                    if (vehicle.isWindBlown) return;
                    const dx = carGroup.position.x - vehicle.group.position.x;
                    const dz = carGroup.position.z - vehicle.group.position.z;
                    
                    // Bounding box dimensions for collision check
                    let minXDist = 2.1; 
                    let minZDist = 4.4; 
                    if (vehicle.isRescueCone) {
                        minXDist = 1.3; 
                        minZDist = 1.3;
                    }
                    
                    if (Math.abs(dx) < minXDist && Math.abs(dz) < minZDist) {
                        const overlapX = minXDist - Math.abs(dx);
                        const overlapZ = minZDist - Math.abs(dz);
                        
                        if (overlapX < overlapZ) {
                            carGroup.position.x += (dx > 0 ? 1 : -1) * overlapX;
                        } else {
                            carGroup.position.z += (dz > 0 ? 1 : -1) * overlapZ;
                            carSpeed *= -0.2; // bounce back
                        }
                    }
                });

                overtakeCars.forEach(car => {
                    const dx = carGroup.position.x - car.mesh.position.x;
                    const dz = carGroup.position.z - car.mesh.position.z;
                    const minXDist = 2.1;
                    const minZDist = 4.4;
                    
                    if (Math.abs(dx) < minXDist && Math.abs(dz) < minZDist) {
                        const overlapX = minXDist - Math.abs(dx);
                        const overlapZ = minZDist - Math.abs(dz);
                        
                        if (overlapX < overlapZ) {
                            carGroup.position.x += (dx > 0 ? 1 : -1) * overlapX;
                        } else {
                            carGroup.position.z += (dz > 0 ? 1 : -1) * overlapZ;
                            carSpeed *= -0.2;
                        }
                    }
                });
                
                // Railway Crossing Player Blocking Clamp
                if (railwayCrossingState !== 'none' && railwayCrossingState !== 'completed' && railwayCrossingState !== 'opening') {
                    if (carGroup.position.z > railwayZ - 16 && carGroup.position.z < railwayZ + 10) {
                        carGroup.position.z = railwayZ - 16;
                        carSpeed = 0;
                    }
                }
                
                carGroup.rotation.y = carAngle;

                wheels.forEach(wheel => {
                    wheel.rotation.x += carSpeed * 0.7;
                });

                let targetWheelRot = 0;
                if (keys.a) targetWheelRot = 1.1;
                if (keys.d) targetWheelRot = -1.1;
                steeringWheel.rotation.z += (targetWheelRot - steeringWheel.rotation.z) * 0.15;

                // Wiper animation
                if (wipersOn) {
                    wiperTime += delta * 5.0;
                    const sweepAngle = Math.sin(wiperTime) * 1.1;
                    wiperGroupL.rotation.z = sweepAngle;
                    wiperGroupR.rotation.z = sweepAngle;
                    
                    const containerBlood = document.getElementById('windshield-blood-container');
                    const containerRain = document.getElementById('windshield-rain-container');
                    
                    if (Math.abs(sweepAngle) > 0.75) {
                        if (containerBlood) containerBlood.innerHTML = '';
                        if (containerRain) containerRain.innerHTML = '';
                    }
                } else {
                    wiperGroupL.rotation.z = -1.3;
                    wiperGroupR.rotation.z = -1.3;
                }

                // Update 140 KM Rest area parking check
                if (restEventState === 2) {
                    if (parkingIndicator) {
                        parkingIndicator.position.y = 2.5 + Math.sin(time * 5.0) * 0.25;
                        parkingIndicator.rotation.y += delta * 2.0;
                    }

                    const targetZ = restEventZ + 8.0;
                    const distX = Math.abs(carGroup.position.x - 26.0);
                    const distZ = Math.abs(carGroup.position.z - targetZ);

                    controlsHelp.innerHTML = `<span style="color: #ffcc00; font-weight: bold; text-shadow: 0 0 10px rgba(255,204,0,0.45);">[!] REACHED 140 KM: ENTER GATE & PARK IN YELLOW BOX</span>`;

                    if (distX < 2.0 && distZ < 4.0) {
                        if (Math.abs(carSpeed) < 0.08) {
                            restEventState = 3; // Parked!
                            carSpeed = 0;
                            stopPlayerEngine();
                            isEngineStarted = false;
                        }
                    }
                }
                
                if (restEventState === 3) {
                    controlsHelp.innerHTML = `<span style="color: #39ff14; font-weight: bold; text-shadow: 0 0 10px rgba(57,255,20,0.45);">[✓] VEHICLE PARKED · PRESS ENTER TO REST</span>`;
                }

                if (parkingLotSpawned && lotPeople.length > 0) {
                    lotPeople.forEach(person => {
                        const gp = person.group;
                        const distToTarget = Math.sqrt(
                            Math.pow(gp.position.x - person.targetX, 2) +
                            Math.pow(gp.position.z - person.targetZ, 2)
                        );
                        
                        if (distToTarget < 1.0) {
                            person.targetX = 20 + Math.random() * 22;
                            person.targetZ = -15 + Math.random() * 30;
                        } else {
                            const dirX = (person.targetX - gp.position.x) / distToTarget;
                            const dirZ = (person.targetZ - gp.position.z) / distToTarget;
                            gp.position.x += dirX * person.speed * delta;
                            gp.position.z += dirZ * person.speed * delta;
                            
                            const targetAngle = Math.atan2(dirX, dirZ);
                            gp.rotation.y = targetAngle;
                        }
                        
                        // Realistic walking animation cycle
                        if (gp.userData.leftLeg && gp.userData.rightLeg) {
                            const swingFreq = person.speed * 0.9 + 1.2;
                            const swingAmp = 0.45;
                            const swing = Math.sin(time * swingFreq + person.offset) * swingAmp;
                            
                            gp.userData.leftLeg.rotation.x = swing;
                            gp.userData.rightLeg.rotation.x = -swing;
                            
                            if (gp.userData.armGroupL && gp.userData.armGroupR) {
                                gp.userData.armGroupL.rotation.x = -swing * 0.8;
                                gp.userData.armGroupR.rotation.x = swing * 0.8;
                            }
                            
                            const bob = -Math.abs(Math.sin(time * swingFreq + person.offset)) * 0.05;
                            if (gp.userData.torso && gp.userData.head) {
                                gp.userData.torso.position.y = 1.25 + bob;
                                gp.userData.head.position.y = 1.72 + bob;
                            }
                        }
                    });
                }

                // Driver Seat POV (left-hand side)
                let camX = carGroup.position.x - Math.cos(carAngle) * 0.55 + Math.sin(carAngle) * 0.2;
                let camZ = carGroup.position.z + Math.sin(carAngle) * 0.55 + Math.cos(carAngle) * 0.2;
                let camY = carGroup.position.y + 1.875;
                
                camera.position.set(camX, camY, camZ);
                
                let lookTarget = new THREE.Vector3(
                    camX + Math.sin(carAngle) * 15 + Math.cos(carAngle) * 0.15,
                    camY - 0.08,
                    camZ + Math.cos(carAngle) * 15 - Math.sin(carAngle) * 0.15
                );
                camera.lookAt(lookTarget);

            }
            // ── STAGE 3 or 0: WALKING ────────────────────────
            else if (stage === 3 || stage === 0) {
                isWalking = false;
                
                if (stage === 0) {
                    const dist = playerPos.distanceTo(carGroup.position);
                    if (dist < 6.0) {
                        controlsHelp.innerHTML = "WALK WITH: <span>W / S / A / D</span> · <span style='color: #ff3300; font-weight: bold; text-shadow: 0 0 10px rgba(255,51,0,0.5);'>PRESS F TO ENTER VEHICLE</span>";
                    } else {
                        controlsHelp.innerHTML = "WALK WITH: <span>W / S / A / D</span> (Walk / Strafe) · <span>DRAG MOUSE</span> (Look) · APPROACH VEHICLE";
                    }
                }

                const prevX = playerPos.x;
                const prevZ = playerPos.z;

                if (keys.w) {
                    playerPos.x += Math.sin(playerAngle) * walkSpeed;
                    playerPos.z += Math.cos(playerAngle) * walkSpeed;
                    isWalking = true;
                }
                if (keys.s) {
                    playerPos.x -= Math.sin(playerAngle) * walkSpeed;
                    playerPos.z -= Math.cos(playerAngle) * walkSpeed;
                    isWalking = true;
                }
                if (keys.a) {
                    // Strafe Left
                    playerPos.x -= Math.cos(playerAngle) * walkSpeed;
                    playerPos.z += Math.sin(playerAngle) * walkSpeed;
                    isWalking = true;
                }
                if (keys.d) {
                    // Strafe Right
                    playerPos.x += Math.cos(playerAngle) * walkSpeed;
                    playerPos.z -= Math.sin(playerAngle) * walkSpeed;
                    isWalking = true;
                }

                // Check collision with the house (only in stage 0)
                if (stage === 0 && checkHouseCollision(playerPos)) {
                    playerPos.x = prevX;
                    playerPos.z = prevZ;
                }

                // Keep player within bounds
                if (stage === 0) {
                    playerPos.x = Math.max(Math.min(playerPos.x, parkedCarX + 25), parkedCarX - 25);
                    playerPos.z = Math.max(Math.min(playerPos.z, parkedCarZ + 25), parkedCarZ - 25);
                } else {
                    playerPos.x = Math.max(Math.min(playerPos.x, parkedCarX + 150), parkedCarX - 150);
                    playerPos.z = Math.max(Math.min(playerPos.z, parkedCarZ + 200), parkedCarZ - 200);
                }

                // Keep player at a stable human eye level (1.75m) above the flat ground to prevent clipping/black screen
                playerPos.y = 1.75;

                camera.position.copy(playerPos);
                
                const lookTarget = new THREE.Vector3(
                    playerPos.x + Math.sin(playerAngle) * Math.cos(cameraPitch),
                    playerPos.y + Math.sin(cameraPitch),
                    playerPos.z + Math.cos(playerAngle) * Math.cos(cameraPitch)
                );
                camera.lookAt(lookTarget);

                // Position flashlight at camera position and point it in camera look direction
                if (flashlight) {
                    flashlight.position.copy(camera.position);
                    const dir = new THREE.Vector3(0, 0, 1).applyQuaternion(camera.quaternion);
                    flashlight.target.position.copy(camera.position).add(dir);
                    flashlight.target.updateMatrixWorld();
                }

                if (isWalking) {
                    footstepTimeAcc += delta;
                    if (footstepTimeAcc > 0.42) {
                        playFootstep();
                        footstepTimeAcc = 0;
                    }
                } else {
                    footstepTimeAcc = 0.35;
                }
            }

            // Update car radio parameters (muffle/attenuate on distance when on foot)
            if (radioActive && radioGainNode && radioFilterNode && audioCtx) {
                if (stage === 1) {
                    radioGainNode.gain.setTargetAtTime(1.0, audioCtx.currentTime, 0.15);
                    radioFilterNode.frequency.setTargetAtTime(20000, audioCtx.currentTime, 0.15);
                } else if (stage === 3 || stage === 0) {
                    const dx = camera.position.x - parkedCarX;
                    const dz = camera.position.z - parkedCarZ;
                    const dist = Math.sqrt(dx * dx + dz * dz);
                    
                    const maxDist = 85.0;
                    const factor = Math.max(0, 1.0 - dist / maxDist);
                    
                    const targetVol = factor * factor * 0.45; // quadratic falloff
                    const targetCutoff = 120 + factor * 680;  // 120Hz to 800Hz
                    
                    radioGainNode.gain.setTargetAtTime(targetVol, audioCtx.currentTime, 0.15);
                    radioFilterNode.frequency.setTargetAtTime(targetCutoff, audioCtx.currentTime, 0.15);
                }
            }

        }

        // Render loop
        function tick() {
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            updateGame(delta, time);
            renderer.render(scene, camera);

            requestAnimationFrame(tick);
        }
        
        // Start game loop
        tick();

        // Responsive window size
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
