<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SURVIVE IT | Forest Road</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --primary: #39ff14;
            --primary-glow: rgba(57, 255, 20, 0.4);
            --danger: #ff3333;
            --danger-glow: rgba(255, 51, 51, 0.45);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        html, body {
            background: #020205;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            width: 100%; height: 100%;
            overflow: hidden;
        }

        #game-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Scanlines Overlay */
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0.15), rgba(0,0,0,0.15) 1.5px,
                transparent 1.5px, transparent 3px
            );
            pointer-events: none; z-index: 9999; opacity: 0.85;
        }

        /* CRT Screen Glow */
        .crt-glow {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 65%, rgba(0,0,0,0.4) 100%);
            pointer-events: none; z-index: 9998;
        }

        /* Dimming transition overlay */
        #fade-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            opacity: 0;
            pointer-events: none;
            z-index: 10;
            transition: opacity 1.5s ease-in-out;
        }

        /* UI Overlays */
        .hud-container {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }

        .hud-title {
            background: rgba(2, 2, 5, 0.8);
            border: 1px solid var(--danger);
            box-shadow: 0 0 15px var(--danger-glow);
            padding: 8px 24px;
            border-radius: 4px;
            font-size: clamp(12px, 2.5vw, 16px);
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--danger);
            text-transform: uppercase;
        }

        .hud-sub {
            background: rgba(2, 2, 5, 0.7);
            padding: 4px 16px;
            border-radius: 4px;
            font-size: clamp(10px, 2vw, 12px);
            color: #fff;
            letter-spacing: 2px;
        }

        /* Timer HUD */
        .timer-hud {
            position: absolute;
            top: 25px;
            right: 25px;
            background: rgba(2, 2, 5, 0.8);
            border: 1px solid var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
            color: var(--primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 20px;
            font-weight: 700;
            padding: 10px 18px;
            border-radius: 4px;
            letter-spacing: 2px;
            z-index: 5;
            pointer-events: none;
        }

        /* Controls Help Footer */
        .controls-help {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(2, 2, 5, 0.75);
            padding: 10px 24px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-size: clamp(10px, 2.2vw, 13px);
            letter-spacing: 2px;
            text-align: center;
            color: rgba(255, 255, 255, 0.85);
            z-index: 5;
            pointer-events: none;
        }

        .controls-help span {
            color: var(--primary);
            font-weight: 700;
        }

        /* Lobby Return button (hidden during driving stage) */
        .btn-lobby {
            position: absolute;
            top: 25px;
            left: 25px;
            background: rgba(2, 2, 5, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.8);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            padding: 10px 18px;
            border-radius: 4px;
            cursor: pointer;
            z-index: 5;
            transition: 0.3s;
            display: none; /* Hidden during driving stage */
        }
        .btn-lobby:hover {
            border-color: var(--danger);
            color: #fff;
            box-shadow: 0 0 10px var(--danger-glow);
            transform: translateY(-2px);
        }

        /* Dashcam HUD style */
        .dashcam-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            padding: 30px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
            z-index: 4;
            font-family: 'JetBrains Mono', monospace;
            text-shadow: 0 0 4px #000;
        }

        .dashcam-top {
            display: flex;
            justify-content: space-between;
            font-size: clamp(10px, 2vw, 14px);
            font-weight: 700;
            letter-spacing: 2px;
        }

        .dashcam-rec {
            color: var(--danger);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dashcam-dot {
            width: 10px; height: 10px;
            background: var(--danger);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--danger-glow);
            animation: recBlink 1s infinite alternate;
        }

        @keyframes recBlink {
            0% { opacity: 0.2; }
            100% { opacity: 1; }
        }

        .dashcam-bottom {
            display: flex;
            justify-content: space-between;
            font-size: clamp(10px, 1.8vw, 13px);
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.85);
        }

        .dashcam-speed span {
            color: var(--primary);
            font-weight: 700;
        }

        /* Windshield Blood Overlay Effects */
        .windshield-blood-splat {
            position: absolute;
            background: radial-gradient(circle, #8a0303 10%, #5c0202 55%, rgba(92,2,2,0) 75%);
            border-radius: 50% 38% 62% 45% / 48% 65% 35% 52%;
            transform-origin: center;
            filter: drop-shadow(0 0 6px rgba(0,0,0,0.85)) blur(1px);
            pointer-events: none;
            opacity: 0;
        }

        .windshield-blood-drip {
            position: absolute;
            width: 3px;
            background: linear-gradient(to bottom, rgba(92,2,2,0.95), rgba(50,0,0,0));
            filter: blur(0.5px);
            pointer-events: none;
            opacity: 0;
            transform-origin: top;
        }

        @keyframes bloodDrip {
            0% {
                transform: scale(0.3) translateY(0);
                opacity: 0;
            }
            8% {
                transform: scale(1.1) translateY(0);
                opacity: 0.98;
            }
            15% {
                transform: scale(1.0) translateY(0);
                opacity: 0.95;
            }
            100% {
                transform: scale(0.95) translateY(140px);
                opacity: 0;
            }
        }

        @keyframes bloodDripLine {
            0% {
                transform: scaleY(0);
                opacity: 0;
            }
            8% {
                transform: scaleY(0.1);
                opacity: 0.9;
            }
            100% {
                transform: scaleY(1) translateY(140px);
                opacity: 0;
            }
        }
        .windshield-rain-drop {
            position: absolute;
            background: linear-gradient(to bottom, rgba(160,205,255,0.75), rgba(100,150,220,0));
            width: 2px;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(0.5px);
        }
        @keyframes rainSlide {
            0% { transform: translateY(0) scaleY(1); opacity: 0; }
            10% { opacity: 0.85; }
            90% { opacity: 0.85; }
            100% { transform: translateY(140px) scaleY(0.65); opacity: 0; }
        }
    </style>
</head>

        function playThudSound() {
            initAudio();
            if (!audioCtx) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const now = audioCtx.currentTime;
                
                // Heavy sub thud
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(75, now);
                osc.frequency.exponentialRampToValueAtTime(10, now + 0.28);
                
                gain.gain.setValueAtTime(masterVolume * 4.5, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
                
                osc.start(now);
                osc.stop(now + 0.3);
                
                // Crunch noise
                const bufferSize = audioCtx.sampleRate * 0.18; 
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(160, now);
                filter.Q.setValueAtTime(2.5, now);
                
                const noiseGain = audioCtx.createGain();
                noiseGain.gain.setValueAtTime(masterVolume * 3.2, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
                
                noise.connect(filter);
                filter.connect(noiseGain);
                noiseGain.connect(audioCtx.destination);
                
                noise.start(now);
            } catch(e) { console.warn(e); }
        }

        function triggerWindshieldBlood() {
            const container = document.getElementById('windshield-blood-container');
            if (!container) return;
            
            const count = 7 + Math.floor(Math.random() * 5);
            for (let i = 0; i < count; i++) {
                const splat = document.createElement('div');
                splat.className = 'windshield-blood-splat';
                
                const size = 35 + Math.random() * 70;
                splat.style.width = size + 'px';
                splat.style.height = size + 'px';
                
                // Concentrated in the driver's front view
                const left = 15 + Math.random() * 70;
                const top = 10 + Math.random() * 55;
                splat.style.left = left + '%';
                splat.style.top = top + '%';
                
                const duration = 3.2 + Math.random() * 1.5;
                const delay = Math.random() * 0.25;
                splat.style.animation = `bloodDrip ${duration}s cubic-bezier(0.12, 0.65, 0.22, 1) ${delay}s forwards`;
                
                container.appendChild(splat);
                
                if (Math.random() > 0.4) {
                    const drip = document.createElement('div');
                    drip.className = 'windshield-blood-drip';
                    drip.style.left = (left + (size / 2) / window.innerWidth * 100) + '%';
                    drip.style.top = (top + (size / 2) / window.innerHeight * 100) + '%';
                    
                    const dripHeight = 35 + Math.random() * 90;
                    drip.style.height = dripHeight + 'px';
                    drip.style.animation = `bloodDripLine ${duration}s ease-in ${delay}s forwards`;
                    
                    container.appendChild(drip);
                }
            }
            
            setTimeout(() => {
                container.innerHTML = '';
            }, 6000);
        }

        function createRoadBloodSplat(chunkGroup, x, z, isBridge) {
            const bloodGroup = new THREE.Group();
            const yPos = isBridge ? 0.81 : 0.09;
            bloodGroup.position.set(x, yPos, z);
            
            const bloodMat = new THREE.MeshLambertMaterial({ 
                color: 0x8a0303, 
                transparent: true, 
                opacity: 0.85,
                roughness: 0.9
            });
            
            const mainSplat = new THREE.Mesh(new THREE.CircleGeometry(1.2 + Math.random() * 0.6, 8), bloodMat);
            mainSplat.rotation.x = -Math.PI / 2;
            bloodGroup.add(mainSplat);
            
            const numDroplets = 5 + Math.floor(Math.random() * 5);
            for (let i = 0; i < numDroplets; i++) {
                const r = 1.0 + Math.random() * 2.0;
                const theta = Math.random() * Math.PI * 2;
                const dx = Math.cos(theta) * r;
                const dz = Math.sin(theta) * r;
                
                const drop = new THREE.Mesh(new THREE.CircleGeometry(0.15 + Math.random() * 0.3, 5), bloodMat);
                drop.rotation.x = -Math.PI / 2;
                drop.position.set(dx, 0, dz);
                bloodGroup.add(drop);
            }
            
            chunkGroup.add(bloodGroup);
        }

        function createWaterBloodRipple(chunkGroup, x, z) {
            const rippleGroup = new THREE.Group();
            rippleGroup.position.set(x, -23.7, z);
            
            const circleGeo = new THREE.CircleGeometry(2.2, 10);
            const circleMat = new THREE.MeshBasicMaterial({ 
                color: 0x5c0202, 
                transparent: true, 
                opacity: 0.8,
                blending: THREE.NormalBlending
            });
            const circle = new THREE.Mesh(circleGeo, circleMat);
            circle.rotation.x = -Math.PI / 2;
            rippleGroup.add(circle);
            
            chunkGroup.add(rippleGroup);
        }

        let lightningLine = null;
        let lightningFlashActive = false;
        let rescueSceneSpawned = false;
        
        // Storm parameter interpolators for smooth transitions

        let trainSignalLightGreen = null;
        let trainSignalState = 'red'; // 'red' or 'green'
        let gateLights = []; // To store small flashing red LEDs on gate arms
        const crossingOncomingCars = [];

        // Accident Rescue Scene Event State
        let rescueSceneChunkIdx = -1;
        let rescueSceneZ = -1;
        let rescueSceneState = 'none'; // 'none', 'approaching', 'completed'
        let rescueRedLights = []; // To store flashing red emergency lights
        let rescueBlueLights = []; // To store flashing blue emergency lights
        const smokeParticles = []; // To animate smoke from the crashed car

        function triggerLightning() {
            if (lightningLine) {
                scene.remove(lightningLine);
                lightningLine = null;
            }
            
            lightningFlashActive = true;
            
            const basePos = (stage === 1) ? carGroup.position : camera.position;
            const angle = (stage === 1) ? carAngle : playerAngle;
            
            const dx = Math.sin(angle);
            const dz = Math.cos(angle);
            
            const distance = 40 + Math.random() * 50; // 40-90 units ahead of camera
            const lateral = (Math.random() - 0.5) * 60; // offset left/right
            
            const startX = basePos.x + dx * distance + Math.cos(angle) * lateral;
            const startZ = basePos.z + dz * distance - Math.sin(angle) * lateral;
            const startY = 60 + Math.random() * 20; // high in the sky
            
            const points = [];
            points.push(new THREE.Vector3(startX, startY, startZ));
            
            let curX = startX;
            let curY = startY;
            let curZ = startZ;
            
            const segments = 7;
            const branches = [];
            
            for (let i = 0; i < segments; i++) {
                curY -= startY / segments;
                curX += (Math.random() - 0.5) * 16;
                curZ += (Math.random() - 0.5) * 12;
                const nextPoint = new THREE.Vector3(curX, curY, curZ);
                points.push(nextPoint);
                
                // 35% chance to start a branch from this node, but only if it's high enough and not the very first/last nodes
                if (Math.random() < 0.35 && i > 1 && i < segments - 1) {
                    let branchX = curX;
                    let branchY = curY;
                    let branchZ = curZ;
                    const branchPoints = [new THREE.Vector3(branchX, branchY, branchZ)];
                    
                    const branchSegments = 3 + Math.floor(Math.random() * 3);
                    const branchDir = Math.random() > 0.5 ? 1 : -1;
                    
                    for (let j = 0; j < branchSegments; j++) {
                        branchY -= (curY) / branchSegments;
                        branchX += (Math.random() - 0.5) * 8 + branchDir * 6;
                        branchZ += (Math.random() - 0.5) * 8;
                        branchPoints.push(new THREE.Vector3(branchX, branchY, branchZ));
                    }
                    branches.push(branchPoints);
                }
            }
            
            // Render a thick, glowing bolt by drawing 5 slightly offset lines that ignore fog
            const lightningGroup = new THREE.Group();
            const material = new THREE.LineBasicMaterial({ color: 0xffffff, fog: false });
            
            const offsets = [
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(0.12, 0.05, -0.12),
                new THREE.Vector3(-0.12, -0.05, 0.12),
                new THREE.Vector3(0.24, -0.1, 0.0),
                new THREE.Vector3(-0.24, 0.1, 0.0)
            ];
            
            offsets.forEach(offset => {
                const offsetPoints = points.map(p => p.clone().add(offset));
                const geometry = new THREE.BufferGeometry().setFromPoints(offsetPoints);
                const line = new THREE.Line(geometry, material);
                lightningGroup.add(line);
            });
            
            // Draw branches thinner (only 3 offsets)
            const branchOffsets = [
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(0.06, 0.02, -0.06),
                new THREE.Vector3(-0.06, -0.02, 0.06)
            ];
            
            branches.forEach(branchPoints => {
                branchOffsets.forEach(offset => {
                    const offsetPoints = branchPoints.map(p => p.clone().add(offset));
                    const geometry = new THREE.BufferGeometry().setFromPoints(offsetPoints);
                    const line = new THREE.Line(geometry, material);
                    lightningGroup.add(line);
                });
            });
            
            lightningLine = lightningGroup;
            scene.add(lightningLine);
            
            playThunderSound();
            
            setTimeout(() => {
                if (lightningLine) {
                    scene.remove(lightningLine);
                    lightningLine = null;
                }
                lightningFlashActive = false;
            }, 180);
        }

        function playThunderSound() {
            initAudio();
            if (!audioCtx) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const now = audioCtx.currentTime;
                
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(45, now);
                osc.frequency.linearRampToValueAtTime(10, now + 2.0);
                
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(130, now);
                
                osc.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                
                gain.gain.setValueAtTime(masterVolume * 7.5, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 2.0);
                
                osc.start(now);
                osc.stop(now + 2.1);
                
                const bufferSize = audioCtx.sampleRate * 0.45;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                
                const noiseFilter = audioCtx.createBiquadFilter();
                noiseFilter.type = 'bandpass';
                noiseFilter.frequency.setValueAtTime(260, now);
                noiseFilter.Q.setValueAtTime(3.5, now);
                
                const noiseGain = audioCtx.createGain();
                noiseGain.gain.setValueAtTime(masterVolume * 5.2, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                
                noise.connect(noiseFilter);
                noiseFilter.connect(noiseGain);
                noiseGain.connect(audioCtx.destination);
                
                noise.start(now);
                noise.stop(now + 0.5);
            } catch(e) {}
        }

        function startTrafficSound(vehicle) {
            if (!audioCtx || vehicle.soundOsc) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const filter = audioCtx.createBiquadFilter();
                
                let panner = null;
                if (audioCtx.createStereoPanner) {
                    panner = audioCtx.createStereoPanner();
                    osc.connect(filter);
                    filter.connect(gain);
                    gain.connect(panner);
                    panner.connect(audioCtx.destination);
                } else {
                    osc.connect(filter);
                    filter.connect(gain);
                    gain.connect(audioCtx.destination);
                }
                
                osc.type = 'sawtooth';
                const baseFreq = (vehicle.type === 'car') ? 50 : 35;
                osc.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
                
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(150, audioCtx.currentTime);
                
                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                
                osc.start();
                
                vehicle.soundOsc = osc;
                vehicle.soundGain = gain;
                vehicle.soundPanner = panner;
                vehicle.soundBaseFreq = baseFreq;
            } catch(e) { console.warn(e); }
        }

        function createLowPolyParkedCar(colorHex) {
            const car = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.6 });
            const glassMat = new THREE.MeshStandardMaterial({ color: 0x111115, roughness: 0.1 });
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.9 });
            const metalMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8, roughness: 0.2 });
            
            // Lower body box
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.6, 3.4), bodyMat);
            body.position.y = 0.45;
            body.castShadow = true;
            car.add(body);
            
            // Cabin box
            const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.5, 2.0), bodyMat);
            cabin.position.set(0, 0.95, -0.2);
            cabin.castShadow = true;
            car.add(cabin);
            
            // Glass windows
            const frontGlass = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.45, 0.1), glassMat);
            frontGlass.position.set(0, 0.95, 0.8);
            frontGlass.rotation.x = -0.25;
            car.add(frontGlass);
            
            // Headlights
            const headL = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.15, 0.1), metalMat);
            headL.position.set(-0.6, 0.45, 1.7);
            const headR = headL.clone();
            headR.position.x = 0.6;
            car.add(headL, headR);
            
            // Wheels
            const wheelGeo = new THREE.CylinderGeometry(0.32, 0.32, 0.3, 8);
            wheelGeo.rotateZ(Math.PI / 2);
            const wPositions = [
                [-0.8, 0.32, 1.0], [0.8, 0.32, 1.0],
                [-0.8, 0.32, -1.0], [0.8, 0.32, -1.0]
            ];
            wPositions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.position.set(pos[0], pos[1], pos[2]);
                wheel.castShadow = true;
                car.add(wheel);
            });
            
            return car;
        }

        function createParkingLot(lotZ) {
            parkingLotGroup = new THREE.Group();
            parkingLotGroup.position.set(0, 0, lotZ);
            
            // 1. Concrete Ground area (shifted to the right of the highway shoulder)
            const lotGeo = new THREE.PlaneGeometry(28, 42);
            const lotMat = new THREE.MeshStandardMaterial({ color: 0x3a3a3c, roughness: 0.85 });
            const ground = new THREE.Mesh(lotGeo, lotMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.set(31.0, 0.02, 0); // X center is 31.0
            ground.receiveShadow = true;
            parkingLotGroup.add(ground);

            // 2. Compound Walls / Fence (height 1.8 units, thick concrete boxes)
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x6e6e73, roughness: 0.9 });
            
            // Back wall (X bounds: [17, 45], Z = -21)
            const backWall = new THREE.Mesh(new THREE.BoxGeometry(28, 1.8, 0.4), wallMat);
            backWall.position.set(31.0, 0.9, -21.0);
            backWall.castShadow = true;
            parkingLotGroup.add(backWall);
            
            // Right side wall (X = 45, Z bounds: [-21, 21])
            const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.8, 42), wallMat);
            rightWall.position.set(45.0, 0.9, 0);
            rightWall.castShadow = true;
            parkingLotGroup.add(rightWall);
            
            // Front wall (X bounds: [17, 45], Z = 21)
            const frontWall = new THREE.Mesh(new THREE.BoxGeometry(28, 1.8, 0.4), wallMat);
            frontWall.position.set(31.0, 0.9, 21.0);
            frontWall.castShadow = true;
            parkingLotGroup.add(frontWall);

            // Left boundary fence facing the highway (with gate opening)
            // Left Wall North section (X = 17, Z: [4.5, 21])
            const leftWallNorth = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.8, 16.5), wallMat);
            leftWallNorth.position.set(17.0, 0.9, 12.75);
            leftWallNorth.castShadow = true;
            parkingLotGroup.add(leftWallNorth);

            // Left Wall South section (X = 17, Z: [-21, -4.5])
            const leftWallSouth = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.8, 16.5), wallMat);
            leftWallSouth.position.set(17.0, 0.9, -12.75);
            leftWallSouth.castShadow = true;
            parkingLotGroup.add(leftWallSouth);

            // Two large gate pillars at the entrance opening (Z bounds: [-4.5, 4.5])
            const pillarMat = new THREE.MeshStandardMaterial({ color: 0x3a3d40, roughness: 0.8 });
            const pillarGeo = new THREE.BoxGeometry(0.7, 2.5, 0.7);
            const pillarL = new THREE.Mesh(pillarGeo, pillarMat);
            pillarL.position.set(17.0, 1.25, -4.5);
            pillarL.castShadow = true;
            
            const pillarR = new THREE.Mesh(pillarGeo, pillarMat);
            pillarR.position.set(17.0, 1.25, 4.5);
            pillarR.castShadow = true;
            parkingLotGroup.add(pillarL, pillarR);

            // 3. Spawn 22 parked cars in neat rows
            const carColors = [
                0xd32f2f, 0x1976d2, 0x388e3c, 0xfbc02d, 0x7b1fa2, 
                0x00796b, 0xf57c00, 0x455a64, 0x5d4037, 0x0088cc,
                0x6e6e73, 0xffffff, 0x111111, 0x880000, 0x000088
            ];
            
            // Define parking spots inside compound (avoiding path from gate to yellow box)
            // Yellow box is at X = 26.0, Z = 8.0
            const spots = [];
            // Row 1 (X = 34.0, Z from -17.5 to 17.5)
            for (let z = -17.5; z <= 17.5; z += 5.0) {
                spots.push({ x: 34.0, z: z, rot: Math.PI / 2 });
            }
            // Row 2 (X = 41.0, Z from -17.5 to 17.5)
            for (let z = -17.5; z <= 17.5; z += 5.0) {
                spots.push({ x: 41.0, z: z, rot: -Math.PI / 2 });
            }
            // Row 3 (X = 26.0, Z from -17.5 to -2.5)
            for (let z = -17.5; z <= -2.5; z += 5.0) {
                spots.push({ x: 26.0, z: z, rot: Math.PI / 2 });
            }
            
            // Populate exactly 22 cars
            for (let i = 0; i < 22; i++) {
                const spot = spots[i % spots.length];
                const color = carColors[i % carColors.length];
                const parkedCar = createLowPolyParkedCar(color);
                parkedCar.position.set(spot.x, 0, spot.z);
                parkedCar.rotation.y = spot.rot + (Math.random() - 0.5) * 0.05; // slight misalignment for realism
                parkingLotGroup.add(parkedCar);
            }

            // 4. Yellow Parking Spot (X = 26.0, Z = 8.0)
            const zoneGeo = new THREE.PlaneGeometry(3.5, 7.5);
            const zoneMat = new THREE.MeshBasicMaterial({ 
                color: 0xffcc00, 
                side: THREE.DoubleSide, 
                transparent: true, 
                opacity: 0.32 
            });
            parkingZoneMesh = new THREE.Mesh(zoneGeo, zoneMat);
            parkingZoneMesh.rotation.x = -Math.PI / 2;
            parkingZoneMesh.position.set(26.0, 0.06, lotZ + 8.0); // World Z coordinates
            scene.add(parkingZoneMesh);

            const edges = new THREE.EdgesGeometry(zoneGeo);
            const lineMat = new THREE.LineBasicMaterial({ color: 0xffcc00, linewidth: 2 });
            parkingBorderSegments = new THREE.LineSegments(edges, lineMat);
            parkingBorderSegments.rotation.x = -Math.PI / 2;
            parkingBorderSegments.position.copy(parkingZoneMesh.position);
            parkingBorderSegments.position.y += 0.01;
            scene.add(parkingBorderSegments);

            // Bouncing/Rotating Cone
            const indicatorGeo = new THREE.ConeGeometry(0.3, 1.2, 4);
            const indicatorMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
            parkingIndicator = new THREE.Mesh(indicatorGeo, indicatorMat);
            parkingIndicator.position.set(26.0, 2.5, lotZ + 8.0);
            parkingIndicator.rotation.x = Math.PI;
            scene.add(parkingIndicator);

            // 5. People walking inside compound
            const headGeo = new THREE.SphereGeometry(0.18, 8, 8);

        // ── Sun Waking Up over Mountains ──────────────────────
        function generateSunTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            
            // Clean gradient for the sphere to give it a warm, smooth light source appearance
            const grad = ctx.createLinearGradient(0, 0, 0, 128);
            grad.addColorStop(0, '#ffffff');      // bright top
            grad.addColorStop(0.5, '#fff3e0');    // warm cream center
            grad.addColorStop(1, '#ffa040');      // sunset-orange bottom
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 256, 128);
            
            const tex = new THREE.CanvasTexture(canvas);
            return tex;
        }

        function generateGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            
            // Smooth radial gradient for a realistic lens glow
            const grad = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
            grad.addColorStop(0, 'rgba(255, 255, 255, 1.0)');
            grad.addColorStop(0.08, 'rgba(255, 255, 255, 0.95)');
            grad.addColorStop(0.2, 'rgba(255, 255, 255, 0.7)');
            grad.addColorStop(0.4, 'rgba(255, 255, 255, 0.38)');
            grad.addColorStop(0.7, 'rgba(255, 255, 255, 0.12)');
            grad.addColorStop(1.0, 'rgba(255, 255, 255, 0.0)');
            
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 256, 256);
            
            const tex = new THREE.CanvasTexture(canvas);
            return tex;
        }

        function generateHorizontalGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            
            // Draw horizontal flare using scaling
            ctx.save();
            ctx.scale(4, 1);
            const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            grad.addColorStop(0, 'rgba(255, 255, 255, 1.0)');
            grad.addColorStop(0.2, 'rgba(255, 255, 255, 0.65)');
            grad.addColorStop(0.5, 'rgba(255, 255, 255, 0.25)');
            grad.addColorStop(1.0, 'rgba(255, 255, 255, 0.0)');
            
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(64, 64, 64, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
            
            const tex = new THREE.CanvasTexture(canvas);
            return tex;
        }

        function getSignMaterial(text) {
            if (signCanvasCache.has(text)) {
                return signCanvasCache.get(text);
            }
            
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = '#39ff14';
            ctx.lineWidth = 6;
            ctx.shadowColor = '#39ff14';
            ctx.shadowBlur = 10;
            ctx.strokeRect(8, 8, canvas.width - 16, canvas.height - 16);
            
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 36px "JetBrains Mono", monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);
            
            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.MeshLambertMaterial({ 
                map: texture, 
                emissive: 0x39ff14, 
                emissiveMap: texture,
                emissiveIntensity: 0.8
            });
            
            signCanvasCache.set(text, material);
            return material;
        }

            const signboard = new THREE.Mesh(new THREE.BoxGeometry(0.3, 2.2, 10.0), getSignMaterial(name));
            signboard.position.set(buildWidth / 2 + 0.2, buildHeight - 1.8, 0);

            if (isBakery) {

                car2.position.set(buildWidth / 2 + 4.5, 0.1, 6.0);
                car2.rotation.y = -Math.PI / 6;

                const carColors = [0xbb0000, 0x333333, 0x00aa55, 0xffaa00];

        function playTrainHorn() {
            initAudio();
            if (!audioCtx) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const now = audioCtx.currentTime;
                // Train horns typically use 3 distinct frequencies
                const frequencies = [311.13, 370.00, 470.00];
                
                frequencies.forEach(freq => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, now);
                    
                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(800, now);
                    
                    osc.connect(filter);
                    filter.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(masterVolume * 0.9, now + 0.1);
                    gain.gain.setValueAtTime(masterVolume * 0.9, now + 2.4);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 2.8);
                    
                    osc.start(now);
                    osc.stop(now + 2.9);
                });
            } catch(e) {}
        }

            lowerBeak.position.set(0, -0.02, 0.20);

            crow.add(beakGroup);
            
            // 4. Shiny black eyes

                color: 0x020202, 
                roughness: 0.05, 
                metalness: 0.9 
            });
            const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.028, 6, 6), eyeMat);
            eyeL.position.set(-0.16, 0.22, 0.62);
            crow.add(eyeL);
            
            const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.028, 6, 6), eyeMat);
            eyeR.position.set(0.16, 0.22, 0.62);
            crow.add(eyeR);

            // 5. Wedge shaped tail feathers fanning out
            const tailGroup = new THREE.Group();
            tailGroup.position.set(0, -0.08, -0.55);
            const mainTail = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.02, 0.65), crowMat);

            tailL.position.set(-0.10, 0, -0.25);
            tailL.rotation.y = -0.12;

            tailR.rotation.y = 0.12;
            tailR.rotation.x = -0.06;
            tailGroup.add(tailR);
            
            crow.add(tailGroup);
            
            // 6. Left Wing Pivoting Group (Feathered layers)

            wingLeft.position.set(-0.24, 0.1, 0);
            
            const innerL = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.05, 0.4), crowMat);

        wiperGroupL.add(wiperArmL);
        carGroup.add(wiperGroupL);
        
        const wiperGroupR = new THREE.Group();
        wiperGroupR.position.set(0.55, 1.15, 0.65); // pivot point R
        const wiperArmR = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.48, 0.02), new THREE.MeshStandardMaterial({ color: 0x0a0a0c, metalness: 0.8, roughness: 0.3 }));
        wiperArmR.position.y = 0.24;
        wiperGroupR.add(wiperArmR);
        carGroup.add(wiperGroupR);

        // Create and position house on the side of the road
        const house = createLowPolyHouse();
        house.position.set(23, 0.1, -120); // on the side of the road, pushed back into forest
        house.rotation.y = Math.PI; // face the road
        scene.add(house);

        carGroup.position.set(16.0, 0.1, -123.0); // start position near the house
        carGroup.rotation.y = -Math.PI / 2; // facing the road
        carGroup.scale.set(1.0, 1.5, 1.0); // scale player car vertically
        scene.add(carGroup);

        // ── Game Logic & Loop ────────────────────────────────
        let stage = 0; // 0: Walk near house, 1: Driving, 2: Dimming Transition, 3: Walking (in forest)
        let kilometersRemaining = 150.0;
        let parkedCarX = 16.0;
        let parkedCarZ = -123.0;
        let carSpeed = 0;
        let carAngle = 0;
        const maxCarSpeed = 1.9;
        const carAccel = 0.048;
        const friction = 0.972;
        const carTurnSpeed = 0.032;

        let wipersOn = false;
        let wiperTime = 0;

        // Player walking variables
        const playerPos = new THREE.Vector3(15.0, 0.95, -119.0);
        let playerAngle = Math.PI / 2; // looking towards the house
        const walkSpeed = 0.24;
        let isWalking = false;
        let footstepTimeAcc = 0;

        let cameraPitch = 0.0; // vertical look angle
        let isMouseDown = false;
        let prevMouseX = 0;
        let prevMouseY = 0;



        // Traffic Management
        const trafficVehicles = [];
        const trafficTypes = ['car', 'truck', 'bus'];
        const carColors = [0x1a73e8, 0xf15a24, 0x00a896, 0x8e44ad, 0xf1c40f, 0x34495e, 0x7f8c8d];

        function spawnTrafficVehicles() {
            const numTraffic = 11;
            for (let i = 0; i < numTraffic; i++) {
                const zPos = carGroup.position.z + 100 + i * 80 + (Math.random() - 0.5) * 40;
                const lane = Math.random() > 0.5 ? 4 : -4;
                const type = trafficTypes[Math.floor(Math.random() * trafficTypes.length)];
                
                let mesh;
                let speed;
                if (lane === 4) {
                    if (type === 'car') {
                        speed = 0.6 + Math.random() * 0.4; // fast car
                    } else if (type === 'truck') {
                        speed = 0.3 + Math.random() * 0.2; // slow truck
                    } else {
                        speed = 0.4 + Math.random() * 0.3; // medium bus
                    }
                } else {
                    if (type === 'car') {
                        speed = -(1.2 + Math.random() * 0.6); // fast oncoming car
                    } else if (type === 'truck') {
                        speed = -(0.7 + Math.random() * 0.3); // slow oncoming truck
                    } else {
                        speed = -(0.9 + Math.random() * 0.4); // medium oncoming bus
                    }
                }

                if (type === 'car') {
                    mesh = createCarMesh(carColors[Math.floor(Math.random() * carColors.length)]);
                } else if (type === 'truck') {
                    mesh = createTruckMesh();
                } else {
                    mesh = createBusMesh();
                }

                mesh.position.set(lane, 0.1, zPos);
                if (speed < 0) {
                    mesh.rotation.y = Math.PI;
                }
                scene.add(mesh);

                let hornSound = null;
                if (Math.random() < 0.4) { // 40% of vehicles get horns
                    hornSound = new Audio('floraphonic-car-horn-4-189858.mp3');
                    hornSound.loop = false;
                }

                trafficVehicles.push({ 
                    group: mesh, 
                    speed: speed, 
                    lane: lane, 
                    type: type,
                    passbyAudio: new Audio('flutie8211-muscle-car-driving-left-to-right-559148.mp3'),
                    passbyPlayed: false,
                    hornSound: hornSound
                });
            }
        }

        // Initialize Chunks & Traffic
        for (let i = -1; i <= 1; i++) {
            createChunk(i);
        }
        spawnTrafficVehicles();

        const clock = new THREE.Clock();

        const timerDisplay = document.getElementById('timer-display');
        const hudTitle = document.getElementById('hud-mode-title');
        const controlsHelp = document.getElementById('controls-text');
        const fadeOverlay = document.getElementById('fade-overlay');

        function checkHouseCollision(pos) {
            // House position is (23, 0.1, -120)
            // Main walls: width 10 (X: [18, 28]), depth 8 (Z: [-124, -116])
            if (pos.x >= 18 - 1.2 && pos.x <= 28 + 1.2 && pos.z >= -124 - 1.2 && pos.z <= -116 + 1.2) {
                return true;
            }
            // Garage walls (world position center X = 31, Z = -120.5)
            // Actual world X bounds: [28, 34], Z bounds: [-124, -117]
            if (pos.x >= 28 - 1.2 && pos.x <= 34 + 1.2 && pos.z >= -124 - 1.2 && pos.z <= -117 + 1.2) {
                return true;
            }
            return false;
        }

        function updateGame(delta, time) {
            // ── Update running clock globally ───────────────────
            let elapsedSec = Math.floor(time) + restTimeOffset;
            let s = elapsedSec % 60;
            let m = 30 + Math.floor(elapsedSec / 60);
            let hr = 6;
            if (m >= 60) {
                hr += Math.floor(m / 60);
                m = m % 60;
            }
            const hrStr = hr.toString().padStart(2, '0');
            const minStr = m.toString().padStart(2, '0');
            const secStr = s.toString().padStart(2, '0');
            
            const hudSub = document.getElementById('hud-sub-title');
            if (hudSub) {
                hudSub.innerText = `TIME: ${hrStr}:${minStr} AM`;
            }

            const isStormActive = (kilometersRemaining <= 20.0 && kilometersRemaining >= 10.0) || (kilometersRemaining <= 65.0 && kilometersRemaining >= 45.0) || stage === 3;
            const isPreStorm = (kilometersRemaining <= 25.0 && kilometersRemaining > 20.0) || (kilometersRemaining <= 70.0 && kilometersRemaining > 65.0);

            // ── Animate Environment ──────────────────────────
            // Drift clouds (slower during pre-storm and storm for "slow motion" feel)
            clouds.forEach(cloud => {
                const currentCloudSpeed = isStormActive ? cloud.speed * 0.45 : (isPreStorm ? cloud.speed * 0.65 : cloud.speed);
                cloud.mesh.position.x += currentCloudSpeed;
                if (cloud.mesh.position.x > 200) cloud.mesh.position.x = -200;
                
                const relZ = cloud.mesh.position.z - carGroup.position.z;
                if (relZ < -250) cloud.mesh.position.z += 500;
                else if (relZ > 250) cloud.mesh.position.z -= 500;
            });

            // Dynamic Sunrise & Sun Waking Up over Mountains (rising slowly over 10 minutes)
            const sunriseProgress = Math.min(1.0, (150.0 - kilometersRemaining) / 10.0); 
            
            // Interpolate wind and bend parameters smoothly based on active phases
            let targetWindX = -3.0;
            let targetFallSpeed = -20.0;
            let targetBendAmp = 0.08;
            let targetBendFreq = 3.0;

            if (isStormActive) {
                targetWindX = -90.0; // heavy wind
                targetFallSpeed = -140.0; // sharp high rain
                targetBendAmp = 0.48; // heavy bending
                targetBendFreq = 12.0;
            } else if (isPreStorm) {
                // progressive slow-motion wind build-up
                targetWindX = -45.0; // wind gets heavy
                targetFallSpeed = -30.0; // no rain yet
                targetBendAmp = 0.28; // progressive heavy bending
                targetBendFreq = 3.5; // slow-motion heavy bend frequency
            }
            
            currentWindX += (targetWindX - currentWindX) * delta * 1.2;
            currentFallSpeed += (targetFallSpeed - currentFallSpeed) * delta * 1.2;
            currentBendAmp += (targetBendAmp - currentBendAmp) * delta * 1.2;
            currentBendFreq += (targetBendFreq - currentBendFreq) * delta * 1.2;
            
            // Sky & Fog color transition
            let targetSkyColor;
            let targetAmbient;
            let targetSunLight;
            let targetFogDensity = 0.007; // normal morning fog density
            
            if (isStormActive) {
                // Gloomy storm atmosphere (a little bit dark)
                targetSkyColor = new THREE.Color(0x181a20);
                targetAmbient = 0.25;
                targetSunLight = 0.15;
                targetFogDensity = 0.012; // storm fog
                
                // Scale down sun so it disappears (covered by clouds)
                sunMesh.scale.lerp(new THREE.Vector3(0, 0, 0), delta * 2.0);
                
                // Random lightning strikes - heavy lightning (increased frequency to 0.012)
                if (Math.random() < 0.012 && !lightningLine) {
                    triggerLightning();
                }
                
                // Clouds color to dark grey
                cloudMat.color.lerp(new THREE.Color(0x1c1e22), delta * 2.0);
            } else if (isPreStorm) {
                // Light dark atmosphere (not fully dark)
                targetSkyColor = new THREE.Color(0x3c3f4a); // grey-blue storm sky
                targetAmbient = 0.42; // light dark ambient
                targetSunLight = 0.38; // light dark sun light
                targetFogDensity = 0.010; // mist rises
                
                // Scale down sun so it gets covered slowly
                sunMesh.scale.lerp(new THREE.Vector3(0, 0, 0), delta * 1.5);
                
                // Clouds color turning dark storm black slowly
                cloudMat.color.lerp(new THREE.Color(0x1a1a20), delta * 1.5);
            } else {
                // Scale sun back to normal
                sunMesh.scale.lerp(new THREE.Vector3(1, 1, 1), delta * 2.0);
                
                // Post-storm clear day when kilometersRemaining < 10.0 OR between 45.0 and 25.0 OR rest event completed
                const isClearDay = (kilometersRemaining < 10.0) || (kilometersRemaining < 45.0 && kilometersRemaining > 25.0) || (restEventState >= 5);
                if (isClearDay) {
                    // Post-storm: bright clear day atmosphere
                    targetSkyColor = new THREE.Color(0x87ceeb).lerp(new THREE.Color(0xa6c8e0), sunriseProgress);
                    targetAmbient = 0.75 + sunriseProgress * 0.1;
                    targetSunLight = 1.6 + sunriseProgress * 0.3;
                    targetFogDensity = 0.0005; // clear day, remove mist/fog!
                    
                    // Lerp clouds color to bright white
                    cloudMat.color.lerp(new THREE.Color(0xffffff), delta * 2.0);
                } else {
                    // Pre-storm: normal morning sunrise (when > 70.0 KM) - gets gradually lighter to bright morning white
                    targetSkyColor = new THREE.Color(0x231835).lerp(new THREE.Color(0xeef4fa), sunriseProgress);
                    targetAmbient = 0.45 + sunriseProgress * 0.45;
                    targetSunLight = 0.52 + sunriseProgress * 1.38;
                    targetFogDensity = 0.007 - sunriseProgress * 0.0045;
                    
                    // Lerp clouds color to warm morning clouds
                    cloudMat.color.lerp(new THREE.Color(0xffffff), delta * 2.0);
                }
            }
            
            // Gradually interpolate colors and intensities to make the transition slow and smooth!
            currentAmbient += (targetAmbient - currentAmbient) * delta * 0.35;
            currentSunLight += (targetSunLight - currentSunLight) * delta * 0.35;
            currentFogDensity += (targetFogDensity - currentFogDensity) * delta * 0.35;
            currentSkyColor.lerp(targetSkyColor, delta * 0.35);
            
            scene.fog.density = currentFogDensity;
            
            // Set lighting and colors based on lightning overrides or slow day transitions
            if (lightningFlashActive) {
                ambientLight.intensity = 4.2;
                sunLight.intensity = 4.8;
                renderer.setClearColor(new THREE.Color(0xd0e2ff));
                scene.fog.color.setHex(0xd0e2ff);
                ambientLight.color.setHex(0xd0e2ff);
            } else {
                ambientLight.intensity = currentAmbient;
                sunLight.intensity = currentSunLight;
                renderer.setClearColor(currentSkyColor);
                scene.fog.color.copy(currentSkyColor);
                ambientLight.color.copy(currentSkyColor);
            }
            
            // Sun color (vibrant very very very thick red shifting to bright yellow as it rises)
            const sunColor = new THREE.Color(0xff0000).lerp(new THREE.Color(0xffea00), sunriseProgress);
            
            // Keep the core sun disk bright white/light-yellow so it looks like a saturated light source
            const coreColor = new THREE.Color(0xffeedd).lerp(new THREE.Color(0xffffff), sunriseProgress);
            sunMat.color.copy(coreColor);
            
            glowMats.forEach(mat => mat.color.copy(sunColor));
            
            // Slow plasma surface rotation animation
            sunMesh.rotation.y += delta * 0.04;
            sunMesh.rotation.x += delta * 0.015;
            
            // Sun rises and moves to the top of the sky based on time (sunriseProgress)
            sunMesh.position.z = carGroup.position.z + 280 - sunriseProgress * 200; 
            sunMesh.position.y = 2 + sunriseProgress * 95; // rises high to the top
            sunMesh.position.x = -40 + sunriseProgress * 40; 
            
            // Sun lighting adjusts accordingly
            sunLight.color.copy(sunColor);
            sunLight.position.set(sunMesh.position.x, sunMesh.position.y, sunMesh.position.z - 20);

            // Flap and fly crows in circular soaring patterns (frantic during storm)
            birds.forEach(crow => {
                const currentRotSpeed = isStormActive ? crow.rotSpeed * 2.2 : crow.rotSpeed;
                const currentFlapSpeed = isStormActive ? 22 : 12;
                crow.angle += currentRotSpeed * delta;
                crow.mesh.position.x = crow.centerX + Math.cos(crow.angle) * crow.radius;
                crow.mesh.position.z += crow.speed * (isStormActive ? 1.8 : 1.0);
                crow.mesh.position.y = crow.baseY + Math.sin(time * 0.8 + crow.angle) * 3;
                
                // Wing flap animation
                const flap = Math.sin(time * currentFlapSpeed + crow.flapOffset) * 0.5;
                crow.mesh.userData.wingLeft.rotation.z = flap;
                crow.mesh.userData.wingRight.rotation.z = -flap;
                
                // Face the flight heading
                crow.mesh.rotation.y = -crow.angle + Math.PI / 2;
                
                const relZ = crow.mesh.position.z - carGroup.position.z;
                if (relZ < -200) {
                    crow.mesh.position.z += 400;
                    crow.centerX = carGroup.position.x + (Math.random() - 0.5) * 150;
                } else if (relZ > 200) {
                    crow.mesh.position.z -= 400;
                    crow.centerX = carGroup.position.x + (Math.random() - 0.5) * 150;
                }
            });

            // Update Rain Particles and Storm Music
            if (isStormActive) {
                rainMat.opacity = Math.min(0.95, rainMat.opacity + delta * 0.95); // Sharper rain onset at 65km
                
                if (stormMusic) {
                    if (stormMusic.paused) {
                        stormMusic.play().catch(e => {});
                    }
                    stormMusicTargetVol = Math.min(1.0, masterVolume * 8.0);
                }
            } else {
                rainMat.opacity = Math.max(0.0, rainMat.opacity - delta * 0.45);
                stormMusicTargetVol = 0.0;
            }

            if (stormMusic) {
                const fadeRate = isStormActive ? 1.0 : 0.4; // fade out slowly
                stormMusicCurrentVol += (stormMusicTargetVol - stormMusicCurrentVol) * delta * fadeRate;
                if (stormMusicCurrentVol < 0.001) {
                    stormMusicCurrentVol = 0.0;
                    if (!stormMusic.paused) {
                        stormMusic.pause();
                    }
                } else if (stormMusicCurrentVol > 1.0) {
                    stormMusicCurrentVol = 1.0;
                }
                stormMusic.volume = stormMusicCurrentVol;
            }
            
            if (rainMat.opacity > 0) {
                const positions = rainGeometry.attributes.position.array;
                const camPos = camera.position;
                
                for (let i = 0; i < rainCount * 3; i += 3) {
                    positions[i] += currentWindX * delta;
                    positions[i + 1] += currentFallSpeed * delta;
                    positions[i + 2] += carSpeed * 40 * delta; // keep up with car
                    
                    if (positions[i + 1] < 0) {
                        positions[i] = camPos.x + (Math.random() - 0.5) * 160;
                        positions[i + 1] = 80;
                        positions[i + 2] = camPos.z + (Math.random() - 0.5) * 160;
                    }
                    if (Math.abs(positions[i] - camPos.x) > 80) {
                        positions[i] = camPos.x + (Math.random() - 0.5) * 160;
                    }
                    if (Math.abs(positions[i + 2] - camPos.z) > 80) {
                        positions[i + 2] = camPos.z + (Math.random() - 0.5) * 160;
                    }
                }
                rainGeometry.attributes.position.needsUpdate = true;
            }

            // Windshield rain overlay generator
            if (isStormActive && stage === 1) {
                const containerRain = document.getElementById('windshield-rain-container');
                if (containerRain && Math.random() < 0.60) { // Increased density for high rain
                    const drop = document.createElement('div');
                    drop.className = 'windshield-rain-drop';
                    
                    const left = Math.random() * 100;
                    const top = Math.random() * 70;
                    drop.style.left = left + '%';
                    drop.style.top = top + '%';
                    
                    const height = 15 + Math.random() * 20;
                    drop.style.height = height + 'px';
                    
                    const duration = 0.6 + Math.random() * 0.6;
                    drop.style.animation = `rainSlide ${duration}s linear forwards`;
                    
                    containerRain.appendChild(drop);
                    
                    setTimeout(() => {
                        try { containerRain.removeChild(drop); } catch(e) {}
                    }, duration * 1000);
                }
            }

            // Parallax Mountains
            mountains.forEach(mount => {
                mount.position.z = carGroup.position.z + mount.userData.relativeZ;
            });

            // Update endless chunks
            const viewZ = (stage === 1) ? carGroup.position.z : camera.position.z;
            const currentChunkIndex = Math.floor((viewZ + CHUNK_SIZE/2) / CHUNK_SIZE);
            
            for (let i = currentChunkIndex - 1; i <= currentChunkIndex + 1; i++) {
                if (!chunks.has(i)) {
                    createChunk(i);
                }
            }
            
            chunks.forEach((chunk, index) => {
                if (index < currentChunkIndex - 1 || index > currentChunkIndex + 1) {
                    scene.remove(chunk.group);
                    chunk.group.traverse(node => {
                        if (node.isMesh) {
                            node.geometry.dispose();
                            if (Array.isArray(node.material)) {
                                node.material.forEach(mat => mat.dispose());
                            } else if (node.material) {
                                node.material.dispose();
                            }
                        }
                    });
                    chunks.delete(index);
                }
            });

            if (stage === 1) {
                carGroup.position.y = 0.1;
                carGroup.rotation.x = 0;
                carGroup.rotation.z = 0;
            }
            let isDrivingOverTree = false;

            // Animate river waves in all active chunks
            // Animate river or bridge water waves in all active chunks
            chunks.forEach(chunk => {
                if (chunk.isBridge && chunk.waterGeo && chunk.waterMesh) {
                    const waterPos = chunk.waterGeo.attributes.position;
                    for (let i = 0; i < waterPos.count; i++) {
                        const xVal = waterPos.getX(i);
                        const zVal = waterPos.getY(i);
                        const worldZ = chunk.group.position.z + zVal;
                        const wave = Math.sin(time * 3.0 + xVal * 0.1 + worldZ * 0.05) * 0.45;
                        waterPos.setZ(i, wave);
                    }
                    chunk.waterGeo.computeVertexNormals();
                    waterPos.needsUpdate = true;
                } else if (chunk.riverGeo && chunk.riverMesh) {
                    const riverPos = chunk.riverGeo.attributes.position;
                    for (let i = 0; i < riverPos.count; i++) {
                        const zVal = riverPos.getY(i);
                        const worldZ = chunk.group.position.z + zVal;
                        const wave = Math.sin(time * 2.5 + worldZ * 0.15) * 0.15;
                        riverPos.setZ(i, wave);
                    }
                    chunk.riverGeo.computeVertexNormals();
                    riverPos.needsUpdate = true;
                }

                // Update pedestrians (including physics for hit ragdolls)
                chunk.pedestrians.forEach(ped => {
                    if (ped.isDead) {
                        if (ped.isFlying) {
                            ped.velY -= 36.0 * delta; // gravity
                            
                            ped.group.position.x += ped.velX * delta;
                            ped.group.position.y += ped.velY * delta;
                            ped.group.position.z += ped.velZ * delta;
                            
                            ped.group.rotation.x += ped.rotX * delta;
                            ped.group.rotation.y += ped.rotY * delta;
                            ped.group.rotation.z += ped.rotZ * delta;
                            
                            let landingHeight = 0.1;
                            let isSplash = false;
                            if (chunk.isBridge) {
                                if (Math.abs(ped.group.position.x) <= 12) {
                                    landingHeight = 0.8;
                                } else {
                                    landingHeight = -23.8;
                                    isSplash = true;
                                }
                            }
                            
                            if (ped.group.position.y <= landingHeight) {
                                ped.group.position.y = landingHeight;
                                ped.isFlying = false;
                                
                                if (isSplash) {
                                    ped.group.rotation.set(Math.PI / 2, 0, Math.random() * Math.PI * 2);
                                    createWaterBloodRipple(chunk.group, ped.group.position.x, ped.group.position.z);
                                } else {
                                    ped.group.rotation.set(Math.PI / 2, 0, Math.random() * Math.PI * 2);
                                    createRoadBloodSplat(chunk.group, ped.group.position.x, ped.group.position.z, chunk.isBridge);
                                }
                            }
                        }
                        return;
                    }
                    
                    // Collision check
                    if (stage === 1) {
                        const pedWorldX = ped.group.position.x;
                        const pedWorldZ = chunk.group.position.z + ped.group.position.z;
                        
                        const dx = pedWorldX - carGroup.position.x;
                        const dz = pedWorldZ - carGroup.position.z;
                        
                        const rx = dx * Math.cos(-carAngle) - dz * Math.sin(-carAngle);
                        const rz = dx * Math.sin(-carAngle) + dz * Math.cos(-carAngle);
                        
                        if (Math.abs(rx) < 1.6 && Math.abs(rz) < 2.8) {
                            const hitSpeed = Math.abs(carSpeed);
                            if (hitSpeed > 0.18) {
                                ped.isDead = true;
                                ped.isFlying = true;
                                
                                playThudSound();
                                triggerWindshieldBlood();
                                
                                ped.velY = 12.0 + Math.random() * 8.0;
                                const sideDir = ped.group.position.x > 0 ? 1.0 : -1.0;
                                ped.velX = sideDir * (8.0 + Math.random() * 10.0);
                                ped.velZ = carSpeed * 50.0 + (Math.random() - 0.5) * 6.0;
                                
                                ped.rotX = (Math.random() - 0.5) * 15;
                                ped.rotY = (Math.random() - 0.5) * 15;
                                ped.rotZ = (Math.random() - 0.5) * 15;
                            }
                        }
                    }
                    
                    if (ped.speed > 0) {
                        // Normal walking
                        ped.localZ += ped.direction * ped.speed * delta;
                        if (ped.localZ > CHUNK_SIZE / 2 - 10) {
                            ped.localZ = CHUNK_SIZE / 2 - 10;
                            ped.direction = -1;
                        } else if (ped.localZ < -CHUNK_SIZE / 2 + 10) {
                            ped.localZ = -CHUNK_SIZE / 2 + 10;
                            ped.direction = 1;
                        }
                        ped.group.position.z = ped.localZ;
                        ped.group.rotation.y = ped.direction > 0 ? 0 : Math.PI;
                        if (ped.group.userData.leftLeg && ped.group.userData.rightLeg) {
                            // Dynamically adjust swing frequency based on pedestrian speed for realistic walking
                            const swingFreq = ped.speed * 0.9 + 1.2;
                            const swingAmp = 0.45; 
                            const swing = Math.sin(time * swingFreq + ped.offset) * swingAmp;
                            
                            // Legs swing opposite
                            ped.group.userData.leftLeg.rotation.x = swing;
                            ped.group.userData.rightLeg.rotation.x = -swing;
                            
                            // Arms swing opposite to legs
                            if (ped.group.userData.armGroupL && ped.group.userData.armGroupR) {
                                ped.group.userData.armGroupL.rotation.x = -swing * 0.8;
                                ped.group.userData.armGroupR.rotation.x = swing * 0.8;
                            }
                            
                            // Body and head bobbing
                            const bob = -Math.abs(Math.sin(time * swingFreq + ped.offset)) * 0.05;
                            if (ped.group.userData.torso && ped.group.userData.head) {
                                ped.group.userData.torso.position.y = 1.25 + bob;
                                ped.group.userData.head.position.y = 1.72 + bob;
                            }
                        }
                    } else if (ped.isSpeaking) {
                        // Conversation/Speaking animation
                        const speakTime = time + ped.offset;
                        
                        // Head nods/moves slightly to simulate speaking
                        if (ped.group.userData.head) {
                            ped.group.userData.head.rotation.x = Math.sin(speakTime * 3.0) * 0.06;
                            ped.group.userData.head.rotation.y = Math.cos(speakTime * 1.5) * 0.08;
                        }
                        
                        // Arms gesticulate naturally
                        if (ped.group.userData.armGroupL && ped.group.userData.armGroupR) {
                            ped.group.userData.armGroupL.rotation.x = -0.2 + Math.sin(speakTime * 2.0) * 0.15;
                            ped.group.userData.armGroupL.rotation.z = -0.15 + Math.cos(speakTime * 2.0) * 0.08;
                            
                            ped.group.userData.armGroupR.rotation.x = -0.2 - Math.sin(speakTime * 2.2) * 0.15;
                            ped.group.userData.armGroupR.rotation.z = 0.15 + Math.cos(speakTime * 2.2) * 0.08;
                        }
                        
                        // Relaxed standing pose (one leg slightly back, one slightly forward)
                        if (ped.group.userData.leftLeg && ped.group.userData.rightLeg) {
                            ped.group.userData.leftLeg.rotation.x = 0.08;
                            ped.group.userData.rightLeg.rotation.x = -0.08;
                        }
                    }
                });

                // Wind bending other trees in the chunk
                if (chunk.trees) {
                    chunk.trees.forEach(tree => {
                        if (!tree.userData.isFallingTree) {
                            const bend = (Math.sin(time * currentBendFreq + tree.position.z * 0.05) * currentBendAmp + (isStormActive ? 0.32 : 0.0));
                            tree.rotation.z = bend;
                        }
                    });
                }

                // Update falling trees during storm
                if (chunk.fallingTrees) {
                    chunk.fallingTrees.forEach(tree => {
                        const worldTreeZ = chunk.group.position.z + tree.position.z;
                        const distZ = worldTreeZ - carGroup.position.z;
                        
                        // Trigger fall if car is close and approaching
                        if (isStormActive && distZ > 0 && distZ < 125 && !tree.userData.hasFallen && !tree.userData.isFalling) {
                            tree.userData.isFalling = true;
                        }
                        
                        if (tree.userData.isFalling) {
                            const targetAngle = (Math.PI / 2) * 0.85; // fall flat
                            const fallSpeed = 1.1 * delta;
                            tree.userData.fallAngle = Math.min(targetAngle, tree.userData.fallAngle + fallSpeed);
                            
                            tree.rotation.z = tree.userData.fallDirection * tree.userData.fallAngle;
                            
                            if (tree.userData.fallAngle >= targetAngle) {
                                tree.userData.isFalling = false;
                                tree.userData.hasFallen = true;
                            }
                        }
                        
                        // Collision check
                        if (stage === 1 && (tree.userData.hasFallen || tree.userData.isFalling)) {
                            const carRelX = carGroup.position.x;
                            const isBlockedLeft = (tree.userData.fallDirection === 1 && carRelX < 5);
                            const isBlockedRight = (tree.userData.fallDirection === -1 && carRelX > -5);
                            
                            if (Math.abs(distZ) < 5.0 && (isBlockedLeft || isBlockedRight)) {
                                isDrivingOverTree = true;
                                if (!tree.userData.playedThud) {
                                    playThudSound();
                                    tree.userData.playedThud = true;
                                }
                            }
                        }
                    });
                }
            });

            // Apply shaking/bumpy effect if driving over a tree
            if (stage === 1 && isDrivingOverTree && Math.abs(carSpeed) > 0.05) {
                carGroup.position.y = 0.52;
                const shakeAmount = 0.09;
                const frequency = 45.0;
                carGroup.rotation.x = Math.sin(time * frequency) * shakeAmount;
                carGroup.rotation.z = Math.cos(time * (frequency + 5.0)) * shakeAmount;
                
                // Procedural squeaking sound
                if (audioCtx && Math.random() < 0.18) {
                    try {
                        const osc = audioCtx.createOscillator();
                        const oscGain = audioCtx.createGain();
                        osc.connect(oscGain);
                        oscGain.connect(audioCtx.destination);
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(450 + Math.random() * 200, audioCtx.currentTime);
                        osc.frequency.linearRampToValueAtTime(800 + Math.random() * 150, audioCtx.currentTime + 0.08);
                        oscGain.gain.setValueAtTime(masterVolume * 0.2, audioCtx.currentTime);
                        oscGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
                        osc.start();
                        osc.stop(audioCtx.currentTime + 0.09);
                    } catch(e) {}
                }
            }

            // Update Overtaking Black Cars Event
            if (stage === 1) {
                if (kilometersRemaining <= 40.0 && !overtakeEventStarted) {
                    overtakeEventStarted = true;
                    // Spawn 5 black cars behind the player
                    for (let i = 0; i < 5; i++) {
                        const carColor = 0x151515; // very dark/black car
                        const mesh = createCarMesh(carColor);
                        const lane = (i % 2 === 0) ? 4 : -4;
                        const zPos = carGroup.position.z - 110 - i * 35;
                        mesh.position.set(lane, 0.1, zPos);
                        scene.add(mesh);
                        
                        overtakeCars.push({
                            mesh: mesh,
                            speed: 4.8 + Math.random() * 0.7,
                            lane: lane,
                            passbyAudio: new Audio('flutie8211-muscle-car-driving-left-to-right-559148.mp3'),
                            passbyPlayed: false
                        });
                    }
                }
                
                if (overtakeEventStarted) {
                    overtakeCars.forEach(car => {
                        car.mesh.position.z += car.speed;
                        const relZ = car.mesh.position.z - carGroup.position.z;
                        
                        // Passby audio trigger for overtake event cars
                        const distZ = Math.abs(relZ);
                        if (distZ < 65 && !car.passbyPlayed) {
                            car.passbyPlayed = true;
                            if (car.passbyAudio) {
                                car.passbyAudio.currentTime = 0;
                                car.passbyAudio.play().catch(e => {});
                            }
                        }
                        
                        if (car.passbyAudio && car.passbyPlayed) {
                            const dx = car.mesh.position.x - carGroup.position.x;
                            const dist = Math.sqrt(distZ * distZ + dx * dx);
                            const maxDist = 80;
                            const volumeScale = Math.max(0, 1 - dist / maxDist);
                            car.passbyAudio.volume = Math.min(1.0, masterVolume * 8.0 * volumeScale);
                        }

                        if (relZ > 500) {
                            if (car.passbyAudio) {
                                try { car.passbyAudio.pause(); } catch(e) {}
                            }
                            scene.remove(car.mesh);
                        }
                    });
                }
            }

            // Update Accident Rescue Event Trigger
            if (stage === 1) {
                if (kilometersRemaining <= 15.0 && rescueSceneState === 'none') {
                    rescueSceneState = 'approaching';
                    rescueSceneChunkIdx = currentChunkIndex + 1; // spawn rescue in the next chunk
                    rescueSceneZ = rescueSceneChunkIdx * CHUNK_SIZE; // center of that chunk
                }
            }

            // Update Accident Rescue Flashing Lights & Smoke
            if (stage === 1 && rescueSceneState !== 'none') {
                const isFlashTick = Math.floor(time * 8) % 2 === 0;
                
                // Toggle red and blue lights
                rescueRedLights.forEach(light => {
                    light.material.color.setHex(isFlashTick ? 0xff0000 : 0x220000);
                });
                rescueBlueLights.forEach(light => {
                    light.material.color.setHex(isFlashTick ? 0x000022 : 0x0000ff);
                });

                // Spawn smoke particles from crashed car engine compartment
                if (crashedCar && Math.random() < 0.25 && smokeParticles.length < 40) {
                    const smokeGeo = new THREE.SphereGeometry(0.18 + Math.random() * 0.15, 8, 8);
                    const smokeMat = new THREE.MeshLambertMaterial({
                        color: 0xcccccc,
                        transparent: true,
                        opacity: 0.6
                    });
                    const particle = new THREE.Mesh(smokeGeo, smokeMat);
                    particle.position.set(-2.5 + (Math.random() - 0.5) * 0.4, 0.9, rescueSceneZ + 5 + (Math.random() - 0.5) * 0.4);
                    scene.add(particle);
                    smokeParticles.push({
                        mesh: particle,
                        velocity: new THREE.Vector3((Math.random() - 0.5) * 0.4, 1.2 + Math.random() * 0.8, (Math.random() - 0.5) * 0.4),
                        opacity: 0.6,
                        scaleSpeed: 0.6
                    });
                }
            }

            // Animate existing smoke particles
