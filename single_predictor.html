<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ATTACKS | Single Predictor</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6400;
            --primary-glow: rgba(255, 100, 0, 0.45);
            --green: #00FF88;
            --green-glow: rgba(0, 255, 136, 0.35);
            --red: #FF2244;
            --gold: #FFD700;
            --gold-glow: rgba(255, 215, 0, 0.35);
            --bg: #04040c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Scanline overlay */
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.14), rgba(0,0,0,0.14) 1.5px, transparent 1.5px, transparent 3px);
            pointer-events: none; z-index: 9999; opacity: 0.7;
        }

        /* Ambient particles bg */
        #particle-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }

        /* Header */
        .header {
            width: 100%; padding: 22px 30px 18px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid rgba(255, 100, 0, 0.12);
            background: rgba(4,4,12,0.9);
            backdrop-filter: blur(12px);
            position: sticky; top: 0; z-index: 100;
        }

        .header-logo {
            font-family: 'JetBrains Mono', monospace;
            font-size: 20px; font-weight: 900; letter-spacing: 6px;
            color: var(--primary);
            text-shadow: 0 0 12px var(--primary-glow);
        }

        .header-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px; letter-spacing: 3px; color: #555;
            text-transform: uppercase;
        }

        .btn-back {
            background: transparent;
            border: 1px solid rgba(255,100,0,0.3);
            color: rgba(255,100,0,0.7);
            padding: 8px 18px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px; letter-spacing: 2px;
            border-radius: 6px; cursor: pointer;
            transition: 0.25s;
        }

        .btn-back:hover {
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        /* Main Container */
        .main-container {
            width: 100%; max-width: 720px;
            padding: 50px 20px 80px;
            position: relative; z-index: 1;
            display: flex; flex-direction: column; align-items: center;
        }

        /* Form Card */
        .card {
            width: 100%; background: rgba(10, 10, 24, 0.75);
            border: 1.5px solid rgba(255, 100, 0, 0.3);
            border-radius: 18px; padding: 35px 30px;
            backdrop-filter: blur(14px);
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.6);
            margin-bottom: 30px; text-align: center;
        }

        .card-icon {
            font-size: 38px; color: var(--primary);
            text-shadow: 0 0 15px var(--primary-glow); margin-bottom: 10px;
        }

        .card-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 22px; font-weight: 900; letter-spacing: 4px;
            color: var(--primary); margin-bottom: 6px;
            text-transform: uppercase;
        }

        .card-sub {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px; color: rgba(255,255,255,0.45);
            letter-spacing: 2px; margin-bottom: 30px;
        }

        .form-group {
            display: flex; flex-direction: column; gap: 8px;
            margin-bottom: 25px; text-align: left;
        }

        .form-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px; letter-spacing: 2px; color: rgba(255,255,255,0.5);
            text-transform: uppercase;
        }

        .select-input {
            width: 100%; padding: 14px 18px;
            background: rgba(4, 4, 12, 0.8);
            border: 1.5px solid rgba(255, 100, 0, 0.35);
            border-radius: 10px; color: #fff;
            font-family: 'Outfit', sans-serif;
            font-size: 16px; font-weight: 700; letter-spacing: 2px;
            outline: none; transition: all 0.3s ease; cursor: pointer;
        }

        .select-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .btn-predict {
            width: 100%; padding: 16px;
            background: linear-gradient(135deg, #FF6400, #FF9D00);
            border: none; border-radius: 12px;
            color: #000; font-family: 'JetBrains Mono', monospace;
            font-size: 14px; font-weight: 900; letter-spacing: 3px;
            cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .btn-predict:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px var(--primary);
        }

        /* Result Panel */
        .result-panel {
            width: 100%; display: none;
            flex-direction: column; align-items: center; gap: 20px;
            animation: fadeIn 0.6s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-card {
            width: 100%; background: rgba(10, 10, 24, 0.85);
            border: 1.5px solid rgba(255, 100, 0, 0.4);
            border-radius: 16px; padding: 30px;
            backdrop-filter: blur(12px); box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        .op-name {
            font-family: 'JetBrains Mono', monospace;
            font-size: 28px; font-weight: 900; letter-spacing: 4px;
            color: var(--gold); text-shadow: 0 0 15px rgba(255,215,0,0.4);
            margin-bottom: 4px; text-transform: uppercase; text-align: center;
        }

        .op-status {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px; letter-spacing: 2px; color: var(--primary);
            text-align: center; margin-bottom: 25px;
        }

        .stat-group { margin-bottom: 16px; }

        .stat-label {
            display: flex; justify-content: space-between;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px; letter-spacing: 2px; color: rgba(255,255,255,0.6);
            margin-bottom: 6px;
        }

        .stat-bar-track {
            height: 8px; background: rgba(255,255,255,0.06);
            border-radius: 6px; overflow: hidden; border: 1px solid rgba(255,100,0,0.2);
        }

        .stat-bar-fill {
            height: 100%; border-radius: 6px;
            background: linear-gradient(90deg, #FF6400, #FFD700);
            box-shadow: 0 0 10px var(--primary-glow);
            transition: width 0.8s ease;
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>
    <canvas id="particle-bg"></canvas>

    <header class="header">
        <div>
            <div class="header-logo">ATTACKS</div>
            <div class="header-tag">SINGLE PREDICTOR v1.0</div>
        </div>
        <button class="btn-back" onclick="goBack()">← SEARCH ENGINE</button>
    </header>

    <main class="main-container">
        
        <div class="card">
            <div class="card-icon">🔮</div>
            <h1 class="card-title">SINGLE PREDICTOR</h1>
            <p class="card-sub">PREDICT ATTACK POWER & THREAT SPECTRUM OF AN OPERATIVE</p>

            <div class="form-group">
                <label class="form-label" for="op-select">SELECT OPERATIVE</label>
                <select id="op-select" class="select-input">
                    <option value="VAISAL">VAISAL (BUS OPERATIVE)</option>
                    <option value="DHARNISH">DHARNISH (COBRA FIGHTER)</option>
                    <option value="NITHISH">NITHISH (BUS BELL OPERATIVE)</option>
                    <option value="GIRISH">GIRISH (HEAVY LORRY DRIVER)</option>
                    <option value="LOGITH">LOGITH (BIG KNIFE OPERATIVE)</option>
                    <option value="SURYA">SURYA (RIVER BATHING)</option>
                    <option value="THAYA">THAYA (SQUAD AGENT)</option>
                    <option value="KISHOOR">KISHOOR (TACTICAL OPERATIVE)</option>
                    <option value="VASANTH">VASANTH (LEADER OPERATIVE)</option>
                </select>
            </div>

            <button class="btn-predict" onclick="runPrediction()">RUN SINGLE PREDICTION</button>
        </div>

        <div class="result-panel" id="result-panel">
            <div class="result-card">
                <div class="op-name" id="res-name">VAISAL</div>
                <div class="op-status" id="res-status">PREDICTED THREAT: HIGH LEVEL ADVERSARY</div>

                <div class="stat-group">
                    <div class="stat-label"><span>ATTACK POTENTIAL</span><span id="st-atk">95%</span></div>
                    <div class="stat-bar-track"><div class="stat-bar-fill" id="st-atk-fill" style="width: 95%;"></div></div>
                </div>

                <div class="stat-group">
                    <div class="stat-label"><span>AGILITY & SPEED</span><span id="st-spd">88%</span></div>
                    <div class="stat-bar-track"><div class="stat-bar-fill" id="st-spd-fill" style="width: 88%;"></div></div>
                </div>

                <div class="stat-group">
                    <div class="stat-label"><span>TACTICAL SYNCHRONY</span><span id="st-syn">96%</span></div>
                    <div class="stat-bar-track"><div class="stat-bar-fill" id="st-syn-fill" style="width: 96%;"></div></div>
                </div>

                <div class="stat-group">
                    <div class="stat-label"><span>VICTORY PROBABILITY</span><span id="st-vic">94%</span></div>
                    <div class="stat-bar-track"><div class="stat-bar-fill" id="st-vic-fill" style="width: 94%;"></div></div>
                </div>
            </div>
        </div>

    </main>

    <script>
        function goBack() {
            const dimmer = document.createElement('div');
            dimmer.style.cssText = `
                position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                background: #000; z-index: 99999; opacity: 0;
                transition: opacity 0.8s ease;
            `;
            document.body.appendChild(dimmer);
            requestAnimationFrame(() => requestAnimationFrame(() => {
                dimmer.style.opacity = '1';
                setTimeout(() => { window.location.href = 'attacks_game.html'; }, 900);
            }));
        }

        const DATA = {
            'VAISAL':   { status: 'DRIVING THE BUS 🚌', atk: 95, spd: 88, syn: 96, vic: 94 },
            'DHARNISH': { status: 'FIGHTING COBRAS 🐍', atk: 92, spd: 90, syn: 90, vic: 91 },
            'NITHISH':  { status: 'RINGING BUS BELL 🔔', atk: 94, spd: 95, syn: 92, vic: 93 },
            'GIRISH':   { status: 'DRIVING THE TRUCK 🚚', atk: 90, spd: 91, syn: 94, vic: 90 },
            'LOGITH':   { status: 'WIELDING BIG KNIFE 🔪', atk: 87, spd: 89, syn: 90, vic: 88 },
            'SURYA':    { status: 'SWIMMING IN RIVER 🌊', atk: 93, spd: 90, syn: 95, vic: 92 },
            'THAYA':    { status: 'TACTICAL AGENT ⚡', atk: 89, spd: 92, syn: 93, vic: 89 },
            'KISHOOR':  { status: 'SQUAD SUPPORT 🛡️', atk: 88, spd: 87, syn: 91, vic: 87 },
            'VASANTH':  { status: 'SQUAD LEADER 👑', atk: 96, spd: 94, syn: 98, vic: 97 }
        };

        function runPrediction() {
            const name = document.getElementById('op-select').value;
            const info = DATA[name] || { status: 'UNKNOWN THREAT', atk: 85, spd: 85, syn: 85, vic: 85 };

            document.getElementById('res-name').textContent = name;
            document.getElementById('res-status').textContent = `STATUS: ${info.status}`;

            document.getElementById('st-atk').textContent = info.atk + '%';
            document.getElementById('st-atk-fill').style.width = info.atk + '%';

            document.getElementById('st-spd').textContent = info.spd + '%';
            document.getElementById('st-spd-fill').style.width = info.spd + '%';

            document.getElementById('st-syn').textContent = info.syn + '%';
            document.getElementById('st-syn-fill').style.width = info.syn + '%';

            document.getElementById('st-vic').textContent = info.vic + '%';
            document.getElementById('st-vic-fill').style.width = info.vic + '%';

            document.getElementById('result-panel').style.display = 'flex';
        }

        // Particle canvas background
        (function() {
            const canvas = document.getElementById('particle-bg');
            const ctx = canvas.getContext('2d');
            let W, H, particles = [];

            function resize() {
                W = canvas.width  = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }

            resize();
            window.addEventListener('resize', resize);

            for (let i = 0; i < 45; i++) {
                particles.push({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight,
                    r: Math.random() * 1.3 + 0.3,
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.3,
                    alpha: Math.random() * 0.3 + 0.08
                });
            }

            function draw() {
                ctx.clearRect(0, 0, W, H);
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.x < 0 || p.x > W) p.vx *= -1;
                    if (p.y < 0 || p.y > H) p.vy *= -1;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,100,0,${p.alpha})`;
                    ctx.fill();
                });
                requestAnimationFrame(draw);
            }
            draw();
        })();
    </script>
</body>
</html>
