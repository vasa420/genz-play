<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | ATC ARCADE</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            width: 100%; height: 100%;
            background: #020204;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .card {
            background: rgba(15,15,20,0.9);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 50px 40px;
            text-align: center;
            backdrop-filter: blur(20px);
            max-width: 400px;
            width: 90%;
        }

        .icon { font-size: 60px; margin-bottom: 20px; }

        h1 {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 3px;
            color: #fff;
            margin-bottom: 10px;
        }

        p {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: #555;
            letter-spacing: 2px;
            margin-bottom: 35px;
            line-height: 1.6;
            text-transform: uppercase;
        }

        .btn {
            background: transparent;
            color: #888;
            border: 1px solid #333;
            padding: 12px 28px;
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn:hover {
            background: rgba(255,255,255,0.05);
            border-color: #555;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🎮</div>
        <h1>COMING SOON</h1>
        <p>New game concept loading...<br>Stay tuned.</p>
        <button class="btn" onclick="location.href='arcade_hub.html'">← Back to Arcade</button>
    </div>
</body>
</html>
