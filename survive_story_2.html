<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SURVIVE IT | Gary Hilton Story</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #39ff14;
            --primary-glow: rgba(57, 255, 20, 0.4);
            --danger: #ff3333;
            --danger-glow: rgba(255, 51, 51, 0.45);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        html, body {
            background: #020205;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            width: 100%; height: 100%;
            overflow: hidden;
        }

        /* Scanlines Overlay */
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0.2), rgba(0,0,0,0.2) 1.5px,
                transparent 1.5px, transparent 3px
            );
            pointer-events: none; z-index: 9999; opacity: 0.85;
        }

        /* CRT Screen Glow */
        .crt-glow {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 60%, rgba(255, 51, 51, 0.015) 100%);
            pointer-events: none; z-index: 9998;
        }

        /* CRT Container */
        .crt-container {
            width: 100%; height: 100%;
            position: fixed; top: 0; left: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            transform-origin: center center;
        }

        .crt-collapse {
            animation: crtCollapseEffect 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }
        .crt-expand {
            animation: crtExpandEffect 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        @keyframes crtCollapseEffect {
            0%   { transform: scaleY(1) scaleX(1);    filter: brightness(1); }
            40%  { transform: scaleY(0.01) scaleX(1.1); filter: brightness(3); }
            80%  { transform: scaleY(0.01) scaleX(0.02); filter: brightness(6); }
            100% { transform: scaleY(0) scaleX(0);    filter: brightness(10); opacity: 0; }
        }
        @keyframes crtExpandEffect {
            0%   { transform: scaleY(0) scaleX(0);    filter: brightness(10); opacity: 0; }
            40%  { transform: scaleY(0.01) scaleX(1.1); filter: brightness(5); opacity: 1; }
            80%  { transform: scaleY(1) scaleX(1.02); filter: brightness(1.5); }
            100% { transform: scaleY(1) scaleX(1);    filter: brightness(1); opacity: 1; }
        }

        /* Content layout */
        .story-box {
            max-width: 850px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            text-align: left;
            border: 1px solid rgba(255, 51, 51, 0.15);
            padding: 40px;
            background: rgba(4, 4, 12, 0.75);
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
        }

        .header-title {
            color: var(--danger);
            font-size: clamp(20px, 3.5vw, 32px);
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 0 0 15px var(--danger-glow);
            text-transform: uppercase;
        }

        .header-subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: clamp(14px, 2.2vw, 18px);
            font-weight: 400;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        .divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, var(--danger), transparent);
            margin: 10px 0;
            opacity: 0.7;
        }

        .story-text {
            color: rgba(255, 255, 255, 0.95);
            font-size: clamp(14px, 2.4vw, 18px);
            font-weight: 400;
            line-height: 1.8;
            letter-spacing: 1px;
            word-wrap: break-word;
        }

        .cursor {
            display: inline-block;
            width: 10px; height: 1.1em;
            background: var(--danger);
            margin-left: 4px;
            animation: blink 0.8s infinite steps(2);
            vertical-align: middle;
            box-shadow: 0 0 8px var(--danger-glow);
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

        /* Skip / Next Hint */
        .hint {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            letter-spacing: 4px;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            animation: pulseHint 2s ease-in-out infinite;
            white-space: nowrap;
        }
        @keyframes pulseHint {
            0%,100% { opacity: 0.3; }
            50%      { opacity: 0.7; }
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>
    <div class="crt-glow"></div>

    <div class="crt-container crt-expand" id="screen-container">
        <div class="story-box">
            <div>
                <div class="header-title" id="type-title"></div>
                <div class="header-subtitle" id="type-subtitle"></div>
            </div>
            <div class="divider"></div>
            <div class="story-text">
                <span id="type-body"></span><span class="cursor" id="body-cursor"></span>
            </div>
        </div>
        <div class="hint" id="hint-text">TAP ANYWHERE TO SKIP ▶</div>
    </div>

    <script>
        // ── Audio Engine ──────────────────────────────────────
        let audioCtx = null;
        const masterVolume = 0.06;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playBeep(type) {
            initAudio();
            if (!audioCtx) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc  = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                if (type === 'typewriter') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(150 + Math.random() * 70, audioCtx.currentTime);
                    gain.gain.setValueAtTime(masterVolume * 0.45, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.035);
                } else if (type === 'transition') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(60, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 0.5);
                    gain.gain.setValueAtTime(masterVolume, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.55);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.6);
                }
            } catch(e) { console.warn(e); }
        }

        // ── Flow/Content Setup ────────────────────────────────
        const titleText = "The National Forest Serial Killer";
        const subtitleText = "(Inspired by Gary Hilton)";
        const bodyText = "Between 2007 and 2008, a serial killer named Gary Hilton targeted hikers in remote forests in the United States. He searched for people who were alone on forest trails, attacked them, and used the vast wilderness to hide evidence and avoid being caught. The dense forest made it difficult for police to track his movements.";

        const screenContainer = document.getElementById('screen-container');
        const titleEl = document.getElementById('type-title');
        const subtitleEl = document.getElementById('type-subtitle');
        const bodyEl = document.getElementById('type-body');
        const hintEl = document.getElementById('hint-text');
        
        let typingFinished = false;
        let skipLocked = false;
        let autoTimeout = null;

        function goToLobby() {
            if (skipLocked) return;
            skipLocked = true;
            if (autoTimeout) clearTimeout(autoTimeout);

            // Transition back to main lobby
            playBeep('transition');
            screenContainer.classList.remove('crt-expand');
            screenContainer.classList.add('crt-collapse');
            setTimeout(() => {
                location.href = 'survive_it.html';
            }, 620);
        }

        // Tap/click handler
        document.addEventListener('click', () => {
            if (skipLocked) return;
            if (!typingFinished) {
                // Skip all typing animations
                typingFinished = true;
                titleEl.innerText = titleText;
                subtitleEl.innerText = subtitleText;
                bodyEl.innerText = bodyText;
                document.getElementById('body-cursor').style.display = 'none';
                hintEl.innerText = "TAP ANYWHERE TO CONTINUE ▶";
                
                // Automatically redirect to lobby after 5 seconds
                autoTimeout = setTimeout(goToLobby, 5000);
            } else {
                // Go immediately
                goToLobby();
            }
        });

        // Sequential Typewriter
        function runTypewriter() {
            let i = 0;
            
            function typeTitle() {
                if (typingFinished) return;
                if (i < titleText.length) {
                    titleEl.innerText += titleText.charAt(i);
                    playBeep('typewriter');
                    i++;
                    setTimeout(typeTitle, 50);
                } else {
                    i = 0;
                    typeSubtitle();
                }
            }

            function typeSubtitle() {
                if (typingFinished) return;
                if (i < subtitleText.length) {
                    subtitleEl.innerText += subtitleText.charAt(i);
                    playBeep('typewriter');
                    i++;
                    setTimeout(typeSubtitle, 40);
                } else {
                    i = 0;
                    typeBody();
                }
            }

            function typeBody() {
                if (typingFinished) return;
                if (i < bodyText.length) {
                    bodyEl.innerText += bodyText.charAt(i);
                    playBeep('typewriter');
                    i++;
                    setTimeout(typeBody, 45);
                } else {
                    typingFinished = true;
                    document.getElementById('body-cursor').style.display = 'none';
                    hintEl.innerText = "TAP ANYWHERE TO CONTINUE ▶";
                    
                    // Stay 5 seconds and automatically redirect to lobby
                    autoTimeout = setTimeout(goToLobby, 5000);
                }
            }

            typeTitle();
        }

        window.onload = function() {
            setTimeout(runTypewriter, 500);
        };
    </script>
</body>
</html>
