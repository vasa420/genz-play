<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SURVIVE IT | Tactical Wave Simulation</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF007F;
            --primary-glow: rgba(255, 0, 127, 0.45);
            --secondary: #7F00FF;
            --secondary-glow: rgba(127, 0, 255, 0.45);
            --cyan: #00F6FF;
            --bg: #04040c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
        }

        /* Scanlines Overlay */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1.5px,
                transparent 1.5px,
                transparent 3px
            );
            pointer-events: none;
            z-index: 9999;
            opacity: 0.8;
        }

        /* Screen Glitch Tint */
        .crt-glow {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 60%, rgba(255, 0, 127, 0.05) 100%);
            pointer-events: none;
            z-index: 9998;
        }

        /* Header */
        header {
            width: 100%;
            padding: 25px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 0, 127, 0.15);
            background: rgba(4, 4, 12, 0.9);
            backdrop-filter: blur(12px);
            z-index: 10;
        }

        .header-title-group {
            display: flex;
            flex-direction: column;
        }

        .system-status {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 4px;
            color: var(--primary);
            text-shadow: 0 0 8px var(--primary-glow);
            text-transform: uppercase;
            animation: blink 1.5s infinite ease-in-out;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 5px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(255, 0, 127, 0.3);
        }

        .btn-lobby {
            background: transparent;
            border: 1px solid rgba(255, 0, 127, 0.3);
            color: rgba(255, 0, 127, 0.8);
            padding: 10px 22px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 2px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            text-transform: uppercase;
        }

        .btn-lobby:hover {
            border-color: var(--primary);
            color: #fff;
            background: rgba(255, 0, 127, 0.1);
            box-shadow: 0 0 15px var(--primary-glow);
            transform: translateY(-2px);
        }

        /* Canvas Wrapper */
        .simulation-container {
            flex-grow: 1;
            width: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        #sim-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Overlay HUD Panels */
        .hud-overlay {
            position: absolute;
            pointer-events: none;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
            box-sizing: border-box;
            z-index: 2;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
        }

        .hud-panel {
            background: rgba(8, 8, 20, 0.7);
            border: 1px solid rgba(255, 0, 127, 0.15);
            border-radius: 12px;
            padding: 15px 20px;
            backdrop-filter: blur(8px);
            font-family: 'JetBrains Mono', monospace;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .hud-label {
            font-size: 9px;
            color: #888;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .hud-value {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
        }

        .hud-value.highlight {
            color: var(--primary);
            text-shadow: 0 0 8px var(--primary-glow);
        }

        .hud-bottom {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .info-panel {
            max-width: 600px;
            width: 100%;
            text-align: center;
            pointer-events: auto;
        }

        .info-title {
            font-size: 14px;
            letter-spacing: 3px;
            color: var(--cyan);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .info-desc {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.6;
            margin-bottom: 12px;
        }

        /* Controls Block */
        .simulation-controls {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .control-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            color: white;
            padding: 12px 28px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .control-btn:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 6px 22px rgba(255, 0, 127, 0.7);
        }

        .control-btn.secondary {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: none;
        }

        .control-btn.secondary:hover {
            background: rgba(255,255,255,0.1);
            box-shadow: 0 0 10px rgba(255,255,255,0.1);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Footer */
        footer {
            width: 100%;
            padding: 20px;
            text-align: center;
            border-top: 1px solid rgba(255, 0, 127, 0.1);
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: #444;
            letter-spacing: 4px;
            background: rgba(4, 4, 12, 0.85);
            z-index: 10;
        }

        footer span {
            color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>
    <div class="crt-glow"></div>

    <!-- Header -->
    <header>
        <div class="header-title-group">
            <span class="system-status">● DEPLOYMENT PROTOCOL ACTIVE</span>
            <span class="logo-text">SURVIVE IT</span>
        </div>
        <button class="btn-lobby" onclick="location.href='arcade_hub.html'">← Return to Lobby</button>
    </header>

    <!-- Canvas Simulation Area -->
    <div class="simulation-container">
        <canvas id="sim-canvas"></canvas>

        <div class="hud-overlay">
            <div class="hud-top">
                <div class="hud-panel">
                    <div class="hud-label">CORES INJECTED</div>
                    <div class="hud-value highlight" id="hud-injected">00000</div>
                </div>
                <div class="hud-panel">
                    <div class="hud-label">SHIELD INTEGRITY</div>
                    <div class="hud-value" id="hud-integrity">100.0%</div>
                </div>
            </div>

            <div class="hud-bottom">
                <div class="hud-panel info-panel">
                    <div class="info-title">TACTICAL PREVIEW ARENA</div>
                    <p class="info-desc">
                        A testbed for the defense algorithm. Click/Tap the simulator grid to detonate tactical shield pulses and vaporize the incoming data debris.
                    </p>
                    <div class="simulation-controls">
                        <button class="control-btn" onclick="triggerGridPulse()">GRID DETONATION</button>
                        <button class="control-btn secondary" onclick="resetSimStats()">RESET CYCLE</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        SURVIVE IT v1.0.0 · POWERED BY <span>ATC STUDIO</span> ENGINE
    </footer>

    <script>
        const canvas = document.getElementById('sim-canvas');
        const ctx = canvas.getContext('2d');

        // Stats elements
        const countEl = document.getElementById('hud-injected');
        const integrityEl = document.getElementById('hud-integrity');

        let coreCount = 0;
        let coreIntegrity = 100.0;

        // Resize Canvas
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Particles System
        const particles = [];
        const blasts = [];
        const gridLines = [];

        // Central Shield Core
        const core = {
            x: 0,
            y: 0,
            radius: 70,
            pulse: 0,
            targetRadius: 70
        };

        // Initialize grid lines
        const numGridLines = 16;
        for (let i = 0; i < numGridLines; i++) {
            gridLines.push({
                angle: (i / numGridLines) * Math.PI * 2,
                speed: 0.002
            });
        }

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.max(canvas.width, canvas.height) * 0.8;
                this.x = canvas.width / 2 + Math.cos(angle) * distance;
                this.y = canvas.height / 2 + Math.sin(angle) * distance;
                this.radius = Math.random() * 3 + 2;
                this.speed = Math.random() * 2 + 1;
                this.color = Math.random() > 0.5 ? '#FF007F' : '#7F00FF';
                this.glow = 10;
            }

            update() {
                const dx = canvas.width / 2 - this.x;
                const dy = canvas.height / 2 - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < core.radius + 5) {
                    // Collision with Shield Core
                    core.targetRadius = 85;
                    coreIntegrity = Math.max(0, coreIntegrity - 0.2);
                    integrityEl.innerText = coreIntegrity.toFixed(1) + "%";
                    this.reset();
                    return;
                }

                // Check blast collisions
                for (let b of blasts) {
                    const bdx = b.x - this.x;
                    const bdy = b.y - this.y;
                    const bdist = Math.sqrt(bdx * bdx + bdy * bdy);
                    if (bdist < b.radius) {
                        this.spawnSparks();
                        this.reset();
                        coreCount++;
                        updateScoreDisplay();
                        return;
                    }
                }

                // Move towards center
                this.x += (dx / dist) * this.speed;
                this.y += (dy / dist) * this.speed;
            }

            spawnSparks() {
                for (let i = 0; i < 6; i++) {
                    blasts.push({
                        x: this.x,
                        y: this.y,
                        radius: 1,
                        maxRadius: Math.random() * 15 + 10,
                        speed: Math.random() * 1.5 + 0.5,
                        opacity: 1,
                        color: this.color,
                        isSpark: true,
                        vx: (Math.random() - 0.5) * 4,
                        vy: (Math.random() - 0.5) * 4
                    });
                }
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = this.glow;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        // Spawn initially
        const maxParticles = 60;
        for (let i = 0; i < maxParticles; i++) {
            particles.push(new Particle());
        }

        // Click to shoot tactical blast
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            createBlast(mouseX, mouseY);
        });

        function createBlast(x, y) {
            blasts.push({
                x: x,
                y: y,
                radius: 1,
                maxRadius: 60,
                speed: 4,
                opacity: 1,
                color: '#00F6FF',
                isSpark: false
            });
        }

        function triggerGridPulse() {
            createBlast(canvas.width / 2, canvas.height / 2);
            for(let i = 0; i < 4; i++) {
                const angle = (i / 4) * Math.PI * 2;
                createBlast(canvas.width/2 + Math.cos(angle)*150, canvas.height/2 + Math.sin(angle)*150);
            }
        }

        function resetSimStats() {
            coreCount = 0;
            coreIntegrity = 100.0;
            updateScoreDisplay();
            integrityEl.innerText = "100.0%";
            blasts.length = 0;
        }

        function updateScoreDisplay() {
            countEl.innerText = String(coreCount).padStart(5, '0');
        }

        // Animation Loop
        function animate() {
            ctx.fillStyle = 'rgba(4, 4, 12, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw radial grid
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            ctx.save();
            ctx.strokeStyle = 'rgba(255, 0, 127, 0.05)';
            ctx.lineWidth = 1;
            
            // Draw grid circles
            for (let r = 100; r < Math.max(canvas.width, canvas.height); r += 100) {
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Draw rotating grid lines
            for (let line of gridLines) {
                line.angle += line.speed;
                const endX = cx + Math.cos(line.angle) * Math.max(canvas.width, canvas.height);
                const endY = cy + Math.sin(line.angle) * Math.max(canvas.width, canvas.height);
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(endX, endY);
                ctx.stroke();
            }
            ctx.restore();

            // Update & Draw Core
            core.radius += (core.targetRadius - core.radius) * 0.1;
            if (core.radius > core.targetRadius - 0.5) {
                core.targetRadius = 70;
            }

            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, core.radius, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(127, 0, 255, 0.5)';
            ctx.lineWidth = 3;
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#7F00FF';
            ctx.fillStyle = 'rgba(8, 8, 28, 0.8)';
            ctx.fill();
            ctx.stroke();

            // Inner core glow
            ctx.beginPath();
            ctx.arc(cx, cy, core.radius * 0.5, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 0, 127, 0.4)';
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#FF007F';
            ctx.fill();
            ctx.restore();

            // Update & Draw Blasts
            for (let i = blasts.length - 1; i >= 0; i--) {
                const b = blasts[i];
                if (b.isSpark) {
                    b.x += b.vx;
                    b.y += b.vy;
                    b.radius += b.speed;
                    b.opacity -= 0.05;
                } else {
                    b.radius += b.speed;
                    b.opacity = 1 - (b.radius / b.maxRadius);
                }

                if (b.opacity <= 0 || b.radius >= b.maxRadius) {
                    blasts.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                if (b.isSpark) {
                    ctx.fillStyle = b.color;
                    ctx.globalAlpha = b.opacity;
                    ctx.fill();
                } else {
                    ctx.strokeStyle = b.color;
                    ctx.lineWidth = 2;
                    ctx.globalAlpha = b.opacity;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = b.color;
                    ctx.stroke();
                }
                ctx.restore();
            }

            // Update & Draw Particles
            for (let p of particles) {
                p.update();
                p.draw();
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
