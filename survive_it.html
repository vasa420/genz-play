<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SURVIVE IT | Coming Soon</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF007F;
            --primary-glow: rgba(255, 0, 127, 0.45);
            --secondary: #7F00FF;
            --secondary-glow: rgba(127, 0, 255, 0.45);
            --cyan: #00F6FF;
            --bg: #04040c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
        }

        /* Scanlines Overlay */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1.5px,
                transparent 1.5px,
                transparent 3px
            );
            pointer-events: none;
            z-index: 9999;
            opacity: 0.8;
        }

        /* CRT Screen Glow Tint */
        .crt-glow {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 65%, rgba(255, 0, 127, 0.05) 100%);
            pointer-events: none;
            z-index: 9998;
        }

        /* Ambient animated background grid & stars */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Header */
        header {
            width: 100%;
            padding: 25px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 0, 127, 0.1);
            background: rgba(4, 4, 12, 0.9);
            backdrop-filter: blur(12px);
            z-index: 10;
        }

        .header-title-group {
            display: flex;
            flex-direction: column;
        }

        .system-status {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 4px;
            color: var(--primary);
            text-shadow: 0 0 8px var(--primary-glow);
            text-transform: uppercase;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 5px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(255, 0, 127, 0.3);
        }

        .btn-lobby {
            background: transparent;
            border: 1px solid rgba(255, 0, 127, 0.3);
            color: rgba(255, 0, 127, 0.8);
            padding: 10px 22px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 2px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            text-transform: uppercase;
        }

        .btn-lobby:hover {
            border-color: var(--primary);
            color: #fff;
            background: rgba(255, 0, 127, 0.1);
            box-shadow: 0 0 15px var(--primary-glow);
            transform: translateY(-2px);
        }

        /* Coming Soon Panel */
        .coming-soon-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 1;
            padding: 20px;
            max-width: 800px;
        }

        .coming-soon-badge {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 8px 24px;
            font-weight: 900;
            font-size: 13px;
            letter-spacing: 4px;
            border-radius: 30px;
            text-transform: uppercase;
            box-shadow: 0 0 25px var(--primary-glow);
            margin-bottom: 30px;
            animation: pulseGlow 2s ease-in-out infinite;
        }

        .game-title {
            font-size: clamp(48px, 8vw, 90px);
            font-weight: 900;
            letter-spacing: 12px;
            background: linear-gradient(135deg, #fff, #888);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            text-transform: uppercase;
            text-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .tagline {
            font-size: clamp(14px, 2.5vw, 18px);
            color: var(--cyan);
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 40px;
            font-weight: 300;
            text-shadow: 0 0 8px rgba(0, 246, 255, 0.3);
        }

        /* Countdown Container */
        .countdown-wrapper {
            display: flex;
            gap: 20px;
            margin-bottom: 50px;
        }

        .countdown-box {
            background: rgba(8, 8, 20, 0.7);
            border: 1px solid rgba(255, 0, 127, 0.15);
            border-radius: 16px;
            min-width: 90px;
            padding: 20px 10px;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .countdown-num {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(28px, 4vw, 44px);
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
            margin-bottom: 5px;
        }

        .countdown-label {
            font-size: 9px;
            color: #888;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .sub-description {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            max-width: 500px;
            line-height: 1.6;
            letter-spacing: 1px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 25px;
        }

        @keyframes pulseGlow {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 25px var(--primary-glow);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 0 40px rgba(255, 0, 127, 0.8);
            }
        }

        /* Footer */
        footer {
            width: 100%;
            padding: 20px;
            text-align: center;
            border-top: 1px solid rgba(255, 0, 127, 0.08);
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: #444;
            letter-spacing: 4px;
            background: rgba(4, 4, 12, 0.85);
            z-index: 10;
        }

        footer span {
            color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>
    <div class="crt-glow"></div>

    <!-- Background Canvas -->
    <canvas id="bg-canvas"></canvas>

    <!-- Header -->
    <header>
        <div class="header-title-group">
            <span class="system-status">● SIMULATOR OFFLINE</span>
            <span class="logo-text">SURVIVE IT</span>
        </div>
        <button class="btn-lobby" onclick="location.href='arcade_hub.html'">← Return to Lobby</button>
    </header>

    <!-- Coming Soon Container -->
    <div class="coming-soon-container">
        <div class="coming-soon-badge">COMING SOON</div>
        <h1 class="game-title">SURVIVE IT</h1>
        <p class="tagline">The Swarm is Assembling</p>

        <!-- Countdown -->
        <div class="countdown-wrapper">
            <div class="countdown-box">
                <span class="countdown-num" id="days">02</span>
                <span class="countdown-label">Days</span>
            </div>
            <div class="countdown-box">
                <span class="countdown-num" id="hours">14</span>
                <span class="countdown-label">Hours</span>
            </div>
            <div class="countdown-box">
                <span class="countdown-num" id="minutes">59</span>
                <span class="countdown-label">Mins</span>
            </div>
            <div class="countdown-box">
                <span class="countdown-num" id="seconds">42</span>
                <span class="countdown-label">Secs</span>
            </div>
        </div>

        <p class="sub-description">
            Prepare your shields and arm your pulse emitters. A tactical wave survival gameplay arena is currently undergoing database synchronization.
        </p>
    </div>

    <!-- Footer -->
    <footer>
        SURVIVE IT · POWERED BY <span>ATC STUDIO</span> ENGINE
    </footer>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Shifting grid background
        let offset = 0;
        const speed = 0.5;

        // Starfield particles
        const stars = [];
        const numStars = 60;
        for (let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                radius: Math.random() * 1.5 + 0.5,
                opacity: Math.random() * 0.7 + 0.3,
                speed: Math.random() * 0.2 + 0.1
            });
        }

        function drawBackground() {
            ctx.fillStyle = '#04040c';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw drifting stars
            ctx.fillStyle = '#fff';
            for (let star of stars) {
                star.y += star.speed;
                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
                ctx.save();
                ctx.globalAlpha = star.opacity;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // Draw cyber grid
            ctx.strokeStyle = 'rgba(255, 0, 127, 0.04)';
            ctx.lineWidth = 1;

            offset = (offset + speed) % 50;

            // Horizontal lines
            for (let y = offset; y < canvas.height; y += 50) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // Vertical lines
            for (let x = 0; x < canvas.width; x += 50) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
        }

        function animate() {
            drawBackground();
            requestAnimationFrame(animate);
        }
        animate();

        // Real Countdown Timer (Target: 3 days from now)
        const targetDate = new Date();
        targetDate.setDate(targetDate.getDate() + 3);
        targetDate.setHours(targetDate.getHours() + 4);

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate.getTime() - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = String(days).padStart(2, '0');
            document.getElementById('hours').innerText = String(hours).padStart(2, '0');
            document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
            document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');

            if (distance < 0) {
                clearInterval(countdownInterval);
                document.getElementById('days').innerText = "00";
                document.getElementById('hours').innerText = "00";
                document.getElementById('minutes').innerText = "00";
                document.getElementById('seconds').innerText = "00";
            }
        }

        updateCountdown();
        const countdownInterval = setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
