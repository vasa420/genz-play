<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VETRI ARCADE | Game Selection</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00FFFF;
            --secondary: #8A2BE2;
            --accent: #FFD700;
            --danger: #FF3E3E;
            --bg: #050510;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            color: white;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
        }

        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            opacity: 0.8;
            /* Increased opacity */
            filter: brightness(0.7);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.3) 0%, rgba(0, 0, 0, 0.9) 100%);
            z-index: -1;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeInDown 1s ease-out;
        }

        .logo-text {
            font-size: 12px;
            letter-spacing: 12px;
            color: var(--primary);
            font-weight: 900;
            margin-bottom: 10px;
            text-shadow: 0 0 20px var(--primary);
        }

        h1 {
            font-size: 48px;
            font-weight: 900;
            margin: 0;
            letter-spacing: 4px;
            background: linear-gradient(to right, #FFF, #AAA);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 40px;
            width: 100%;
            max-width: 1200px;
            padding-bottom: 100px;
        }

        .game-card {
            position: relative;
            height: 450px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            text-align: center;
            padding: 40px;
            box-sizing: border-box;
            backdrop-filter: blur(10px);
        }

        .game-card:hover {
            transform: translateY(-15px) scale(1.02);
            border-color: var(--primary);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 255, 255, 0.2);
        }

        .game-card.horror:hover {
            border-color: var(--danger);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 62, 62, 0.2);
        }

        .card-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            transition: transform 0.8s ease;
            background-size: cover;
            background-position: center;
            filter: brightness(0.6) grayscale(0.2);
        }

        .game-card:hover .card-bg {
            transform: scale(1.1);
            filter: brightness(0.8) grayscale(0);
        }

        .game-icon {
            font-size: 60px;
            margin-bottom: 20px;
            transition: transform 0.4s ease;
        }

        .game-card:hover .game-icon {
            transform: scale(1.2) rotate(5deg);
        }

        .game-title {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            margin: 0 0 10px;
        }

        .game-desc {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-launch {
            width: fit-content;
            padding: 12px 30px;
            background: white;
            color: black;
            border-radius: 30px;
            font-weight: 900;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .game-card:hover .btn-launch {
            background: var(--primary);
            box-shadow: 0 0 20px var(--primary);
        }

        .game-card.horror:hover .btn-launch {
            background: var(--danger);
            box-shadow: 0 0 20px var(--danger);
            color: white;
        }

        /* ATTACKS card styles */
        .game-card.attacks {
            border-color: rgba(255, 100, 0, 0.2);
        }

        .game-card.attacks:hover {
            border-color: #FF6400;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(255, 100, 0, 0.35);
        }

        .game-card.attacks:hover .btn-launch {
            background: linear-gradient(135deg, #FF6400, #FF2200);
            box-shadow: 0 0 25px rgba(255, 100, 0, 0.7);
            color: white;
        }

        /* SURVIVE IT card styles */
        .game-card.survive-it {
            border-color: rgba(255, 0, 127, 0.2);
        }

        .game-card.survive-it:hover {
            border-color: #FF007F;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(255, 0, 127, 0.35);
        }

        .game-card.survive-it:hover .btn-launch {
            background: linear-gradient(135deg, #FF007F, #7F00FF);
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.7);
            color: white;
        }

        .coming-soon-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #FF6400, #FF2200);
            color: white;
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 3px;
            padding: 6px 14px;
            border-radius: 20px;
            text-transform: uppercase;
            box-shadow: 0 0 16px rgba(255, 100, 0, 0.6);
            animation: pulseGlow 2s ease-in-out infinite;
        }

        @keyframes pulseGlow {

            0%,
            100% {
                box-shadow: 0 0 16px rgba(255, 100, 0, 0.6);
            }

            50% {
                box-shadow: 0 0 30px rgba(255, 100, 0, 1);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .game-card:nth-child(1) {
            animation: fadeInUp 0.8s ease-out 0.2s backwards;
        }

        .game-card:nth-child(2) {
            animation: fadeInUp 0.8s ease-out 0.3s backwards;
        }

        .game-card:nth-child(3) {
            animation: fadeInUp 0.8s ease-out 0.4s backwards;
        }

        .game-card:nth-child(4) {
            animation: fadeInUp 0.8s ease-out 0.5s backwards;
        }

        .game-card:nth-child(5) {
            animation: fadeInUp 0.8s ease-out 0.6s backwards;
        }

        .game-card:nth-child(6) {
            animation: fadeInUp 0.8s ease-out 0.7s backwards;
        }

        .game-card:nth-child(7) {
            animation: fadeInUp 0.8s ease-out 0.8s backwards;
        }

        .game-card:nth-child(8) {
            animation: fadeInUp 0.8s ease-out 0.9s backwards;
        }

        .game-card:nth-child(9) {
            animation: fadeInUp 0.8s ease-out 1.0s backwards;
        }

        /* Custom Scrollbar */
        .container::-webkit-scrollbar {
            width: 8px;
        }

        .container::-webkit-scrollbar-track {
            background: transparent;
        }

        .container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .container::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }
    </style>
</head>

<body>

    <video id="bg-video" autoplay muted loop playsinline>
        <source src="b_e_bd_c_f_c_mp_.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <div class="container">
        <header>
            <div class="logo-text">VETRI ARCADE SYSTEM</div>
            <h1>CHOOSE ANYTHING</h1>
        </header>

        <div class="game-grid">
            <!-- Horror -->
            <div class="game-card horror" onclick="location.href='horror_game.html'">
                <div class="card-bg" style="background-image: url('horror_intro.png')"></div>
                <div class="game-icon">📱</div>
                <h2 class="game-title">THE UNKNOWN</h2>
                <div class="btn-launch">START STORY</div>
            </div>

            <!-- Chess -->
            <div class="game-card" onclick="location.href='chess_login.html'">
                <div class="card-bg" style="background-image: url('media__1776592780529.png')"></div>
                <div class="game-icon">♟️</div>
                <h2 class="game-title">GRANDMASTER CHESS</h2>
                <div class="btn-launch">PLAY CHESS</div>
            </div>

            <!-- Hand Cricket -->
            <div class="game-card" onclick="location.href='hand_cricket_login.html'">
                <div class="card-bg" style="background-image: url('cricket_stadium_bg.png')"></div>
                <div class="game-icon">🏏</div>
                <h2 class="game-title">HAND CRICKET PRO</h2>
                <div class="btn-launch">PLAY MATCH</div>
            </div>


            <!-- No Exit -->
            <div class="game-card horror" onclick="location.href='no_exit.html'">
                <div class="card-bg" style="background-image: url('no_exit_bg.png')"></div>
                <div
                    style="font-family: 'Outfit', sans-serif; font-size: 24px; font-weight: 900; letter-spacing: 2px; color: #ff3b30; text-shadow: 0 0 10px rgba(255, 59, 48, 0.4); margin-bottom: 15px; font-style: italic;">
                    PROJECT SILENCE</div>
                <div class="game-icon">🚪</div>
                <h2 class="game-title">NO EXIT</h2>
                <div class="btn-launch" style="background-color: #ff3b30; color: #fff;">ENTER LOOP</div>
                <div
                    style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 4px; color: #888; margin-top: 15px; text-transform: uppercase;">
                    LEAVE THE DARKNESS</div>
            </div>


            <!-- ATTACKS -->
            <div class="game-card attacks" onclick="location.href='attacks_intro.html'">
                <div class="card-bg"
                    style="background-image: url('squad_photo.jpg'); background-size: contain; background-position: center center; background-repeat: no-repeat; background-color: #0a0a15; filter: brightness(0.75);">
                </div>
                <div class="coming-soon-badge" style="background: linear-gradient(135deg, #00FF66, #009933);">🔥 LIVE</div>
                <h2 class="game-title"
                    style="font-size: 32px; letter-spacing: 4px; background: linear-gradient(135deg, #FF6400, #FFD700); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">
                    ATTACKS</h2>
                <div class="btn-launch"
                    style="background: linear-gradient(135deg,#FF6400,#FF2200); color: #fff; letter-spacing: 3px; opacity: 1; cursor: pointer;">
                    LAUNCH GAME</div>
                <div
                    style="font-family: 'Outfit', monospace; font-size: 10px; letter-spacing: 4px; color: rgba(255,200,100,0.8); margin-top: 14px; text-transform: uppercase;">
                    PREPARE FOR BATTLE</div>
            </div>
        </div>
    </div>

    <script>
        window.onload = function () {
            const video = document.getElementById('bg-video');
            if (video) {
                video.play().catch(e => {
                    console.warn("Autoplay blocked, waiting for interaction.");
                });
            }
        };

        // Start sound and enter fullscreen on first user interaction
        function handleInteraction() {
            const video = document.getElementById('bg-video');
            if (video) {
                video.muted = false;
            }

            const doc = window.document;
            const docEl = doc.documentElement;
            const requestFS = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
            if (requestFS && !doc.fullscreenElement) {
                requestFS.call(docEl).catch(e => console.warn("Fullscreen request failed:", e));
            }
        }

        ['click', 'keydown', 'touchstart', 'mousedown'].forEach(evt => {
            document.body.addEventListener(evt, handleInteraction, { once: true });
        });
    </script>
</body>

</html>
