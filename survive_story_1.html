<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SURVIVE IT | WARNING</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --warning-glow: rgba(255, 255, 255, 0.3);
            --primary: #39ff14;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        html, body {
            background: #020205;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            width: 100%; height: 100%;
            overflow: hidden;
        }

        /* Scanlines Overlay */
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0.2), rgba(0,0,0,0.2) 1.5px,
                transparent 1.5px, transparent 3px
            );
            pointer-events: none; z-index: 9999; opacity: 0.85;
        }

        /* CRT Screen Glow */
        .crt-glow {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 60%, rgba(255, 255, 255, 0.02) 100%);
            pointer-events: none; z-index: 9998;
        }

        /* CRT Container */
        .crt-container {
            width: 100%; height: 100%;
            position: fixed; top: 0; left: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            transform-origin: center center;
        }

        .crt-collapse {
            animation: crtCollapseEffect 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }
        .crt-expand {
            animation: crtExpandEffect 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        @keyframes crtCollapseEffect {
            0%   { transform: scaleY(1) scaleX(1);    filter: brightness(1); }
            40%  { transform: scaleY(0.01) scaleX(1.1); filter: brightness(3); }
            80%  { transform: scaleY(0.01) scaleX(0.02); filter: brightness(6); }
            100% { transform: scaleY(0) scaleX(0);    filter: brightness(10); opacity: 0; }
        }
        @keyframes crtExpandEffect {
            0%   { transform: scaleY(0) scaleX(0);    filter: brightness(10); opacity: 0; }
            40%  { transform: scaleY(0.01) scaleX(1.1); filter: brightness(5); opacity: 1; }
            80%  { transform: scaleY(1) scaleX(1.02); filter: brightness(1.5); }
            100% { transform: scaleY(1) scaleX(1);    filter: brightness(1); opacity: 1; }
        }

        /* Content layout */
        .story-box {
            text-align: center;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 40px;
            align-items: center;
        }

        .warning-icon {
            font-size: clamp(40px, 8vw, 64px);
            color: #ff3333;
            text-shadow: 0 0 20px rgba(255, 51, 51, 0.6);
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.05); opacity: 1; }
        }

        .story-text {
            color: #ffffff;
            font-size: clamp(18px, 3vw, 28px);
            font-weight: 700;
            line-height: 1.6;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--warning-glow);
            word-wrap: break-word;
            text-transform: uppercase;
            white-space: pre-wrap;
        }

        .cursor {
            display: inline-block;
            width: 12px; height: 1.1em;
            background: #ffffff;
            margin-left: 4px;
            animation: blink 0.8s infinite steps(2);
            vertical-align: middle;
            box-shadow: 0 0 8px var(--warning-glow);
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

        /* Skip / Next Hint */
        .hint {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            letter-spacing: 4px;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            animation: pulseHint 2s ease-in-out infinite;
            white-space: nowrap;
        }
        @keyframes pulseHint {
            0%,100% { opacity: 0.3; }
            50%      { opacity: 0.7; }
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>
    <div class="crt-glow"></div>

    <div class="crt-container crt-expand" id="screen-container">
        <div class="story-box">
            <div class="warning-icon">⚠</div>
            <div class="story-text">
                <span id="type-text"></span><span class="cursor" id="text-cursor"></span>
            </div>
        </div>
        <div class="hint" id="hint-text">PRESS Q OR CLICK TO SKIP ▶</div>
    </div>

    <script>
        // ── Audio Engine ──────────────────────────────────────
        let audioCtx = null;
        const masterVolume = 0.06;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playBeep(type) {
            initAudio();
            if (!audioCtx) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc  = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                if (type === 'typewriter') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(160 + Math.random() * 80, audioCtx.currentTime);
                    gain.gain.setValueAtTime(masterVolume * 0.4, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.035);
                } else if (type === 'transition') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(60, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 0.5);
                    gain.gain.setValueAtTime(masterVolume, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.55);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.6);
                }
            } catch(e) { console.warn(e); }
        }

        // ── Flow Control ──────────────────────────────────────
        const textToType = "THIS STORY BASED ON REAL INSIDENT IN USA!";
        const screenContainer = document.getElementById('screen-container');
        const typeSpan = document.getElementById('type-text');
        const hintEl = document.getElementById('hint-text');
        let typingFinished = false;
        let skipLocked = false;
        let autoTimeout = null;

        function startNextPage() {
            if (skipLocked) return;
            skipLocked = true;
            if (autoTimeout) clearTimeout(autoTimeout);
            
            // Trigger transition to Page 2
            playBeep('transition');
            screenContainer.classList.remove('crt-expand');
            screenContainer.classList.add('crt-collapse');
            setTimeout(() => {
                location.href = 'survive_story_2.html';
            }, 620);
        }

        // Input handler for Q key or Click
        function handleContinue() {
            if (skipLocked) return;
            if (!typingFinished) {
                // Skip typing
                typingFinished = true;
                typeSpan.innerText = textToType;
                document.getElementById('text-cursor').style.display = 'none';
                hintEl.innerText = "PRESS Q OR CLICK TO CONTINUE ▶";
                
                // Start 5 second timer to next page
                if (autoTimeout) clearTimeout(autoTimeout);
                autoTimeout = setTimeout(startNextPage, 5000);
            } else {
                // Skip the 5 second wait and go immediately
                startNextPage();
            }
        }

        document.addEventListener('click', handleContinue);

        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'q') {
                handleContinue();
            }
        });

        // Typewriter implementation
        function runTypewriter() {
            let i = 0;
            function type() {
                if (typingFinished) return; // already skipped
                if (i < textToType.length) {
                    typeSpan.innerText += textToType.charAt(i);
                    playBeep('typewriter');
                    i++;
                    setTimeout(type, 70);
                } else {
                    typingFinished = true;
                    document.getElementById('text-cursor').style.display = 'none';
                    hintEl.innerText = "PRESS Q OR CLICK TO CONTINUE ▶";
                    
                    // Stay 5 seconds and automatically proceed
                    autoTimeout = setTimeout(startNextPage, 5000);
                }
            }
            type();
        }

        window.onload = function() {
            setTimeout(runTypewriter, 500);
        };
    </script>
</body>
</html>
