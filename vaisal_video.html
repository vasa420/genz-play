<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ATTACKS | Video Record - VAISAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6400;
            --primary-glow: rgba(255, 100, 0, 0.45);
            --green: #00FF88;
            --green-glow: rgba(0, 255, 136, 0.35);
            --red: #FF2244;
            --red-glow: rgba(255, 34, 68, 0.35);
            --gold: #FFD700;
            --gold-glow: rgba(255, 215, 0, 0.35);
            --bg: #04040c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Scanline overlay */
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.14), rgba(0,0,0,0.14) 1.5px, transparent 1.5px, transparent 3px);
            pointer-events: none; z-index: 9999; opacity: 0.7;
        }

        /* Ambient particles bg */
        #particle-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 2;
        }

        /* Main Viewport Container */
        .fullscreen-viewport {
            position: relative;
            z-index: 5;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            box-sizing: border-box;
            width: 100%;
            height: 100vh;
        }

        /* Header Information Grid */
        .floating-header {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 15;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(4, 4, 12, 0.65);
            padding: 10px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 100, 0, 0.25);
            backdrop-filter: blur(14px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            animation: slideDown 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideDown {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @media (max-width: 640px) {
            .floating-header {
                top: 15px; left: 15px; right: 70px;
                padding: 8px 12px;
            }
        }

        .info-block {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .info-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 8px;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
        }

        .info-value {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .info-value.name {
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary-glow);
        }

        .info-value.status {
            color: var(--gold);
            text-shadow: 0 0 10px var(--gold-glow);
        }

        .video-tag-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(255, 100, 0, 0.15);
            border: 1px solid rgba(255, 100, 0, 0.35);
            color: var(--primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            letter-spacing: 1.5px;
            padding: 2px 7px;
            border-radius: 4px;
            width: fit-content;
        }

        /* Floating Cross / Return Button */
        .btn-close {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 100, 0, 0.1);
            border: 1.5px solid rgba(255, 100, 0, 0.35);
            color: var(--primary);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 20;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        @media (max-width: 640px) {
            .btn-close { top: 20px; right: 20px; }
        }

        .btn-close:hover {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
            transform: rotate(90deg) scale(1.05);
        }

        /* Centered Video Player Frame */
        .video-frame {
            position: relative;
            max-height: 75vh;
            max-width: 90vw;
            width: 800px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            border: 2px solid rgba(255, 100, 0, 0.35);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(255, 100, 0, 0.2);
            background: #000;
            overflow: hidden;
            z-index: 10;
            animation: zoomIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes zoomIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .video-frame video {
            max-height: 75vh;
            width: 100%;
            display: block;
            object-fit: contain;
            outline: none;
        }

        /* Scanning overlay effect */
        .scanner-beam {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            box-shadow: 0 0 10px var(--primary);
            animation: scan 4s linear infinite;
            z-index: 12;
            pointer-events: none;
            opacity: 0.5;
        }

        @keyframes scan {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }

        /* Floating Download Button */
        .floating-download {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 15;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @media (max-width: 640px) {
            .floating-download {
                bottom: 20px; right: 20px; left: 20px;
                display: flex; justify-content: center;
            }
            .btn-download { width: 100%; justify-content: center; }
        }

        .btn-download {
            background: rgba(4, 4, 12, 0.6);
            border: 1.5px solid var(--primary);
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 2px;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            backdrop-filter: blur(12px);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .btn-download:hover {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>

    <!-- Background particles -->
    <canvas id="particle-bg"></canvas>

    <!-- Main Viewport -->
    <main class="fullscreen-viewport">

        <!-- Close / Return -->
        <button class="btn-close" id="btn-return" onclick="goBack()" title="Return to Analyzer">✕</button>

        <!-- Stats overlay -->
        <header class="floating-header">
            <div class="video-tag-badge">📹 VIDEO RECORDING LOG</div>
            <div class="info-block">
                <span class="info-label">DATABASE RECORD NAME</span>
                <h1 class="info-value name">VAISAL</h1>
            </div>
            <div class="info-block">
                <span class="info-label">ACTIVE THREAT STATUS</span>
                <div class="info-value status">BOY DRIVING THE BUS 🚌 (VIDEO LOG)</div>
            </div>
        </header>

        <!-- Main Video Frame -->
        <div class="video-frame">
            <div class="scanner-beam"></div>
            <video src="vaisal_video.mp4" controls autoplay loop playsinline></video>
        </div>

        <!-- Download Badge -->
        <div class="floating-download">
            <a class="btn-download" id="btn-download-vid" href="vaisal_video.mp4" download="vaisal_video_log.mp4">
                <span>⬇</span> DOWNLOAD VIDEO LOG
            </a>
        </div>

    </main>

    <script>
        // Smooth return transition
        function goBack() {
            const dimmer = document.createElement('div');
            dimmer.style.cssText = `
                position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                background: #000; z-index: 99999; opacity: 0;
                transition: opacity 0.8s ease;
            `;
            document.body.appendChild(dimmer);
            requestAnimationFrame(() => requestAnimationFrame(() => {
                dimmer.style.opacity = '1';
                setTimeout(() => { window.location.href = 'attacks_game.html'; }, 900);
            }));
        }

        // Particle canvas background
        (function() {
            const canvas = document.getElementById('particle-bg');
            const ctx = canvas.getContext('2d');
            let W, H, particles = [];

            function resize() {
                W = canvas.width  = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }

            resize();
            window.addEventListener('resize', resize);

            for (let i = 0; i < 55; i++) {
                particles.push({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight,
                    r: Math.random() * 1.4 + 0.4,
                    vx: (Math.random() - 0.5) * 0.35,
                    vy: (Math.random() - 0.5) * 0.35,
                    alpha: Math.random() * 0.35 + 0.1
                });
            }

            function draw() {
                ctx.clearRect(0, 0, W, H);
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.x < 0 || p.x > W) p.vx *= -1;
                    if (p.y < 0 || p.y > H) p.vy *= -1;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,100,0,${p.alpha})`;
                    ctx.fill();
                });
                requestAnimationFrame(draw);
            }
            draw();
        })();

        // Fade in entrance effect
        document.body.style.opacity = '0';
        document.body.style.transition = 'opacity 0.8s ease';
        window.addEventListener('load', () => {
            requestAnimationFrame(() => { document.body.style.opacity = '1'; });
        });
    </script>
</body>
</html>
