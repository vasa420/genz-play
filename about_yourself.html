<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ATTACKS | About Yourself</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6400;
            --primary-glow: rgba(255, 100, 0, 0.45);
            --green: #00FF88;
            --gold: #FFD700;
            --gold-glow: rgba(255, 215, 0, 0.35);
            --bg: #04040c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Scanlines overlay */
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.14), rgba(0,0,0,0.14) 1.5px, transparent 1.5px, transparent 3px);
            pointer-events: none; z-index: 9999; opacity: 0.7;
        }

        /* Ambient particles bg */
        #particle-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }

        /* Header */
        .header {
            width: 100%; padding: 22px 30px 18px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid rgba(255, 100, 0, 0.12);
            background: rgba(4,4,12,0.9);
            backdrop-filter: blur(12px);
            position: sticky; top: 0; z-index: 100;
        }

        .header-logo {
            font-family: 'JetBrains Mono', monospace;
            font-size: 20px; font-weight: 900; letter-spacing: 6px;
            color: var(--primary);
            text-shadow: 0 0 12px var(--primary-glow);
        }

        .header-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px; letter-spacing: 3px; color: #555;
            text-transform: uppercase;
        }

        .btn-back {
            background: transparent;
            border: 1px solid rgba(255,100,0,0.3);
            color: rgba(255,100,0,0.7);
            padding: 8px 18px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px; letter-spacing: 2px;
            border-radius: 6px; cursor: pointer;
            transition: 0.25s;
        }

        .btn-back:hover {
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        /* Main Container */
        .main-container {
            width: 100%; max-width: 720px;
            padding: 50px 20px 80px;
            position: relative; z-index: 1;
            display: flex; flex-direction: column; align-items: center;
        }

        /* Form Card */
        .card {
            width: 100%; background: rgba(10, 10, 24, 0.75);
            border: 1.5px solid rgba(255, 100, 0, 0.3);
            border-radius: 18px; padding: 35px 30px;
            backdrop-filter: blur(14px);
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.6);
            margin-bottom: 30px; text-align: center;
        }

        .card-icon {
            font-size: 38px; color: var(--primary);
            text-shadow: 0 0 15px var(--primary-glow); margin-bottom: 10px;
        }

        .card-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 22px; font-weight: 900; letter-spacing: 4px;
            color: var(--primary); margin-bottom: 6px;
            text-transform: uppercase;
        }

        .card-sub {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px; color: rgba(255,255,255,0.45);
            letter-spacing: 2px; margin-bottom: 30px;
        }

        .form-group {
            display: flex; flex-direction: column; gap: 8px;
            margin-bottom: 20px; text-align: left;
        }

        .form-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px; letter-spacing: 2px; color: rgba(255,255,255,0.5);
            text-transform: uppercase;
        }

        .text-input {
            width: 100%; padding: 14px 18px;
            background: rgba(4, 4, 12, 0.8);
            border: 1.5px solid rgba(255, 100, 0, 0.35);
            border-radius: 10px; color: #fff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 15px; letter-spacing: 2px;
            outline: none; transition: all 0.3s ease;
        }

        .text-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .btn-analyze {
            width: 100%; padding: 16px; margin-top: 10px;
            background: linear-gradient(135deg, #FF6400, #FF9D00);
            border: none; border-radius: 12px;
            color: #000; font-family: 'JetBrains Mono', monospace;
            font-size: 14px; font-weight: 900; letter-spacing: 3px;
            cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .btn-analyze:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px var(--primary);
        }

        /* Profile Result Card */
        .result-panel {
            width: 100%; display: none;
            flex-direction: column; align-items: center; gap: 20px;
            animation: fadeIn 0.6s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-card {
            width: 100%; background: rgba(10, 10, 24, 0.85);
            border: 1.5px solid rgba(255, 100, 0, 0.4);
            border-radius: 16px; padding: 30px;
            backdrop-filter: blur(12px); box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        .user-name {
            font-family: 'JetBrains Mono', monospace;
            font-size: 28px; font-weight: 900; letter-spacing: 4px;
            color: var(--gold); text-shadow: 0 0 15px rgba(255,215,0,0.4);
            margin-bottom: 4px; text-transform: uppercase; text-align: center;
        }

        .user-title-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px; letter-spacing: 2px; color: var(--green);
            text-align: center; margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(0,255,136,0.3);
        }

        .stat-group { margin-bottom: 16px; }

        .stat-label {
            display: flex; justify-content: space-between;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px; letter-spacing: 2px; color: rgba(255,255,255,0.6);
            margin-bottom: 6px;
        }

        .stat-bar-track {
            height: 8px; background: rgba(255,255,255,0.06);
            border-radius: 6px; overflow: hidden; border: 1px solid rgba(255,100,0,0.2);
        }

        .stat-bar-fill {
            height: 100%; border-radius: 6px;
            background: linear-gradient(90deg, #FF6400, #FFD700);
            box-shadow: 0 0 10px var(--primary-glow);
            transition: width 0.8s ease;
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>
    <canvas id="particle-bg"></canvas>

    <header class="header">
        <div>
            <div class="header-logo">ATTACKS</div>
            <div class="header-tag">ABOUT YOURSELF v1.0</div>
        </div>
        <button class="btn-back" onclick="goBack()">← SEARCH ENGINE</button>
    </header>

    <main class="main-container">
        
        <div class="card">
            <div class="card-icon">👤</div>
            <h1 class="card-title">ABOUT YOURSELF</h1>
            <p class="card-sub">ENTER YOUR OPERATIVE PROFILE & GENERATE YOUR AI CYBER IDENTITY</p>

            <div class="form-group">
                <label class="form-label" for="user-name-input">YOUR OPERATIVE NAME</label>
                <input type="text" id="user-name-input" class="text-input" placeholder="ENTER YOUR NAME..." autocomplete="off">
            </div>

            <div class="form-group">
                <label class="form-label" for="user-role-input">YOUR SPECIAL ROLE / CLASS</label>
                <input type="text" id="user-role-input" class="text-input" placeholder="e.g. CYBER DRIVER, BLADE MASTER..." autocomplete="off">
            </div>

            <button class="btn-analyze" onclick="generateProfile()">GENERATE MY CYBER IDENTITY</button>
        </div>

        <div class="result-panel" id="result-panel">
            <div class="result-card">
                <div class="user-name" id="res-user-name">OPERATIVE</div>
                <div class="user-title-badge" id="res-user-role">SQUAD CLASS: CYBER LEADER</div>

                <div class="stat-group">
                    <div class="stat-label"><span>COMBAT POTENTIAL</span><span id="st-comb">96%</span></div>
                    <div class="stat-bar-track"><div class="stat-bar-fill" id="st-comb-fill" style="width: 96%;"></div></div>
                </div>

                <div class="stat-group">
                    <div class="stat-label"><span>TACTICAL REFLEXES</span><span id="st-refl">94%</span></div>
                    <div class="stat-bar-track"><div class="stat-bar-fill" id="st-refl-fill" style="width: 94%;"></div></div>
                </div>

                <div class="stat-group">
                    <div class="stat-label"><span>INTELLIGENCE & SPECTRUM</span><span id="st-intel">98%</span></div>
                    <div class="stat-bar-track"><div class="stat-bar-fill" id="st-intel-fill" style="width: 98%;"></div></div>
                </div>

                <div class="stat-group">
                    <div class="stat-label"><span>SQUAD LEADER SYNERGY</span><span id="st-syn">97%</span></div>
                    <div class="stat-bar-track"><div class="stat-bar-fill" id="st-syn-fill" style="width: 97%;"></div></div>
                </div>
            </div>
        </div>

    </main>

    <script>
        function goBack() {
            const dimmer = document.createElement('div');
            dimmer.style.cssText = `
                position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                background: #000; z-index: 99999; opacity: 0;
                transition: opacity 0.8s ease;
            `;
            document.body.appendChild(dimmer);
            requestAnimationFrame(() => requestAnimationFrame(() => {
                dimmer.style.opacity = '1';
                setTimeout(() => { window.location.href = 'attacks_game.html'; }, 900);
            }));
        }

        function generateProfile() {
            const nameInput = document.getElementById('user-name-input').value.trim();
            const roleInput = document.getElementById('user-role-input').value.trim();

            const name = nameInput || 'OPERATIVE USER';
            const role = roleInput || 'CYBER SQUAD LEADER';

            document.getElementById('res-user-name').textContent = name;
            document.getElementById('res-user-role').textContent = `CLASS: ${role.toUpperCase()}`;

            // Generate fun high stats
            const c = 92 + Math.floor(Math.random() * 7);
            const r = 90 + Math.floor(Math.random() * 8);
            const i = 94 + Math.floor(Math.random() * 6);
            const s = 93 + Math.floor(Math.random() * 7);

            document.getElementById('st-comb').textContent = c + '%';
            document.getElementById('st-comb-fill').style.width = c + '%';

            document.getElementById('st-refl').textContent = r + '%';
            document.getElementById('st-refl-fill').style.width = r + '%';

            document.getElementById('st-intel').textContent = i + '%';
            document.getElementById('st-intel-fill').style.width = i + '%';

            document.getElementById('st-syn').textContent = s + '%';
            document.getElementById('st-syn-fill').style.width = s + '%';

            document.getElementById('result-panel').style.display = 'flex';
        }

        // Particle canvas background
        (function() {
            const canvas = document.getElementById('particle-bg');
            const ctx = canvas.getContext('2d');
            let W, H, particles = [];

            function resize() {
                W = canvas.width  = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }

            resize();
            window.addEventListener('resize', resize);

            for (let i = 0; i < 45; i++) {
                particles.push({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight,
                    r: Math.random() * 1.3 + 0.3,
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.3,
                    alpha: Math.random() * 0.3 + 0.08
                });
            }

            function draw() {
                ctx.clearRect(0, 0, W, H);
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.x < 0 || p.x > W) p.vx *= -1;
                    if (p.y < 0 || p.y > H) p.vy *= -1;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,100,0,${p.alpha})`;
                    ctx.fill();
                });
                requestAnimationFrame(draw);
            }
            draw();
        })();
    </script>
</body>
</html>
