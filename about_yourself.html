<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ATTACKS | About Yourself</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6400;
            --primary-glow: rgba(255, 100, 0, 0.45);
            --green: #00FF88;
            --green-glow: rgba(0, 255, 136, 0.35);
            --gold: #FFD700;
            --gold-glow: rgba(255, 215, 0, 0.35);
            --red: #FF2244;
            --bg: #04040c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Scanlines overlay */
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.14), rgba(0,0,0,0.14) 1.5px, transparent 1.5px, transparent 3px);
            pointer-events: none; z-index: 9999; opacity: 0.7;
        }

        /* Ambient particles bg */
        #particle-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }

        /* Header */
        .header {
            width: 100%; padding: 18px 30px 16px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid rgba(255, 100, 0, 0.12);
            background: rgba(4,4,12,0.9);
            backdrop-filter: blur(12px);
            position: sticky; top: 0; z-index: 100;
        }

        .header-logo {
            font-family: 'JetBrains Mono', monospace;
            font-size: 20px; font-weight: 900; letter-spacing: 6px;
            color: var(--primary);
            text-shadow: 0 0 12px var(--primary-glow);
        }

        .header-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px; letter-spacing: 3px; color: #555;
            text-transform: uppercase;
        }

        .btn-back {
            background: transparent;
            border: 1px solid rgba(255,100,0,0.3);
            color: rgba(255,100,0,0.7);
            padding: 8px 18px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px; letter-spacing: 2px;
            border-radius: 6px; cursor: pointer;
            transition: 0.25s;
        }

        .btn-back:hover {
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        /* Main Container */
        .main-container {
            width: 100%; max-width: 680px;
            padding: 40px 20px 80px;
            position: relative; z-index: 1;
            display: flex; flex-direction: column; align-items: center;
        }

        /* Form Card */
        .card {
            position: relative;
            width: 100%; background: rgba(10, 10, 24, 0.75);
            border: 1.5px solid rgba(255, 100, 0, 0.3);
            border-radius: 18px; padding: 35px 30px;
            backdrop-filter: blur(14px);
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.6);
            margin-bottom: 30px; text-align: center;
        }

        /* Language Selector Box - Positioned inside top right upside */
        .lang-select-box {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(255, 100, 0, 0.12);
            border: 1.5px solid rgba(255, 100, 0, 0.4);
            padding: 5px 10px; border-radius: 8px;
            box-shadow: 0 0 12px rgba(255, 100, 0, 0.15);
            transition: all 0.3s ease;
        }

        .card-lang-pos {
            position: absolute; top: 18px; right: 18px; z-index: 10;
        }

        @media (max-width: 480px) {
            .card-lang-pos {
                position: static; margin: 0 auto 15px auto; width: fit-content;
            }
        }

        .lang-select-box:hover {
            border-color: var(--primary);
            box-shadow: 0 0 18px var(--primary-glow);
        }

        .lang-select-box label { font-size: 12px; }

        .lang-select-dropdown {
            background: transparent; border: none; color: #fff;
            font-family: 'JetBrains Mono', monospace; font-size: 11px;
            letter-spacing: 1px; outline: none; cursor: pointer;
            font-weight: 700;
        }

        .lang-select-dropdown option {
            background: #0b0b14; color: #fff; padding: 6px;
        }

        .card-icon {
            font-size: 38px; color: var(--primary);
            text-shadow: 0 0 15px var(--primary-glow); margin-bottom: 10px;
        }

        .card-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 22px; font-weight: 900; letter-spacing: 4px;
            color: var(--primary); margin-bottom: 6px;
            text-transform: uppercase;
        }

        .card-sub {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px; color: rgba(255,255,255,0.45);
            letter-spacing: 2px; margin-bottom: 25px;
        }

        .form-group {
            display: flex; flex-direction: column; gap: 8px;
            margin-bottom: 24px; text-align: left;
        }

        .form-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px; letter-spacing: 2px; color: rgba(255,255,255,0.5);
            text-transform: uppercase;
        }

        .select-input {
            width: 100%; padding: 14px 18px;
            background: rgba(4, 4, 12, 0.85);
            border: 1.5px solid rgba(255, 100, 0, 0.35);
            border-radius: 10px; color: #fff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 15px; letter-spacing: 2px;
            outline: none; transition: all 0.3s ease;
        }

        .select-input option {
            background: #0b0b14; color: #fff;
        }

        .select-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .btn-analyze {
            width: 100%; padding: 16px; margin-top: 10px;
            background: linear-gradient(135deg, #FF6400, #FF9D00);
            border: none; border-radius: 12px;
            color: #000; font-family: 'JetBrains Mono', monospace;
            font-size: 14px; font-weight: 900; letter-spacing: 3px;
            cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .btn-analyze:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px var(--primary);
        }

        /* Cyber Loader */
        .loader-block {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 10px;
            text-align: center;
            width: 100%;
        }

        .loader-circle {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(255, 100, 0, 0.15);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(255, 100, 0, 0.2);
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .loader-txt {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px; letter-spacing: 2px; color: var(--primary);
            margin-bottom: 12px;
        }

        .loader-bar-bg {
            width: 100%; height: 4px; background: rgba(255, 255, 255, 0.05);
            border-radius: 2px; overflow: hidden;
        }

        .loader-bar-fill {
            width: 0%; height: 100%; background: var(--primary);
            box-shadow: 0 0 10px var(--primary); transition: width 0.3s ease;
        }

        /* Profile Result & Story Card */
        .result-panel {
            width: 100%; display: none;
            flex-direction: column; align-items: center; gap: 24px;
            animation: fadeIn 0.6s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-card {
            position: relative;
            width: 100%; background: rgba(10, 10, 24, 0.85);
            border: 1.5px solid rgba(255, 100, 0, 0.4);
            border-radius: 18px; padding: 30px;
            backdrop-filter: blur(12px); box-shadow: 0 0 35px rgba(0,0,0,0.8);
        }

        .user-name {
            font-family: 'JetBrains Mono', monospace;
            font-size: 28px; font-weight: 900; letter-spacing: 4px;
            color: var(--gold); text-shadow: 0 0 15px rgba(255,215,0,0.4);
            margin-bottom: 6px; text-transform: uppercase; text-align: center;
        }

        .user-title-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px; letter-spacing: 2px; color: var(--green);
            text-align: center; margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(0,255,136,0.3);
        }

        /* Typing Story Box at Down Side */
        .story-container {
            width: 100%; margin-top: 20px;
            background: rgba(4, 4, 12, 0.9);
            border: 1.5px solid rgba(255, 100, 0, 0.35);
            border-radius: 14px; padding: 22px;
            box-shadow: 0 0 20px rgba(255, 100, 0, 0.15);
        }

        .story-header {
            display: flex; align-items: center; justify-content: space-between;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px; letter-spacing: 2px; color: var(--primary);
            margin-bottom: 14px; border-bottom: 1px dashed rgba(255,100,0,0.25);
            padding-bottom: 10px; flex-wrap: wrap; gap: 10px;
        }

        .story-body {
            font-family: 'Outfit', 'JetBrains Mono', sans-serif;
            font-size: 14px; line-height: 1.8; color: #fff;
            letter-spacing: 0.5px; white-space: pre-line;
            min-height: 120px;
        }

        .typing-cursor {
            display: inline-block; width: 8px; height: 16px;
            background: var(--primary); margin-left: 3px;
            animation: blink 0.7s infinite; vertical-align: middle;
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .btn-retry {
            width: 100%; background: transparent; border: 1.5px solid var(--primary);
            color: var(--primary); padding: 14px; font-family: 'JetBrains Mono', monospace;
            font-size: 12px; font-weight: 700; letter-spacing: 3px; border-radius: 10px;
            cursor: pointer; transition: all 0.3s ease; margin-top: 20px;
        }

        .btn-retry:hover { background: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary-glow); }
    </style>
</head>
<body>

    <div class="scanlines"></div>
    <canvas id="particle-bg"></canvas>

    <header class="header">
        <div>
            <div class="header-logo">ATTACKS</div>
            <div class="header-tag">ABOUT YOURSELF v1.0</div>
        </div>

        <button class="btn-back" onclick="goBack()">← SEARCH ENGINE</button>
    </header>

    <main class="main-container">
        
        <!-- Input Card (Only Name Asked) -->
        <div class="card" id="form-card">
            <!-- Language Selector Shifted Inside Card Right Side Corner Upside -->
            <div class="lang-select-box card-lang-pos" title="Select Language">
                <label for="lang-select">🌐</label>
                <select id="lang-select" class="lang-select-dropdown" onchange="handleLanguageChange(this.value)">
                    <option value="en" selected>ENGLISH 🇬🇧</option>
                    <option value="ta">தமிழ் (TAMIL) 🇮🇳</option>
                    <option value="hi">हिंदी (HINDI) 🇮🇳</option>
                </select>
            </div>

            <div class="card-icon">👤</div>
            <h1 class="card-title">ABOUT YOURSELF</h1>
            <p class="card-sub">SELECT YOUR OPERATIVE NAME & GENERATE YOUR FUNNY AI STORY</p>

            <div class="form-group">
                <label class="form-label" for="user-name-select">SELECT OPERATIVE NAME</label>
                <select id="user-name-select" class="select-input">
                    <option value="VAISAL" selected>VAISAL</option>
                    <option value="NITHISH">NITHISH</option>
                    <option value="GIRISH">GIRISH</option>
                    <option value="DHARNISH">DHARNISH</option>
                    <option value="THAYA">THAYA</option>
                    <option value="SUDHISH">SUDHISH</option>
                    <option value="SURYA">SURYA</option>
                    <option value="KISHOOR">KISHOOR</option>
                    <option value="VASANTH">VASANTH</option>
                    <option value="LOGITH">LOGITH</option>
                </select>
            </div>

            <button class="btn-analyze" onclick="startStoryGeneration()">RUN AI STORY GENERATOR</button>
        </div>

        <!-- Cyber Loader -->
        <div class="loader-block" id="loader-block">
            <div class="loader-circle"></div>
            <div class="loader-txt" id="loader-txt">BOOTING AI STORY GENERATOR...</div>
            <div class="loader-bar-bg">
                <div class="loader-bar-fill" id="loader-bar"></div>
            </div>
        </div>

        <!-- Profile Result & AI Story Card (Typed at down side) -->
        <div class="result-panel" id="result-panel">
            <div class="result-card">
                <div class="user-name" id="res-user-name">VAISAL</div>
                <div class="user-title-badge" id="res-user-role">OPERATIVE THREAT PROFILE DETECTED</div>

                <!-- Story box typed at the down side -->
                <div class="story-container">
                    <div class="story-header">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <span>🤖 AI GENERATED STORY LORE</span>
                        </div>
                        
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <!-- Language Selector inside Story Box Top Right Corner Upside -->
                            <div class="lang-select-box" style="padding: 3px 8px;" title="Switch Language">
                                <label for="lang-select-story">🌐</label>
                                <select id="lang-select-story" class="lang-select-dropdown" onchange="handleLanguageChange(this.value)">
                                    <option value="en">ENGLISH 🇬🇧</option>
                                    <option value="ta">தமிழ் (TAMIL) 🇮🇳</option>
                                    <option value="hi">हिंदी (HINDI) 🇮🇳</option>
                                </select>
                            </div>
                            <span id="typing-status" style="color: var(--primary); font-size: 10px;">TYPING STORY...</span>
                        </div>
                    </div>
                    <div class="story-body" id="story-body"></div>
                </div>

                <button class="btn-retry" onclick="resetPage()">GENERATE ANOTHER STORY</button>
            </div>
        </div>

    </main>

    <script>

                transition: opacity 0.8s ease;
            `;
            document.body.appendChild(dimmer);
            requestAnimationFrame(() => requestAnimationFrame(() => {
                dimmer.style.opacity = '1';
                setTimeout(() => { window.location.href = 'attacks_game.html'; }, 900);
            }));

        let currentActiveName = 'VAISAL';
        let currentLang = 'en';
        let typingInterval = null;

        function handleLanguageChange(newLang) {
            currentLang = newLang;
            // Sync both language select elements
            const sel1 = document.getElementById('lang-select');
            const sel2 = document.getElementById('lang-select-story');
            if (sel1) sel1.value = newLang;
            if (sel2) sel2.value = newLang;

            // If story is currently visible, re-type it in the new language immediately!
            const resPanel = document.getElementById('result-panel');
            if (resPanel && resPanel.style.display === 'flex') {
                showProfileAndTypeStory(currentActiveName);
            }
        }

        function startStoryGeneration() {
            const name = document.getElementById('user-name-select').value;
            currentActiveName = name;

            // Show loader state
            document.getElementById('form-card').style.display = 'none';
            document.getElementById('loader-block').style.display = 'flex';

            const lang = currentLang;
            let statusText = "GENERATING FUNNY AI STORY...";
            if (lang === 'ta') statusText = "தமிழ் கதையை உருவாக்குகிறது...";
            if (lang === 'hi') statusText = "हिंदी कहानी तैयार की जा रही है...";

            const stages = [
                { text: "SCANNING BIOGRAPHY DATABASE...", progress: 25 },
                { text: "RETRIEVING OPERATIVE LORE RECORD...", progress: 55 },
                { text: statusText, progress: 85 },
                { text: "STORY READY FOR TYPING...", progress: 100 }
            ];

            const bar = document.getElementById('loader-bar');
            const txt = document.getElementById('loader-txt');

            let idx = 0;
            function step() {
                if (idx < stages.length) {
                    txt.textContent = stages[idx].text;
                    bar.style.width = stages[idx].progress + '%';
                    idx++;
                    setTimeout(step, 650);
                } else {
                    document.getElementById('loader-block').style.display = 'none';
                    showProfileAndTypeStory(name);
                }
            }
            step();
        }

        function showProfileAndTypeStory(name) {
            currentActiveName = name;
            document.getElementById('res-user-name').textContent = name;
            document.getElementById('result-panel').style.display = 'flex';

            const lang = currentLang || 'en';
            const squadData = SQUAD_STORIES[name] || SQUAD_STORIES['VAISAL'];
            const lines = squadData[lang] || squadData['en'];

            const fullStoryText = lines.map((line, i) => `${i + 1}. ${line}`).join('\n\n');

            const storyBody = document.getElementById('story-body');
            const typingStatus = document.getElementById('typing-status');
            storyBody.innerHTML = '';

            if (lang === 'ta') typingStatus.textContent = 'கதை தட்டச்சு செய்யப்படுகிறது...';
            else if (lang === 'hi') typingStatus.textContent = 'कहानी टाइप हो रही है...';
            else typingStatus.textContent = 'TYPING STORY...';

            let charIdx = 0;
            if (typingInterval) clearInterval(typingInterval);

            // Typing effect letter by letter (~25-30ms per character, taking under 1 minute)
            typingInterval = setInterval(() => {
                if (charIdx < fullStoryText.length) {
                    const currentText = fullStoryText.substring(0, charIdx + 1);
                    storyBody.innerHTML = currentText.replace(/\n/g, '<br>') + '<span class="typing-cursor"></span>';
                    charIdx++;
                } else {
                    clearInterval(typingInterval);
                    storyBody.innerHTML = fullStoryText.replace(/\n/g, '<br>');
                    
                    if (lang === 'ta') typingStatus.textContent = '✅ கதை உருவாக்கப்பட்டது';
                    else if (lang === 'hi') typingStatus.textContent = '✅ कहानी तैयार हो गई';
                    else typingStatus.textContent = '✅ STORY GENERATED';

                    typingStatus.style.color = 'var(--green)';
                }
            }, 30);
        }

        function resetPage() {
            if (typingInterval) clearInterval(typingInterval);
            document.getElementById('result-panel').style.display = 'none';
            document.getElementById('loader-block').style.display = 'none';
            document.getElementById('loader-bar').style.width = '0%';
            document.getElementById('form-card').style.display = 'block';
        }

        // Particle canvas background
        (function() {
            const canvas = document.getElementById('particle-bg');
            const ctx = canvas.getContext('2d');
            let W, H, particles = [];

            function resize() {
                W = canvas.width  = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }

            resize();
            window.addEventListener('resize', resize);

            for (let i = 0; i < 45; i++) {
                particles.push({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight,
                    r: Math.random() * 1.3 + 0.3,
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.3,
                    alpha: Math.random() * 0.3 + 0.08
                });
            }

            function draw() {
                ctx.clearRect(0, 0, W, H);
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.x < 0 || p.x > W) p.vx *= -1;
                    if (p.y < 0 || p.y > H) p.vy *= -1;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,100,0,${p.alpha})`;
                    ctx.fill();
                });
                requestAnimationFrame(draw);
            }
            draw();
        })();
    </script>
</body>
</html>
