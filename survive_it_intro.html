<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SURVIVE IT | Loading...</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #39ff14;
            --primary-glow: rgba(57, 255, 20, 0.4);
            --cyan: #00F6FF;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        html, body {
            background: #000;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            width: 100%; height: 100%;
            overflow: hidden;
        }

        /* Scanlines Overlay */
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0.2), rgba(0,0,0,0.2) 1.5px,
                transparent 1.5px, transparent 3px
            );
            pointer-events: none; z-index: 9999; opacity: 0.85;
        }

        /* CRT Screen Glow */
        .crt-glow {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 60%, rgba(57, 255, 20, 0.03) 100%);
            pointer-events: none; z-index: 9998;
        }

        /* CRT Container */
        .crt-container {
            width: 100%; height: 100%;
            position: fixed; top: 0; left: 0;
            transform-origin: center center;
        }

        .crt-collapse {
            animation: crtCollapseEffect 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }
        .crt-expand {
            animation: crtExpandEffect 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        @keyframes crtCollapseEffect {
            0%   { transform: scaleY(1) scaleX(1);    filter: brightness(1); }
            40%  { transform: scaleY(0.01) scaleX(1.1); filter: brightness(3); }
            80%  { transform: scaleY(0.01) scaleX(0.02); filter: brightness(6); }
            100% { transform: scaleY(0) scaleX(0);    filter: brightness(10); opacity: 0; }
        }
        @keyframes crtExpandEffect {
            0%   { transform: scaleY(0) scaleX(0);    filter: brightness(10); opacity: 0; }
            40%  { transform: scaleY(0.01) scaleX(1.1); filter: brightness(5); opacity: 1; }
            80%  { transform: scaleY(1) scaleX(1.02); filter: brightness(1.5); }
            100% { transform: scaleY(1) scaleX(1);    filter: brightness(1); opacity: 1; }
        }

        /* ── STAGES ── */
        .stage {
            display: none;
            width: 100%; height: 100vh;
            position: absolute; top: 0; left: 0;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            box-sizing: border-box;
        }
        .stage.active { display: flex; }

        /* Stage 1 */
        #stage-1 { background: #020205; text-align: center; }

        .terminal-text {
            color: var(--primary);
            font-size: clamp(15px, 2.8vw, 24px);
            letter-spacing: 2px;
            line-height: 2;
            max-width: 820px;
            text-shadow: 0 0 10px var(--primary-glow);
            word-wrap: break-word;
        }

        .cursor {
            display: inline-block;
            width: 11px; height: 1.1em;
            background: var(--primary);
            margin-left: 4px;
            animation: blink 0.8s infinite steps(2);
            vertical-align: middle;
            box-shadow: 0 0 8px var(--primary-glow);
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

        /* Stage 2 */
        #stage-2 {
            background: #020205;
            justify-content: space-between;
        }

        .dev-spacer { flex: 1; }

        .dev-middle {
            flex: 2;
            display: flex; justify-content: center; align-items: center;
        }

        .dev-text {
            color: var(--cyan);
            font-size: clamp(18px, 3.5vw, 32px);
            font-weight: 700;
            letter-spacing: 4px;
            text-shadow: 0 0 14px rgba(0,246,255,0.4);
            text-align: center;
        }

        .dev-footer {
            flex: 1;
            display: flex; flex-direction: column;
            align-items: center; justify-content: flex-end;
            padding-bottom: 60px;
            gap: 18px;
        }

        .studio-text {
            color: var(--primary);
            font-size: clamp(13px, 2.2vw, 20px);
            letter-spacing: 8px;
            text-shadow: 0 0 10px var(--primary-glow);
        }

        /* Skip hint */
        .skip-hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            letter-spacing: 4px;
            color: rgba(57, 255, 20, 0.35);
            text-transform: uppercase;
            animation: pulseHint 2s ease-in-out infinite;
            white-space: nowrap;
        }
        @keyframes pulseHint {
            0%,100% { opacity: 0.35; }
            50%      { opacity: 0.85; }
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>
    <div class="crt-glow"></div>

    <div class="crt-container crt-expand" id="screen-container">

        <!-- STAGE 1: Disclaimer -->
        <div class="stage active" id="stage-1">
            <div class="terminal-text">
                <span id="type-disclaimer"></span><span class="cursor" id="disclaimer-cursor"></span>
            </div>
            <div class="skip-hint">TAP ANYWHERE TO SKIP ▶</div>
        </div>

        <!-- STAGE 2: Developer Credits -->
        <div class="stage" id="stage-2">
            <div class="dev-spacer"></div>
            <div class="dev-middle">
                <div class="dev-text">
                    <span id="type-dev"></span><span class="cursor" id="dev-cursor"></span>
                </div>
            </div>
            <div class="dev-footer">
                <div class="studio-text">
                    <span id="type-studio"></span><span class="cursor" id="studio-cursor" style="display:none;"></span>
                </div>
            </div>
            <div class="skip-hint">TAP ANYWHERE TO SKIP ▶</div>
        </div>

    </div>

    <script>
        // ── Audio Engine ──────────────────────────────────────
        let audioCtx = null;
        const masterVolume = 0.07;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playBeep(type) {
            initAudio();
            if (!audioCtx) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc  = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                if (type === 'typewriter') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(140 + Math.random() * 90, audioCtx.currentTime);
                    gain.gain.setValueAtTime(masterVolume * 0.5, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.035);
                } else if (type === 'transition') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(60, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(700, audioCtx.currentTime + 0.5);
                    gain.gain.setValueAtTime(masterVolume, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.55);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.6);
                }
            } catch(e) { console.warn(e); }
        }

        // ── Flow Control ──────────────────────────────────────
        const screenContainer = document.getElementById('screen-container');
        let currentStage = 1;
        let skipLocked = false;   // prevent double-skip

        function goToLobby() {
            if (skipLocked) return;
            skipLocked = true;
            triggerTransition(() => { location.href = 'survive_it.html'; });
        }

        function triggerTransition(onMid) {
            playBeep('transition');
            screenContainer.classList.remove('crt-expand');
            screenContainer.classList.add('crt-collapse');
            setTimeout(() => {
                if (onMid) onMid();
                screenContainer.classList.remove('crt-collapse');
                screenContainer.classList.add('crt-expand');
            }, 620);
        }

        // Tap / click anywhere = skip
        document.addEventListener('click', () => {
            if (skipLocked) return;
            if (currentStage === 1) {
                // Skip to stage 2 immediately
                skipLocked = true;
                document.getElementById('type-disclaimer').innerText =
                    "FIRST TIME I WAS DEVELOPED THIS SO THERE IS SOME BUGS IN THE GAME SO PLEASE CO-OPERATE ME";
                document.getElementById('disclaimer-cursor').style.display = 'none';
                setTimeout(() => {
                    skipLocked = false;
                    triggerTransition(() => {
                        document.getElementById('stage-1').classList.remove('active');
                        document.getElementById('stage-2').classList.add('active');
                        currentStage = 2;
                        startStage2();
                    });
                }, 400);
            } else if (currentStage === 2) {
                // Skip straight to lobby
                goToLobby();
            }
        });

        // ── Typewriter ────────────────────────────────────────
        function typeWriter(text, elementId, speed, onComplete) {
            const el = document.getElementById(elementId);
            el.innerText = "";
            let i = 0;
            function type() {
                if (i < text.length) {
                    el.innerText += text.charAt(i);
                    playBeep('typewriter');
                    i++;
                    setTimeout(type, speed);
                } else {
                    if (onComplete) onComplete();
                }
            }
            type();
        }

        // ── Stage 2 Logic ─────────────────────────────────────
        function startStage2() {
            typeWriter("DEVELOPER NAME: VASANTH", "type-dev", 70, () => {
                document.getElementById('dev-cursor').style.display = 'none';
                document.getElementById('studio-cursor').style.display = 'inline-block';
                typeWriter("ATC STUDIO", "type-studio", 90, () => {
                    document.getElementById('studio-cursor').style.display = 'none';
                    // Auto advance to lobby after 1.8s
                    setTimeout(goToLobby, 1800);
                });
            });
        }

        // ── Main Entry ────────────────────────────────────────
        window.onload = function () {
            setTimeout(() => {
                const text = "FIRST TIME I WAS DEVELOPED THIS SO THERE IS SOME BUGS IN THE GAME SO PLEASE CO-OPERATE ME";
                typeWriter(text, "type-disclaimer", 52, () => {
                    document.getElementById('disclaimer-cursor').style.display = 'none';
                    setTimeout(() => {
                        skipLocked = true;
                        triggerTransition(() => {
                            document.getElementById('stage-1').classList.remove('active');
                            document.getElementById('stage-2').classList.add('active');
                            currentStage = 2;
                            skipLocked = false;
                            startStage2();
                        });
                    }, 1800);
                });
            }, 600);
        };
    </script>
</body>
</html>
