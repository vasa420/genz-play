<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ATTACKS | Attack Comparison</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #FF6400;
            --primary-glow: rgba(255, 100, 0, 0.45);
            --gold: #FFD700;
            --gold-glow: rgba(255, 215, 0, 0.35);
            --red: #FF2244;
            --green: #00FF88;
            --bg: #04040c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            padding: 40px 20px;
        }

        /* Scanlines and particles */
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.14), rgba(0, 0, 0, 0.14) 1.5px, transparent 1.5px, transparent 3px);
            pointer-events: none; z-index: 9999; opacity: 0.7;
        }

        #particle-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 2;
        }

        /* Return cross button */
        .btn-close {
            position: absolute; top: 30px; right: 30px;
            width: 48px; height: 48px; border-radius: 50%;
            background: rgba(255, 100, 0, 0.1); border: 1.5px solid rgba(255, 100, 0, 0.35);
            color: var(--primary); font-size: 20px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); z-index: 20;
            backdrop-filter: blur(8px); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .btn-close:hover {
            background: var(--primary); color: #000; border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow); transform: rotate(90deg) scale(1.05);
        }

        /* Main Panel container */
        .calc-panel {
            position: relative; z-index: 10; width: 100%; max-width: 680px;
            background: rgba(10, 10, 22, 0.75); border: 1.5px solid rgba(255, 100, 0, 0.25);
            border-radius: 18px; padding: 35px 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 100, 0, 0.08);
            backdrop-filter: blur(16px); transition: all 0.5s ease;
        }

        .panel-header { text-align: center; margin-bottom: 30px; }
        .panel-header h1 {
            font-size: 28px; font-weight: 900; letter-spacing: 3px;
            color: var(--primary); text-shadow: 0 0 15px var(--primary-glow); margin-bottom: 8px;
        }
        .panel-header p {
            font-size: 13px; color: rgba(255, 255, 255, 0.5);
            font-family: 'JetBrains Mono', monospace; letter-spacing: 1px;
        }

        .input-row {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px;
        }

        @media (max-width: 600px) {
            .input-row { grid-template-columns: 1fr; }
        }

        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label {
            font-family: 'JetBrains Mono', monospace; font-size: 11px;
            letter-spacing: 2px; color: rgba(255, 255, 255, 0.4); text-transform: uppercase;
        }

        .input-group select, .input-group input {
            background: rgba(255, 100, 0, 0.04); border: 1.5px solid rgba(255, 100, 0, 0.2);
            padding: 14px 18px; border-radius: 10px; color: #fff;
            font-family: 'Outfit', sans-serif; font-size: 15px; letter-spacing: 1px; outline: none;
            transition: all 0.3s ease; width: 100%;
        }

        .input-group select option {
            background: #0b0b14; color: #fff;
        }

        .input-group select:focus, .input-group input:focus {
            border-color: var(--primary); background: rgba(255, 100, 0, 0.08);
            box-shadow: 0 0 15px rgba(255, 100, 0, 0.15);
        }

        .btn-calc {
            width: 100%; background: var(--primary); color: #000; border: none;
            padding: 16px; font-family: 'JetBrains Mono', monospace; font-size: 13px;
            font-weight: 900; letter-spacing: 3px; border-radius: 10px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 100, 0, 0.2); transition: all 0.3s ease;
        }

        .btn-calc:hover {
            box-shadow: 0 0 25px var(--primary-glow); transform: translateY(-2px);
        }

        /* Comparison Display Grid */
        .comparison-grid {
            display: none; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 25px;
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @media (max-width: 600px) {
            .comparison-grid { grid-template-columns: 1fr; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .comp-card {
            background: rgba(255,255,255,0.03); border: 1.5px solid rgba(255,100,0,0.25);
            border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px;
            position: relative; overflow: hidden;
        }

        .comp-card.winner {
            border-color: var(--gold); box-shadow: 0 0 20px rgba(255,215,0,0.25);
        }

        .winner-badge {
            position: absolute; top: 12px; right: 12px;
            background: rgba(255,215,0,0.15); border: 1px solid var(--gold);
            color: var(--gold); font-family: 'JetBrains Mono', monospace; font-size: 9px;
            letter-spacing: 1.5px; padding: 2px 8px; border-radius: 4px; font-weight: 700;
        }

        .comp-name {
            font-size: 20px; font-weight: 900; letter-spacing: 2px; color: var(--primary);
        }

        .stat-line { display: flex; flex-direction: column; gap: 4px; }
        .stat-header { display: flex; justify-content: space-between; font-size: 11px; font-family: 'JetBrains Mono', monospace; color: rgba(255,255,255,0.5); }
        .stat-track { width: 100%; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
        .stat-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--gold)); border-radius: 3px; }

        .btn-retry {
            width: 100%; background: transparent; border: 1.5px solid var(--primary);
            color: var(--primary); padding: 14px; font-family: 'JetBrains Mono', monospace;
            font-size: 12px; font-weight: 700; letter-spacing: 3px; border-radius: 10px;
            cursor: pointer; transition: all 0.3s ease; margin-top: 25px; display: none;
        }

        .btn-retry:hover { background: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary-glow); }

        /* Error notification toast */
        .error-toast {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(50px);
            opacity: 0;
            background: rgba(20, 0, 0, 0.95);
            border: 1.5px solid var(--red);
            padding: 12px 24px;
            border-radius: 10px;
            color: #FF4466;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 1px;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100;
            box-shadow: 0 4px 20px rgba(255, 34, 68, 0.4);
            width: 85%;
            max-width: 450px;
            text-align: center;
            font-weight: 700;
        }

        .error-toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>

<body>

    <div class="scanlines"></div>
    <canvas id="particle-bg"></canvas>

    <button class="btn-close" onclick="goBack()" title="Return to Analyzer">✕</button>

    <div class="calc-panel">
        <header class="panel-header">
            <h1>⚔ ATTACK COMPARISON</h1>
            <p>COMPARE SPECTRUMS & ATTACK STATS OF TWO OPERATIVES</p>
        </header>

        <div id="form-section">
            <div class="input-row">
                <div class="input-group">
                    <label for="op1">OPERATIVE 1</label>
                    <select id="op1">
                        <option value="VAISAL">VAISAL</option>
                        <option value="NITHISH">NITHISH</option>
                        <option value="GIRISH">GIRISH</option>
                        <option value="DHARNISH">DHARNISH</option>
                        <option value="SURYA">SURYA</option>
                        <option value="THAYA">THAYA</option>
                        <option value="KISHOOR">KISHOOR</option>
                        <option value="VASANTH">VASANTH</option>
                        <option value="LOGITH">LOGITH</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="op2">OPERATIVE 2</label>
                    <select id="op2">
                        <option value="NITHISH">NITHISH</option>
                        <option value="VAISAL" selected>VAISAL</option>
                        <option value="GIRISH">GIRISH</option>
                        <option value="DHARNISH">DHARNISH</option>
                        <option value="SURYA">SURYA</option>
                        <option value="THAYA">THAYA</option>
                        <option value="KISHOOR">KISHOOR</option>
                        <option value="VASANTH">VASANTH</option>
                        <option value="LOGITH">LOGITH</option>
                    </select>
                </div>
            </div>
            <button class="btn-calc" onclick="runComparison()">RUN BATTLE COMPARISON</button>
        </div>

        <div class="comparison-grid" id="comp-grid">
            <div class="comp-card" id="card1">
                <div class="winner-badge" id="badge1" style="display:none;">🏆 HIGHER POWER</div>
                <div class="comp-name" id="name1">VAISAL</div>
                
                <div class="stat-line">
                    <div class="stat-header"><span>ATTACK POWER</span><span id="atk1">92%</span></div>
                    <div class="stat-track"><div class="stat-fill" id="atk1-fill" style="width: 92%;"></div></div>
                </div>

                <div class="stat-line">
                    <div class="stat-header"><span>TACTICAL SPEED</span><span id="spd1">88%</span></div>
                    <div class="stat-track"><div class="stat-fill" id="spd1-fill" style="width: 88%;"></div></div>
                </div>

                <div class="stat-line">
                    <div class="stat-header"><span>SQUAD SYNERGY</span><span id="syn1">95%</span></div>
                    <div class="stat-track"><div class="stat-fill" id="syn1-fill" style="width: 95%;"></div></div>
                </div>
            </div>

            <div class="comp-card" id="card2">
                <div class="winner-badge" id="badge2" style="display:none;">🏆 HIGHER POWER</div>
                <div class="comp-name" id="name2">NITHISH</div>

                <div class="stat-line">
                    <div class="stat-header"><span>ATTACK POWER</span><span id="atk2">90%</span></div>
                    <div class="stat-track"><div class="stat-fill" id="atk2-fill" style="width: 90%;"></div></div>
                </div>

                <div class="stat-line">
                    <div class="stat-header"><span>TACTICAL SPEED</span><span id="spd2">94%</span></div>
                    <div class="stat-track"><div class="stat-fill" id="spd2-fill" style="width: 94%;"></div></div>
                </div>

                <div class="stat-line">
                    <div class="stat-header"><span>SQUAD SYNERGY</span><span id="syn2">91%</span></div>
                    <div class="stat-track"><div class="stat-fill" id="syn2-fill" style="width: 91%;"></div></div>
                </div>
            </div>
        </div>

        <button class="btn-retry" id="btn-retry" onclick="resetComparison()">COMPARE AGAIN</button>
    </div>

    <!-- Alert Toast Dialog -->
    <div class="error-toast" id="error-toast">⚠️ TWO NAMES ARE THE SAME! PLEASE SELECT A DIFFERENT NAME.</div>

    <script>
        function showToast(message) {
            const toast = document.getElementById('error-toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3200);
        }

        function goBack() {
            const dimmer = document.createElement('div');
            dimmer.style.cssText = `
                position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                background: #000; z-index: 99999; opacity: 0;
                transition: opacity 0.8s ease;
            `;
            document.body.appendChild(dimmer);
            requestAnimationFrame(() => requestAnimationFrame(() => {
                dimmer.style.opacity = '1';
                setTimeout(() => { window.location.href = 'attacks_game.html'; }, 900);
            }));
        }

        const OPERATIVE_STATS = {
            'VAISAL':   { atk: 95, spd: 88, syn: 96 },
            'NITHISH':  { atk: 94, spd: 95, syn: 92 },
            'GIRISH':   { atk: 90, spd: 91, syn: 94 },
            'DHARNISH': { atk: 92, spd: 89, syn: 90 },
            'SURYA':    { atk: 93, spd: 90, syn: 95 },
            'THAYA':    { atk: 89, spd: 92, syn: 93 },
            'KISHOOR':  { atk: 88, spd: 87, syn: 91 },
            'VASANTH':  { atk: 96, spd: 94, syn: 98 },
            'LOGITH':   { atk: 87, spd: 89, syn: 90 }
        };

        function runComparison() {
            const op1 = document.getElementById('op1').value;
            const op2 = document.getElementById('op2').value;

            if (op1 === op2) {
                showToast("⚠️ BOTH OPERATIVE NAMES ARE THE SAME! PLEASE CHANGE TO A DIFFERENT NAME.");
                return;
            }

            if ((op1 === 'VAISAL' && op2 === 'NITHISH') || (op1 === 'NITHISH' && op2 === 'VAISAL')) {
                const dimmer = document.createElement('div');
                dimmer.style.cssText = `
                    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                    background: #000; z-index: 99999; opacity: 0;
                    transition: opacity 0.8s ease;
                `;
                document.body.appendChild(dimmer);
                requestAnimationFrame(() => requestAnimationFrame(() => {
                    dimmer.style.opacity = '1';
                    setTimeout(() => { window.location.href = 'vaisal_nithish_battle.html'; }, 900);
                }));
                return;
            }

            if ((op1 === 'VAISAL' && op2 === 'GIRISH') || (op1 === 'GIRISH' && op2 === 'VAISAL')) {
                const dimmer = document.createElement('div');
                dimmer.style.cssText = `
                    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                    background: #000; z-index: 99999; opacity: 0;
                    transition: opacity 0.8s ease;
                `;
                document.body.appendChild(dimmer);
                requestAnimationFrame(() => requestAnimationFrame(() => {
                    dimmer.style.opacity = '1';
                    setTimeout(() => { window.location.href = 'vaisal_girish_battle.html'; }, 900);
                }));
                return;
            }

            const isDhanish1 = (op1 === 'DHARNISH' || op1 === 'DHANISH');
            const isDhanish2 = (op2 === 'DHARNISH' || op2 === 'DHANISH');
            if ((isDhanish1 && op2 === 'VAISAL') || (op1 === 'VAISAL' && isDhanish2)) {
                const dimmer = document.createElement('div');
                dimmer.style.cssText = `
                    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                    background: #000; z-index: 99999; opacity: 0;
                    transition: opacity 0.8s ease;
                `;
                document.body.appendChild(dimmer);
                requestAnimationFrame(() => requestAnimationFrame(() => {
                    dimmer.style.opacity = '1';
                    setTimeout(() => { window.location.href = 'vaisal_dhanish_battle.html'; }, 900);
                }));
                return;
            }

            if ((isDhanish1 && op2 === 'GIRISH') || (op1 === 'GIRISH' && isDhanish2)) {
                const dimmer = document.createElement('div');
                dimmer.style.cssText = `
                    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                    background: #000; z-index: 99999; opacity: 0;
                    transition: opacity 0.8s ease;
                `;
                document.body.appendChild(dimmer);
                requestAnimationFrame(() => requestAnimationFrame(() => {
                    dimmer.style.opacity = '1';
                    setTimeout(() => { window.location.href = 'girish_dhanish_battle.html'; }, 900);
                }));
                return;
            }

            if ((isDhanish1 && op2 === 'NITHISH') || (op1 === 'NITHISH' && isDhanish2)) {
                const dimmer = document.createElement('div');
                dimmer.style.cssText = `
                    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                    background: #000; z-index: 99999; opacity: 0;
                    transition: opacity 0.8s ease;
                `;
                document.body.appendChild(dimmer);
                requestAnimationFrame(() => requestAnimationFrame(() => {
                    dimmer.style.opacity = '1';
                    setTimeout(() => { window.location.href = 'nithish_dhanish_battle.html'; }, 900);
                }));
                return;
            }

            const st1 = OPERATIVE_STATS[op1] || { atk: 88, spd: 88, syn: 88 };
            const st2 = OPERATIVE_STATS[op2] || { atk: 88, spd: 88, syn: 88 };

            document.getElementById('name1').textContent = op1;
            document.getElementById('atk1').textContent = st1.atk + '%';
            document.getElementById('atk1-fill').style.width = st1.atk + '%';
            document.getElementById('spd1').textContent = st1.spd + '%';
            document.getElementById('spd1-fill').style.width = st1.spd + '%';
            document.getElementById('syn1').textContent = st1.syn + '%';
            document.getElementById('syn1-fill').style.width = st1.syn + '%';

            document.getElementById('name2').textContent = op2;
            document.getElementById('atk2').textContent = st2.atk + '%';
            document.getElementById('atk2-fill').style.width = st2.atk + '%';
            document.getElementById('spd2').textContent = st2.spd + '%';
            document.getElementById('spd2-fill').style.width = st2.spd + '%';
            document.getElementById('syn2').textContent = st2.syn + '%';
            document.getElementById('syn2-fill').style.width = st2.syn + '%';

            const score1 = st1.atk + st1.spd + st1.syn;
            const score2 = st2.atk + st2.spd + st2.syn;

            const card1 = document.getElementById('card1');
            const card2 = document.getElementById('card2');
            const badge1 = document.getElementById('badge1');
            const badge2 = document.getElementById('badge2');

            card1.classList.remove('winner');
            card2.classList.remove('winner');
            badge1.style.display = 'none';
            badge2.style.display = 'none';

            if (score1 >= score2) {
                card1.classList.add('winner');
                badge1.style.display = 'block';
            } else {
                card2.classList.add('winner');
                badge2.style.display = 'block';
            }

            document.getElementById('form-section').style.display = 'none';
            document.getElementById('comp-grid').style.display = 'grid';
            document.getElementById('btn-retry').style.display = 'block';
        }

        function resetComparison() {
            document.getElementById('comp-grid').style.display = 'none';
            document.getElementById('btn-retry').style.display = 'none';
            document.getElementById('form-section').style.display = 'block';
        }

        // Particle background canvas
        (function() {
            const canvas = document.getElementById('particle-bg');
            const ctx = canvas.getContext('2d');
            let W, H, particles = [];

            function resize() {
                W = canvas.width  = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }

            resize();
            window.addEventListener('resize', resize);

            for (let i = 0; i < 45; i++) {
                particles.push({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight,
                    r: Math.random() * 1.3 + 0.3,
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.3,
                    alpha: Math.random() * 0.3 + 0.08
                });
            }

            function draw() {
                ctx.clearRect(0, 0, W, H);
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.x < 0 || p.x > W) p.vx *= -1;
                    if (p.y < 0 || p.y > H) p.vy *= -1;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,100,0,${p.alpha})`;
                    ctx.fill();
                });
                requestAnimationFrame(draw);
            }
            draw();
        })();
    </script>
</body>

</html>
