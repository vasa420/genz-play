<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ATTACKS | Audio Record - NITHISH</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6400;
            --primary-glow: rgba(255, 100, 0, 0.45);
            --green: #00FF88;
            --green-glow: rgba(0, 255, 136, 0.35);
            --gold: #FFD700;
            --gold-glow: rgba(255, 215, 0, 0.35);
            --bg: #04040c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Scanline overlay */
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.14), rgba(0,0,0,0.14) 1.5px, transparent 1.5px, transparent 3px);
            pointer-events: none; z-index: 9999; opacity: 0.7;
        }

        /* Ambient particles bg */
        #particle-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 2;
        }

        /* Main Viewport Container */
        .fullscreen-viewport {
            position: relative;
            z-index: 5;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            box-sizing: border-box;
            width: 100%;
            height: 100vh;
        }

        /* Header Information Grid */
        .floating-header {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 15;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(4, 4, 12, 0.55);
            padding: 20px 30px;
            border-radius: 14px;
            border: 1px solid rgba(255, 100, 0, 0.25);
            backdrop-filter: blur(14px);
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.6);
            animation: slideDown 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideDown {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @media (max-width: 640px) {
            .floating-header { top: 20px; left: 20px; right: 80px; padding: 12px 18px; }
        }

        .info-block { display: flex; flex-direction: column; gap: 4px; }
        .info-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 2px; color: rgba(255, 255, 255, 0.45); text-transform: uppercase; }
        .info-value { font-size: clamp(18px, 3vw, 24px); font-weight: 900; letter-spacing: 3px; text-transform: uppercase; }
        .info-value.name { color: var(--primary); text-shadow: 0 0 15px var(--primary-glow); }
        .info-value.status { color: var(--green); text-shadow: 0 0 15px var(--green-glow); }

        .audio-tag-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(255, 100, 0, 0.15); border: 1px solid rgba(255, 100, 0, 0.4);
            color: var(--primary); font-family: 'JetBrains Mono', monospace;
            font-size: 11px; letter-spacing: 2px; padding: 4px 10px; border-radius: 6px; width: fit-content;
        }

        /* Floating Cross / Return Button */
        .btn-close {
            position: absolute; top: 30px; right: 30px;
            width: 48px; height: 48px; border-radius: 50%;
            background: rgba(255, 100, 0, 0.1); border: 1.5px solid rgba(255, 100, 0, 0.35);
            color: var(--primary); font-size: 20px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); z-index: 20;
            backdrop-filter: blur(8px); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .btn-close:hover {
            background: var(--primary); color: #000; border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow); transform: rotate(90deg) scale(1.05);
        }

        /* Audio Player Card */
        .audio-player-card {
            position: relative; width: 90%; max-width: 520px;
            background: rgba(10, 10, 20, 0.85); border: 2px solid rgba(255, 100, 0, 0.35);
            border-radius: 24px; padding: 40px 30px; display: flex;
            flex-direction: column; align-items: center; gap: 24px;
            backdrop-filter: blur(16px); box-shadow: 0 20px 60px rgba(0,0,0,0.9), 0 0 40px rgba(255,100,0,0.25);
            z-index: 10; animation: zoomIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes zoomIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .disc-wrapper {
            width: 130px; height: 130px; border-radius: 50%;
            background: radial-gradient(circle, #222 30%, #050505 100%);
            border: 3px solid var(--primary); display: flex;
            align-items: center; justify-content: center; font-size: 48px;
            box-shadow: 0 0 25px var(--primary-glow); transition: 0.5s;
        }

        .disc-wrapper.playing {
            animation: spinDisc 3s linear infinite;
            box-shadow: 0 0 40px var(--primary-glow);
        }

        @keyframes spinDisc { to { transform: rotate(360deg); } }

        /* Audio Wave Visualizer Bars */
        .wave-bars {
            display: flex; align-items: center; justify-content: center; gap: 6px; height: 50px;
        }

        .bar {
            width: 6px; height: 15px; background: var(--primary); border-radius: 4px;
            transition: height 0.15s ease;
        }

        .bar.active {
            animation: waveAnim 0.8s ease-in-out infinite alternate;
        }

        .bar:nth-child(1) { animation-delay: 0.1s; }
        .bar:nth-child(2) { animation-delay: 0.3s; }
        .bar:nth-child(3) { animation-delay: 0.2s; }
        .bar:nth-child(4) { animation-delay: 0.5s; }
        .bar:nth-child(5) { animation-delay: 0.4s; }
        .bar:nth-child(6) { animation-delay: 0.6s; }

        @keyframes waveAnim {
            0% { height: 12px; }
            100% { height: 48px; background: var(--gold); }
        }

        .btn-play-audio {
            width: 70px; height: 70px; border-radius: 50%;
            background: var(--primary); border: none; color: #000;
            font-size: 28px; cursor: pointer; display: flex;
            align-items: center; justify-content: center; transition: 0.3s;
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .btn-play-audio:hover {
            transform: scale(1.1); box-shadow: 0 0 35px var(--primary);
        }

        /* Floating Download Button */
        .floating-download {
            position: absolute; bottom: 30px; right: 30px; z-index: 15;
        }

        .btn-download {
            background: rgba(4, 4, 12, 0.6); border: 1.5px solid var(--primary);
            color: #fff; font-family: 'JetBrains Mono', monospace; font-size: 11px;
            letter-spacing: 2px; padding: 12px 24px; border-radius: 10px;
            cursor: pointer; text-decoration: none; display: inline-flex;
            align-items: center; gap: 10px; font-weight: 700; backdrop-filter: blur(12px);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .btn-download:hover {
            background: var(--primary); color: #000; border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow); transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>

    <!-- Background particles -->
    <canvas id="particle-bg"></canvas>

    <!-- Main Viewport -->
    <main class="fullscreen-viewport">

        <!-- Close / Return -->
        <button class="btn-close" id="btn-return" onclick="goBack()" title="Return to Analyzer">✕</button>

        <!-- Stats overlay -->
        <header class="floating-header">
            <div class="audio-tag-badge">🎙️ AUDIO RECORDING LOG</div>
            <div class="info-block">
                <span class="info-label">DATABASE RECORD NAME</span>
                <h1 class="info-value name">NITHISH</h1>
            </div>
            <div class="info-block">
                <span class="info-label">ACTIVE THREAT STATUS</span>
                <div class="info-value status">TEMPLE PRIEST 🛕 (AUDIO RECORD)</div>
            </div>
        </header>

        <!-- Main Audio Card -->
        <div class="audio-player-card">
            <div class="disc-wrapper" id="disc-wrapper">🔔</div>

            <div style="text-align: center;">
                <h3 style="color: #fff; font-size: 20px; letter-spacing: 2px; font-weight: 700;">TEMPLE BELL AUDIO LOG</h3>
                <p style="color: rgba(255,255,255,0.4); font-size: 12px; font-family: 'JetBrains Mono', monospace; margin-top: 4px; letter-spacing: 1px;">ATC STUDIO INTELLIGENCE · NITHISH RECORD</p>
            </div>

            <!-- Wave Visualizer -->
            <div class="wave-bars">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>

            <button class="btn-play-audio" id="play-btn" onclick="toggleAudio()">▶</button>
            <audio id="audio-element" src="soundreality-bell-fx-410608.mp3" loop></audio>
        </div>

        <!-- Download Badge -->
        <div class="floating-download">
            <a class="btn-download" href="soundreality-bell-fx-410608.mp3" download="nithish_audio_record.mp3">
                <span>⬇</span> DOWNLOAD AUDIO RECORD
            </a>
        </div>

    </main>

    <script>
        function goBack() {
            const dimmer = document.createElement('div');
            dimmer.style.cssText = `
                position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                background: #000; z-index: 99999; opacity: 0;
                transition: opacity 0.8s ease;
            `;
            document.body.appendChild(dimmer);
            requestAnimationFrame(() => requestAnimationFrame(() => {
                dimmer.style.opacity = '1';
                setTimeout(() => { window.location.href = 'attacks_game.html'; }, 900);
            }));
        }

        const audio = document.getElementById('audio-element');
        const playBtn = document.getElementById('play-btn');
        const disc = document.getElementById('disc-wrapper');
        const bars = document.querySelectorAll('.bar');

        function toggleAudio() {
            if (audio.paused) {
                audio.play();
                playBtn.innerText = '❚❚';
                disc.classList.add('playing');
                bars.forEach(b => b.classList.add('active'));
            } else {
                audio.pause();
                playBtn.innerText = '▶';
                disc.classList.remove('playing');
                bars.forEach(b => b.classList.remove('active'));
            }
        }

        // Particle canvas background
        (function() {
            const canvas = document.getElementById('particle-bg');
            const ctx = canvas.getContext('2d');
            let W, H, particles = [];

            function resize() {
                W = canvas.width  = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }

            resize();
            window.addEventListener('resize', resize);

            for (let i = 0; i < 55; i++) {
                particles.push({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight,
                    r: Math.random() * 1.4 + 0.4,
                    vx: (Math.random() - 0.5) * 0.35,
                    vy: (Math.random() - 0.5) * 0.35,
                    alpha: Math.random() * 0.35 + 0.1
                });
            }

            function draw() {
                ctx.clearRect(0, 0, W, H);
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.x < 0 || p.x > W) p.vx *= -1;
                    if (p.y < 0 || p.y > H) p.vy *= -1;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,100,0,${p.alpha})`;
                    ctx.fill();
                });
                requestAnimationFrame(draw);
            }
            draw();
        })();
    </script>
</body>
</html>
