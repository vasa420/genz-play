<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ATTACKS | Record - VAISAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6400;
            --primary-glow: rgba(255, 100, 0, 0.45);
            --green: #00FF88;
            --green-glow: rgba(0, 255, 136, 0.35);
            --red: #FF2244;
            --red-glow: rgba(255, 34, 68, 0.35);
            --gold: #FFD700;
            --gold-glow: rgba(255, 215, 0, 0.35);
            --bg: #04040c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Scanline overlay */
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.14), rgba(0,0,0,0.14) 1.5px, transparent 1.5px, transparent 3px);
            pointer-events: none; z-index: 9999; opacity: 0.7;
        }

        /* Ambient particles bg */
        #particle-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }

        /* Floating Record Title Container */
        .record-container {
            width: 90%;
            max-width: 760px;
            background: rgba(255, 255, 255, 0.015);
            border: 1px solid rgba(255, 100, 0, 0.2);
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(16px);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.7), 0 0 30px rgba(255, 100, 0, 0.05);
            z-index: 10;
            position: relative;
            animation: recordEntrance 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes recordEntrance {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Cross / Return Button */
        .btn-close {
            position: absolute;
            top: 25px;
            right: 25px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 100, 0, 0.08);
            border: 1.5px solid rgba(255, 100, 0, 0.3);
            color: var(--primary);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 20;
            box-shadow: 0 0 10px rgba(255, 100, 0, 0.1);
        }

        .btn-close:hover {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
            transform: rotate(90deg) scale(1.05);
        }

        .btn-close:active {
            transform: rotate(90deg) scale(0.95);
        }

        /* Header Information Grid */
        .record-header {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
            padding-bottom: 25px;
            border-bottom: 1.5px dashed rgba(255, 100, 0, 0.18);
        }

        @media (max-width: 580px) {
            .record-header {
                grid-template-columns: 1fr;
                gap: 15px;
            }
        }

        .info-block {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .info-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
        }

        .info-value {
            font-size: clamp(20px, 3.5vw, 26px);
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .info-value.name {
            color: var(--primary);
            text-shadow: 0 0 15px var(--primary-glow);
        }

        .info-value.status {
            color: var(--gold);
            text-shadow: 0 0 15px var(--gold-glow);
            animation: pulseText 2s infinite ease-in-out;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.75; }
        }

        /* Main Image Panel */
        .image-panel {
            position: relative;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            border: 2.5px solid rgba(255, 100, 0, 0.25);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(255, 100, 0, 0.08);
            background: #080812;
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .image-panel:hover {
            border-color: var(--primary);
            box-shadow: 0 10px 45px rgba(0, 0, 0, 0.9), 0 0 35px rgba(255, 100, 0, 0.2);
        }

        .image-panel img {
            width: 100%;
            display: block;
            object-fit: cover;
            max-height: 520px;
            transition: transform 0.5s ease;
        }

        .image-panel:hover img {
            transform: scale(1.015);
        }

        /* Custom Floating download button */
        .btn-download-wrapper {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 15;
        }

        .btn-download {
            background: rgba(0, 0, 0, 0.75);
            border: 1.5px solid var(--primary);
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 2px;
            padding: 10px 22px;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            backdrop-filter: blur(8px);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .btn-download:hover {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
            transform: translateY(-2px);
        }

        .btn-download:active {
            transform: translateY(1px);
        }

        /* Subtle scanner glow overlay */
        .scanner-beam {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            box-shadow: 0 0 10px var(--primary);
            animation: scan 4s linear infinite;
            z-index: 12;
            pointer-events: none;
            opacity: 0.6;
        }

        @keyframes scan {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }

        /* Badge for the image panel */
        .image-badge {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(255, 100, 0, 0.4);
            color: var(--primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            letter-spacing: 2px;
            padding: 5px 12px;
            border-radius: 6px;
            font-weight: 700;
            backdrop-filter: blur(8px);
            z-index: 15;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>

    <!-- Background particles -->
    <canvas id="particle-bg"></canvas>

    <!-- Main card container -->
    <div class="record-container" id="record-card">
        <!-- Return button -->
        <button class="btn-close" id="btn-return" onclick="goBack()" title="Return to Analyzer">✕</button>

        <!-- Header -->
        <header class="record-header">
            <div class="info-block">
                <span class="info-label">Database Record Name</span>
                <h1 class="info-value name" id="rec-name">VAISAL</h1>
            </div>
            <div class="info-block">
                <span class="info-label">Active Threat Status</span>
                <div class="info-value status" id="rec-status">DRIVING THE BUS</div>
            </div>
        </header>

        <!-- Image viewport -->
        <div class="image-panel">
            <div class="scanner-beam"></div>
            <span class="image-badge">Verified File Attachment</span>
            <img src="vaisal.jpg" alt="Vaisal driving the bus on duty">

            <!-- Download Button -->
            <div class="btn-download-wrapper">
                <a class="btn-download" id="btn-download-img" href="vaisal.jpg" download="vaisal_driving_bus.jpg">
                    <span>⬇</span> DOWNLOAD IMAGE
                </a>
            </div>
        </div>
    </div>

    <script>
        // Smooth return transition
        function goBack() {
            const dimmer = document.createElement('div');
            dimmer.style.cssText = `
                position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                background: #000; z-index: 99999; opacity: 0;
                transition: opacity 0.8s ease;
            `;
            document.body.appendChild(dimmer);
            requestAnimationFrame(() => requestAnimationFrame(() => {
                dimmer.style.opacity = '1';
                setTimeout(() => { window.location.href = 'attacks_game.html'; }, 900);
            }));
        }

        // Particle canvas background
        (function() {
            const canvas = document.getElementById('particle-bg');
            const ctx = canvas.getContext('2d');
            let W, H, particles = [];

            function resize() {
                W = canvas.width  = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }

            resize();
            window.addEventListener('resize', resize);

            for (let i = 0; i < 55; i++) {
                particles.push({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight,
                    r: Math.random() * 1.4 + 0.4,
                    vx: (Math.random() - 0.5) * 0.35,
                    vy: (Math.random() - 0.5) * 0.35,
                    alpha: Math.random() * 0.35 + 0.1
                });
            }

            function draw() {
                ctx.clearRect(0, 0, W, H);
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.x < 0 || p.x > W) p.vx *= -1;
                    if (p.y < 0 || p.y > H) p.vy *= -1;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,100,0,${p.alpha})`;
                    ctx.fill();
                });
                requestAnimationFrame(draw);
            }
            draw();
        })();

        // Randomly select image and status configuration
        const VAISAL_RECORDS = [
            {
                image: 'vaisal.jpg',
                status: 'DRIVING THE BUS',
                downloadName: 'vaisal_driving_bus.jpg',
                alt: 'Vaisal driving the bus on duty'
            },
            {
                image: 'vaisal2.jpg',
                status: 'CONDUCTING THE BUS',
                downloadName: 'vaisal_conducting_bus.jpg',
                alt: 'Vaisal conducting the bus on duty'
            }
        ];

        const selectedRecord = VAISAL_RECORDS[Math.floor(Math.random() * VAISAL_RECORDS.length)];

        // Set status
        document.getElementById('rec-status').textContent = selectedRecord.status;

        // Set image source and alt text
        const imageElement = document.querySelector('.image-panel img');
        imageElement.src = selectedRecord.image;
        imageElement.alt = selectedRecord.alt;

        // Set download link parameters
        const downloadBtn = document.getElementById('btn-download-img');
        downloadBtn.href = selectedRecord.image;
        downloadBtn.download = selectedRecord.downloadName;

        // Fade in entrance effect
        document.body.style.opacity = '0';
        document.body.style.transition = 'opacity 0.8s ease';
        window.addEventListener('load', () => {
            requestAnimationFrame(() => { document.body.style.opacity = '1'; });
        });
    </script>
</body>
</html>
