<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ATTACKS | AI Photo Generation Result</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6400;
            --primary-glow: rgba(255, 100, 0, 0.45);
            --green: #00FF88;
            --red: #FF2244;
            --gold: #FFD700;
            --gold-glow: rgba(255, 215, 0, 0.35);
            --bg: #04040c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Scanlines overlay */
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.14), rgba(0,0,0,0.14) 1.5px, transparent 1.5px, transparent 3px);
            pointer-events: none; z-index: 9999; opacity: 0.7;
        }

        /* Background particles canvas */
        #particle-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }

        /* Header */
        .header {
            width: 100%; padding: 20px 30px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid rgba(255, 100, 0, 0.15);
            background: rgba(4,4,12,0.92);
            backdrop-filter: blur(12px);
            position: sticky; top: 0; z-index: 100;
        }

        .header-logo {
            font-family: 'JetBrains Mono', monospace;
            font-size: 18px; font-weight: 900; letter-spacing: 5px;
            color: var(--primary);
            text-shadow: 0 0 12px var(--primary-glow);
        }

        .btn-back {
            background: transparent;
            border: 1px solid rgba(255,100,0,0.35);
            color: var(--primary);
            padding: 8px 18px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px; letter-spacing: 2px;
            border-radius: 6px; cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        /* Main Container */
        .main-container {
            width: 100%; max-width: 860px;
            padding: 40px 20px 80px;
            position: relative; z-index: 5;
            display: flex; flex-direction: column; align-items: center;
        }

        /* Title Header */
        .page-header {
            text-align: center; margin-bottom: 30px;
        }

        .page-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px; letter-spacing: 4px; color: var(--gold);
            text-transform: uppercase; margin-bottom: 8px;
            display: inline-block;
            padding: 4px 14px; background: rgba(255,215,0,0.08);
            border: 1px solid rgba(255,215,0,0.25); border-radius: 20px;
        }

        .page-title {
            font-size: clamp(22px, 4.5vw, 38px);
            font-weight: 900; letter-spacing: 3px;
            background: linear-gradient(135deg, #FF6400, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .page-sub {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px; color: rgba(255,255,255,0.45);
            letter-spacing: 2px; margin-top: 6px;
            max-width: 650px; overflow-wrap: break-word;
        }

        /* Loading / Generating State Card */
        .gen-card {
            width: 100%; background: rgba(10, 10, 24, 0.75);
            border: 1.5px solid rgba(255, 100, 0, 0.3);
            border-radius: 16px; padding: 45px 30px;
            display: flex; flex-direction: column; align-items: center;
            text-align: center; backdrop-filter: blur(14px);
            box-shadow: 0 0 30px rgba(0,0,0,0.6);
            position: relative; overflow: hidden;
        }

        .radar-spinner {
            width: 80px; height: 80px;
            border: 3px solid rgba(255, 100, 0, 0.15);
            border-top-color: var(--primary);
            border-right-color: var(--gold);
            border-radius: 50%;
            animation: spin 1.2s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
            box-shadow: 0 0 25px var(--primary-glow);
            margin-bottom: 25px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .gen-status-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px; font-weight: 700; letter-spacing: 4px;
            color: var(--primary); text-shadow: 0 0 10px var(--primary-glow);
            margin-bottom: 10px; text-transform: uppercase;
        }

        .gen-status-phase {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px; letter-spacing: 2px; color: rgba(255,255,255,0.6);
            margin-bottom: 25px; min-height: 20px;
        }

        .gen-progress-track {
            width: 100%; max-width: 500px; height: 8px;
            background: rgba(255,255,255,0.06); border-radius: 10px;
            overflow: hidden; border: 1px solid rgba(255,100,0,0.2);
            margin-bottom: 12px;
        }

        .gen-progress-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #FF6400, #FFD700);
            border-radius: 10px;
            box-shadow: 0 0 12px var(--primary-glow);
            transition: width 0.4s ease;
        }

        .gen-time-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px; letter-spacing: 2px; color: rgba(255,255,255,0.45);
        }

        .btn-speedup {
            margin-top: 18px; padding: 6px 16px;
            background: rgba(255,100,0,0.08); border: 1px solid rgba(255,100,0,0.25);
            color: rgba(255,255,255,0.6); font-family: 'JetBrains Mono', monospace;
            font-size: 10px; letter-spacing: 1px; border-radius: 20px;
            cursor: pointer; transition: 0.25s;
        }

        .btn-speedup:hover {
            border-color: var(--primary); color: var(--primary);
            background: rgba(255,100,0,0.15);
        }

        /* Result Section */
        .result-section {
            width: 100%; display: none;
            flex-direction: column; align-items: center; gap: 30px;
            animation: fadeIn 0.8s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Photo Display Frame */
        .image-frame {
            position: relative;
            width: 100%; max-width: 760px;
            border-radius: 16px;
            border: 2px solid rgba(255, 100, 0, 0.4);
            box-shadow: 0 0 40px rgba(0,0,0,0.9), 0 0 20px var(--primary-glow);
            overflow: hidden; background: #000;
            display: flex; align-items: center; justify-content: center;
            min-height: 380px;
        }

        .image-frame img {
            width: 100%; height: auto; max-height: 540px;
            object-fit: cover; display: block;
            transition: opacity 0.4s ease;
        }

        /* Scanner beam */
        .scanner-beam {
            position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            box-shadow: 0 0 15px var(--primary);
            animation: scan 4s ease-in-out infinite; z-index: 10;
        }

        @keyframes scan {
            0%, 100% { top: 0%; opacity: 0; }
            50% { top: 98%; opacity: 0.8; }
        }

        .caption-badge {
            background: rgba(4, 4, 12, 0.85);
            border: 1px solid rgba(255, 100, 0, 0.3);
            border-radius: 30px; padding: 12px 24px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px; letter-spacing: 2px; color: var(--gold);
            backdrop-filter: blur(10px); text-align: center;
            max-width: 760px;
        }

        /* Buttons Container */
        .action-btns {
            display: flex; gap: 16px; flex-wrap: wrap; justify-content: center;
        }

        .btn-action {
            display: inline-flex; align-items: center; gap: 10px;
            padding: 14px 28px; border-radius: 30px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px; font-weight: 700; letter-spacing: 2px;
            cursor: pointer; text-decoration: none; transition: all 0.3s ease;
        }

        .btn-like {
            background: rgba(255, 34, 68, 0.12);
            border: 1.5px solid rgba(255, 34, 68, 0.4);
            color: #FF2244;
        }

        .btn-like:hover, .btn-like.liked {
            background: #FF2244; color: #fff;
            box-shadow: 0 0 20px rgba(255, 34, 68, 0.5);
        }

        .btn-download {
            background: var(--primary); color: #000; border: none;
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px var(--primary);
        }

        .btn-regen {
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(255, 215, 0, 0.4);
            color: var(--gold);
        }

        .btn-regen:hover {
            background: rgba(255, 215, 0, 0.15);
            transform: translateY(-2px);
        }

        /* ── Mobile Responsive Styles ─────────────────────────── */
        @media (max-width: 768px) {
            body { padding: 0; }
            .header { padding: 12px 14px; }
            .header-logo { font-size: 14px; letter-spacing: 2px; }
            .btn-back { padding: 6px 10px; font-size: 10px; }
            .main-container { padding: 20px 14px 40px; }
            .page-title { font-size: 22px; }
            .action-btns { flex-direction: column; width: 100%; }
            .btn-action { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>
    <canvas id="particle-bg"></canvas>

    <header class="header">
        <div class="header-logo">ATTACKS // PHOTO GENERATOR</div>
        <button class="btn-back" onclick="goBack()">✕ PROMPT INPUT</button>
    </header>

    <main class="main-container">

        <div class="page-header">
            <span class="page-tag">📸 AI PHOTO GENERATION</span>
            <h1 class="page-title">GENERATED AI PHOTO</h1>
            <p class="page-sub" id="user-prompt-display">OBSERVED PROMPT: Loading prompt...</p>
        </div>

        <!-- Loading Card -->
        <div class="gen-card" id="gen-card">
            <div class="radar-spinner"></div>
            <div class="gen-status-title" id="gen-status-title">GENERATING AI PHOTO</div>
            <div class="gen-status-phase" id="gen-status-phase">PHASE 1/4: ANALYZING USER PROMPT MATRIX & KEYWORD PARSING...</div>
            
            <div class="gen-progress-track">
                <div class="gen-progress-fill" id="gen-progress-fill"></div>
            </div>

            <div class="gen-time-text" id="gen-time-text">ESTIMATED TIME: GENERATING PROMPT SCENE...</div>

            <button class="btn-speedup" onclick="speedUpGeneration()">⚡ FAST FORWARD GENERATION</button>
        </div>

        <!-- Result Section -->
        <div class="result-section" id="result-section">
            
            <div class="image-frame">
                <div class="scanner-beam"></div>
                <img id="photo-scene-img" src="" alt="AI Generated Photo Scene" onerror="handleImageLoadError(this)">
            </div>

            <div class="caption-badge" id="caption-text">
                📸 GENERATED AI PHOTO SCENE
            </div>

            <div class="action-btns">
                <button class="btn-action btn-like" id="btn-like" onclick="toggleLike()">
                    <span id="like-icon">❤️</span> <span id="like-text">LIKE PHOTO</span> (<span id="like-count">0</span>)
                </button>
                <a class="btn-action btn-download" id="btn-download" href="#" download="ai_photo_generated.jpg" target="_blank">
                    <span>⬇</span> DOWNLOAD PHOTO
                </a>
                <button class="btn-action btn-regen" onclick="createNewPhoto()">
                    <span>📸</span> CREATE NEW PHOTO
                </button>
            </div>

        </div>

    </main>

    <script>
        function goBack() {
            const dimmer = document.createElement('div');
            dimmer.style.cssText = `
                position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                background: #000; z-index: 99999; opacity: 0;
                transition: opacity 0.8s ease;
            `;
            document.body.appendChild(dimmer);
            requestAnimationFrame(() => requestAnimationFrame(() => {
                dimmer.style.opacity = '1';
                setTimeout(() => { window.location.href = 'photo_as_my_own.html'; }, 900);
            }));
        }

        function createNewPhoto() {
            goBack();
        }

        // Read query string
        const urlParams = new URLSearchParams(window.location.search);
        let userPrompt = urlParams.get('prompt') || 'A futuristic cyber warrior standing on a neon rooftop in the rain';

        document.getElementById('user-prompt-display').textContent = `OBSERVED PROMPT: "${userPrompt}"`;
        document.getElementById('caption-text').textContent = `📸 PROMPT: "${userPrompt}"`;

        // Like Button Logic
        let isLiked = false;
        let likeCount = Math.floor(Math.random() * 42) + 12;

        function toggleLike() {
            const btn = document.getElementById('btn-like');
            const icon = document.getElementById('like-icon');
            const text = document.getElementById('like-text');
            const countEl = document.getElementById('like-count');

            if (!isLiked) {
                isLiked = true;
                likeCount++;
                btn.classList.add('liked');
                text.textContent = 'LIKED';
            } else {
                isLiked = false;
                likeCount--;
                btn.classList.remove('liked');
                text.textContent = 'LIKE PHOTO';
            }
            countEl.textContent = likeCount;
        }

        const PHASES = [
            "PHASE 1/4: ANALYZING USER PROMPT MATRIX & KEYWORD PARSING...",
            "PHASE 2/4: ALLOCATING AI GPU NODES & SAMPLING LATENT DIFFUSION...",
            "PHASE 3/4: SYNTHESIZING ACCURATE PROMPT SCENE & LIGHTING...",
            "PHASE 4/4: APPLYING 8K CINEMATIC DETAIL & COLOR GRADIENT..."
        ];

        let timerInterval = null;
        let totalDurationSeconds = 3;
        let elapsedTime = 0;

        // Bulletproof Procedural AI Photo Canvas Synthesizer
        function generateProceduralArtDataUrl(promptText) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 600;
            const ctx = canvas.getContext('2d');
            const p = (promptText || '').toLowerCase();

            let bgGrad;
            let themeColor = '#FF6400';
            let secondaryColor = '#9933FF';
            let themeType = 'cyber';

            if (p.includes('samurai') || p.includes('cyber') || p.includes('ninja') || p.includes('neon') || p.includes('blade')) {
                themeType = 'cyber';
                themeColor = '#00FFFF';
                secondaryColor = '#FF007F';
                bgGrad = ctx.createLinearGradient(0, 0, 1024, 600);
                bgGrad.addColorStop(0, '#0a0314');
                bgGrad.addColorStop(0.5, '#051829');
                bgGrad.addColorStop(1, '#19002e');
            } else if (p.includes('lion') || p.includes('fire') || p.includes('flame') || p.includes('beast') || p.includes('tiger')) {
                themeType = 'fire';
                themeColor = '#FF6400';
                secondaryColor = '#FFD700';
                bgGrad = ctx.createLinearGradient(0, 0, 1024, 600);
                bgGrad.addColorStop(0, '#1a0500');
                bgGrad.addColorStop(0.5, '#331000');
                bgGrad.addColorStop(1, '#0a000c');
            } else if (p.includes('river') || p.includes('sunset') || p.includes('kaveri') || p.includes('water') || p.includes('beach') || p.includes('ocean')) {
                themeType = 'sunset';
                themeColor = '#FF5500';
                secondaryColor = '#FF0099';
                bgGrad = ctx.createLinearGradient(0, 0, 1024, 600);
                bgGrad.addColorStop(0, '#1f0033');
                bgGrad.addColorStop(0.4, '#4d004d');
                bgGrad.addColorStop(0.7, '#801a00');
                bgGrad.addColorStop(1, '#ff6600');
            } else if (p.includes('car') || p.includes('hypercar') || p.includes('drift') || p.includes('highway') || p.includes('racing')) {
                themeType = 'hypercar';
                themeColor = '#0088FF';
                secondaryColor = '#00FF88';
                bgGrad = ctx.createLinearGradient(0, 0, 1024, 600);
                bgGrad.addColorStop(0, '#020b18');
                bgGrad.addColorStop(0.5, '#041d3a');
                bgGrad.addColorStop(1, '#00050f');
            } else if (p.includes('space') || p.includes('galaxy') || p.includes('star') || p.includes('planet') || p.includes('moon') || p.includes('astronaut')) {
                themeType = 'space';
                themeColor = '#9933FF';
                secondaryColor = '#00FFFF';
                bgGrad = ctx.createLinearGradient(0, 0, 1024, 600);
                bgGrad.addColorStop(0, '#030008');
                bgGrad.addColorStop(0.5, '#12002b');
                bgGrad.addColorStop(1, '#000c1f');
            } else {
                themeType = 'cyber';
                bgGrad = ctx.createLinearGradient(0, 0, 1024, 600);
                bgGrad.addColorStop(0, '#07051a');
                bgGrad.addColorStop(0.5, '#190a38');
                bgGrad.addColorStop(1, '#05020f');
            }

            // Fill background
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, 1024, 600);

            // Ambient Glowing Light Orbs
            for (let i = 0; i < 4; i++) {
                const cx = (i * 280 + 120) % 1024;
                const cy = (i * 150 + 100) % 600;
                const r = 220;
                const radGrad = ctx.createRadialGradient(cx, cy, 10, cx, cy, r);
                radGrad.addColorStop(0, themeColor + '55');
                radGrad.addColorStop(0.5, secondaryColor + '22');
                radGrad.addColorStop(1, 'transparent');
                ctx.fillStyle = radGrad;
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.fill();
            }

            // Theme Specific Foreground Art Layer
            ctx.save();
            if (themeType === 'cyber' || themeType === 'hypercar') {
                const horizonY = 380;
                ctx.strokeStyle = themeColor + '44';
                ctx.lineWidth = 1.5;
                for (let y = horizonY; y < 600; y += (y - horizonY + 8) * 0.25) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(1024, y);
                    ctx.stroke();
                }
                for (let x = -200; x <= 1224; x += 80) {
                    ctx.beginPath();
                    ctx.moveTo(512, horizonY);
                    ctx.lineTo(x, 600);
                    ctx.stroke();
                }
            } else if (themeType === 'sunset') {
                const sunGrad = ctx.createRadialGradient(512, 380, 20, 512, 380, 200);
                sunGrad.addColorStop(0, '#FFFFFF');
                sunGrad.addColorStop(0.3, '#FFD700');
                sunGrad.addColorStop(0.7, '#FF3300');
                sunGrad.addColorStop(1, 'transparent');
                ctx.fillStyle = sunGrad;
                ctx.beginPath();
                ctx.arc(512, 380, 200, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#0a0212';
                ctx.beginPath();
                ctx.moveTo(0, 600);
                ctx.lineTo(0, 420);
                ctx.lineTo(180, 340);
                ctx.lineTo(340, 430);
                ctx.lineTo(512, 310);
                ctx.lineTo(700, 440);
                ctx.lineTo(850, 360);
                ctx.lineTo(1024, 450);
                ctx.lineTo(1024, 600);
                ctx.closePath();
                ctx.fill();
            } else if (themeType === 'fire') {
                for (let i = 0; i < 70; i++) {
                    const px = (i * 37) % 1024;
                    const py = (i * 23) % 600;
                    const pr = (i % 5) + 3;
                    const flameGrad = ctx.createRadialGradient(px, py, 0, px, py, pr);
                    flameGrad.addColorStop(0, '#FFFFFF');
                    flameGrad.addColorStop(0.5, '#FF6400');
                    flameGrad.addColorStop(1, 'transparent');
                    ctx.fillStyle = flameGrad;
                    ctx.beginPath();
                    ctx.arc(px, py, pr, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            ctx.restore();

            // Star & Sparkle Particles
            ctx.fillStyle = '#FFFFFF';
            for (let i = 0; i < 100; i++) {
                const sx = (i * 97) % 1024;
                const sy = (i * 53) % 600;
                const sr = (i % 3) * 0.8 + 0.8;
                ctx.globalAlpha = (i % 7 + 3) / 10;
                ctx.beginPath();
                ctx.arc(sx, sy, sr, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;

            // Central Glowing Emblem Frame
            ctx.save();
            ctx.translate(512, 270);
            ctx.strokeStyle = themeColor;
            ctx.lineWidth = 3.5;
            ctx.shadowColor = themeColor;
            ctx.shadowBlur = 25;
            ctx.beginPath();
            ctx.arc(0, 0, 105, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = 'rgba(10, 12, 30, 0.82)';
            ctx.beginPath();
            ctx.arc(0, 0, 92, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 18;
            ctx.shadowColor = secondaryColor;
            ctx.font = '64px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            let iconSymbol = '📷';
            if (themeType === 'cyber') iconSymbol = '⚔️';
            else if (themeType === 'fire') iconSymbol = '🔥';
            else if (themeType === 'sunset') iconSymbol = '🌲';
            else if (themeType === 'hypercar') iconSymbol = '🏎️';
            else if (themeType === 'space') iconSymbol = '🚀';

            ctx.fillText(iconSymbol, 0, -4);
            ctx.restore();

            // Header Watermark
            ctx.save();
            ctx.font = 'bold 15px "JetBrains Mono", monospace';
            ctx.fillStyle = themeColor;
            ctx.shadowColor = themeColor;
            ctx.shadowBlur = 10;
            ctx.fillText('✦ ATTACKS // AI PHOTO ENGINE v1.0', 40, 48);

            ctx.font = '11px "JetBrains Mono", monospace';
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            ctx.shadowBlur = 0;
            ctx.fillText('STATUS: 8K CINEMATIC SYNTHESIS COMPLETE', 40, 68);

            // Bottom Prompt Card
            ctx.fillStyle = 'rgba(4, 5, 16, 0.9)';
            ctx.strokeStyle = themeColor + '88';
            ctx.lineWidth = 1.5;
            const boxW = 800;
            const boxH = 65;
            const boxX = (1024 - boxW) / 2;
            const boxY = 490;

            ctx.beginPath();
            if (ctx.roundRect) {
                ctx.roundRect(boxX, boxY, boxW, boxH, 14);
            } else {
                ctx.rect(boxX, boxY, boxW, boxH);
            }
            ctx.fill();
            ctx.stroke();

            ctx.font = 'bold 11px "JetBrains Mono", monospace';
            ctx.fillStyle = secondaryColor;
            ctx.fillText('PROMPT MATRIX:', boxX + 20, boxY + 25);

            ctx.font = '13px "Outfit", sans-serif';
            ctx.fillStyle = '#FFFFFF';
            const displayPrompt = promptText.length > 80 ? promptText.substring(0, 77) + '...' : promptText;
            ctx.fillText(`"${displayPrompt}"`, boxX + 20, boxY + 47);

            ctx.restore();

            return canvas.toDataURL('image/jpeg', 0.92);
        }

        function getAccuratePromptImage(prompt) {
            const p = prompt.toLowerCase();
            if (p.includes('bus')) return 'vaisal.jpg';
            if (p.includes('truck') || p.includes('lorry')) return 'girish.jpg';
            return generateProceduralArtDataUrl(prompt);
        }

        function handleImageLoadError(imgEl) {
            imgEl.onerror = null; // Prevent infinite loop
            const fallbackSrc = generateProceduralArtDataUrl(userPrompt);
            imgEl.src = fallbackSrc;
            const btnDownload = document.getElementById('btn-download');
            if (btnDownload) btnDownload.href = fallbackSrc;
        }

        function startGeneration() {
            const genCard = document.getElementById('gen-card');
            const resultSec = document.getElementById('result-section');
            const progressBar = document.getElementById('gen-progress-fill');
            const phaseLabel = document.getElementById('gen-status-phase');
            const timeText = document.getElementById('gen-time-text');
            const sceneImg = document.getElementById('photo-scene-img');
            const btnDownload = document.getElementById('btn-download');

            genCard.style.display = 'flex';
            resultSec.style.display = 'none';
            progressBar.style.width = '0%';
            document.getElementById('like-count').textContent = likeCount;

            const cleanUserPrompt = userPrompt.trim();
            const seed = Math.floor(Math.random() * 999999);
            const promptUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(cleanUserPrompt)}?width=1024&height=600&seed=${seed}&nologo=true`;
            const proceduralFallback = generateProceduralArtDataUrl(cleanUserPrompt);

            let isFinished = false;
            let loadedSrc = proceduralFallback;

            // Preload Pollinations image with timeout & instant fallback
            const imgPreloader = new Image();
            imgPreloader.onload = function() {
                loadedSrc = promptUrl;
                if (!isFinished && elapsedTime >= totalDurationSeconds) {
                    isFinished = true;
                    finishGeneration(promptUrl);
                }
            };
            imgPreloader.onerror = function() {
                loadedSrc = proceduralFallback;
                if (!isFinished && elapsedTime >= totalDurationSeconds) {
                    isFinished = true;
                    finishGeneration(proceduralFallback);
                }
            };
            imgPreloader.src = promptUrl;

            elapsedTime = 0;
            totalDurationSeconds = 3;

            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                elapsedTime++;
                const progressPct = Math.min(95, Math.floor((elapsedTime / totalDurationSeconds) * 100));
                progressBar.style.width = progressPct + '%';

                let phaseIdx = Math.min(3, Math.floor((progressPct / 100) * PHASES.length));
                phaseLabel.textContent = PHASES[phaseIdx];

                const remain = Math.max(0, totalDurationSeconds - elapsedTime);
                timeText.textContent = `GENERATING AI PHOTO: ~${remain}s REMAINING...`;

                if (elapsedTime >= totalDurationSeconds) {
                    if (!isFinished) {
                        isFinished = true;
                        finishGeneration(loadedSrc);
                    }
                }
            }, 1000);
        }

        function speedUpGeneration() {
            totalDurationSeconds = Math.max(elapsedTime + 1, 1);
        }

        function finishGeneration(finalSrc) {
            clearInterval(timerInterval);
            const progressBar = document.getElementById('gen-progress-fill');
            const phaseLabel = document.getElementById('gen-status-phase');
            const genCard = document.getElementById('gen-card');
            const resultSec = document.getElementById('result-section');
            const sceneImg = document.getElementById('photo-scene-img');
            const btnDownload = document.getElementById('btn-download');

            progressBar.style.width = '100%';
            phaseLabel.textContent = "AI PHOTO GENERATION COMPLETE!";

            setTimeout(() => {
                genCard.style.display = 'none';
                sceneImg.src = finalSrc;
                sceneImg.style.display = 'block';
                btnDownload.href = finalSrc;
                btnDownload.download = 'ai_photo_generated.jpg';
                resultSec.style.display = 'flex';
            }, 400);
        }

        // Particle Canvas Background
        (function() {
            const canvas = document.getElementById('particle-bg');
            const ctx = canvas.getContext('2d');
            let W, H, particles = [];

            function resize() {
                W = canvas.width  = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }

            resize();
            window.addEventListener('resize', resize);

            for (let i = 0; i < 50; i++) {
                particles.push({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight,
                    r: Math.random() * 1.4 + 0.4,
                    vx: (Math.random() - 0.5) * 0.35,
                    vy: (Math.random() - 0.5) * 0.35,
                    alpha: Math.random() * 0.35 + 0.1
                });
            }

            function draw() {
                ctx.clearRect(0, 0, W, H);
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.x < 0 || p.x > W) p.vx *= -1;
                    if (p.y < 0 || p.y > H) p.vy *= -1;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,100,0,${p.alpha})`;
                    ctx.fill();
                });
                requestAnimationFrame(draw);
            }
            draw();
        })();

        // Start generation process on load
        window.addEventListener('load', () => {
            startGeneration();
        });
    </script>
    <script src="security_guard.js"></script>
</body>
</html>
