<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ATTACKS | Photo As My Own</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6400;
            --primary-glow: rgba(255, 100, 0, 0.45);
            --green: #00FF88;
            --gold: #FFD700;
            --gold-glow: rgba(255, 215, 0, 0.35);
            --bg: #04040c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Scanlines overlay */
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.14), rgba(0,0,0,0.14) 1.5px, transparent 1.5px, transparent 3px);
            pointer-events: none; z-index: 9999; opacity: 0.7;
        }

        /* Ambient particles bg */
        #particle-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }

        /* Header */
        .header {
            width: 100%; padding: 22px 30px 18px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid rgba(255, 100, 0, 0.12);
            background: rgba(4,4,12,0.9);
            backdrop-filter: blur(12px);
            position: sticky; top: 0; z-index: 100;
        }

        .header-logo {
            font-family: 'JetBrains Mono', monospace;
            font-size: 20px; font-weight: 900; letter-spacing: 6px;
            color: var(--primary);
            text-shadow: 0 0 12px var(--primary-glow);
        }

        .header-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px; letter-spacing: 3px; color: #555;
            text-transform: uppercase;
        }

        .btn-back {
            background: transparent;
            border: 1px solid rgba(255,100,0,0.3);
            color: rgba(255,100,0,0.7);
            padding: 8px 18px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px; letter-spacing: 2px;
            border-radius: 6px; cursor: pointer;
            transition: 0.25s;
        }

        .btn-back:hover {
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        /* Main Container */
        .main-container {
            width: 100%; max-width: 760px;
            padding: 40px 20px 80px;
            position: relative; z-index: 1;
            display: flex; flex-direction: column; align-items: center;
        }

        /* Input Card */
        .card {
            width: 100%; background: rgba(10, 10, 24, 0.8);
            border: 1.5px solid rgba(255, 100, 0, 0.35);
            border-radius: 18px; padding: 35px 30px;
            backdrop-filter: blur(14px);
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.6);
            margin-bottom: 30px; text-align: center;
        }

        .card-icon {
            font-size: 44px; color: var(--primary);
            text-shadow: 0 0 15px var(--primary-glow); margin-bottom: 10px;
        }

        .card-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 24px; font-weight: 900; letter-spacing: 4px;
            color: var(--primary); margin-bottom: 6px;
            text-transform: uppercase;
            text-shadow: 0 0 15px var(--primary-glow);
        }

        .card-sub {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px; color: rgba(255,255,255,0.45);
            letter-spacing: 2px; margin-bottom: 20px;
        }

        .limit-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px; color: var(--gold);
            background: rgba(255,215,0,0.08);
            border: 1px solid rgba(255,215,0,0.25);
            border-radius: 20px; padding: 6px 18px;
            display: inline-block; margin-bottom: 25px;
            letter-spacing: 1px;
        }

        /* Prompt Textarea Space */
        .prompt-group {
            display: flex; flex-direction: column; gap: 8px;
            margin-bottom: 25px; text-align: left;
        }

        .prompt-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px; letter-spacing: 2px; color: rgba(255,255,255,0.6);
            text-transform: uppercase;
        }

        .prompt-textarea {
            width: 100%; height: 130px; padding: 16px 20px;
            background: rgba(4, 4, 12, 0.9);
            border: 1.5px solid rgba(255, 100, 0, 0.4);
            border-radius: 12px; color: #fff;
            font-family: 'Outfit', sans-serif;
            font-size: 16px; font-weight: 400; line-height: 1.5;
            outline: none; resize: vertical;
            transition: all 0.3s ease;
        }

        .prompt-textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .prompt-textarea::placeholder {
            color: rgba(255,255,255,0.3); font-size: 14px;
        }

        /* Presets Grid */
        .presets-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px; letter-spacing: 2px; color: rgba(255,255,255,0.4);
            text-transform: uppercase; text-align: left; margin-bottom: 10px;
        }

        .presets-container {
            display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 30px;
        }

        .preset-btn {
            background: rgba(255, 100, 0, 0.08);
            border: 1px solid rgba(255, 100, 0, 0.25);
            color: rgba(255,255,255,0.75);
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px; letter-spacing: 1px;
            padding: 8px 14px; border-radius: 20px;
            cursor: pointer; transition: all 0.25s ease;
        }

        .preset-btn:hover {
            border-color: var(--primary); color: var(--primary);
            background: rgba(255, 100, 0, 0.15);
        }

        /* Start Generate Bar Downside */
        .btn-start-generate {
            display: flex; align-items: center; justify-content: center; gap: 12px;
            width: 100%; padding: 18px;
            background: linear-gradient(135deg, #FF6400, #FF9D00);
            border: none; border-radius: 12px;
            color: #000; font-family: 'JetBrains Mono', monospace;
            font-size: 15px; font-weight: 900; letter-spacing: 3px;
            cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 0 25px var(--primary-glow);
            text-transform: uppercase;
        }

        .btn-start-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 35px var(--primary);
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>
    <canvas id="particle-bg"></canvas>

    <!-- Header -->
    <header class="header">
        <div>
            <div class="header-logo">ATTACKS</div>
            <div class="header-tag">PHOTO AS MY OWN v1.0</div>
        </div>
        <div style="display: flex; gap: 10px;">
            <a class="btn-back" href="video_as_my_own.html" style="text-decoration:none;">🎥 VIDEO AS MY OWN</a>
            <button class="btn-back" onclick="goBack()">← SEARCH ENGINE</button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="main-container">
        
        <div class="card">
            <div class="card-icon">📸</div>
            <h1 class="card-title">PHOTO AS MY OWN</h1>
            <p class="card-sub">TYPE A USER PROMPT BELOW TO GENERATE AN AI PHOTO</p>
            
            <div class="limit-badge" id="limit-badge-display">
                ⚡ DAILY LIMIT: 4 PHOTOS PER 24 HOURS (REMAINING: 4/4)
            </div>

            <div class="prompt-group">
                <label class="prompt-label" for="prompt-input">YOUR PHOTO PROMPT</label>
                <textarea id="prompt-input" class="prompt-textarea" placeholder="Describe the photo scene you want to generate... e.g. A futuristic cyber samurai standing on a neon rooftop in the rain, or a majestic golden lion with glowing flame eyes..."></textarea>
            </div>

            <div class="presets-label">QUICK PROMPT PRESETS:</div>
            <div class="presets-container">
                <button class="preset-btn" onclick="usePreset('Futuristic cyber samurai standing on a neon illuminated skyscraper rooftop in heavy rain, cinematic lighting, 8k')">⚔️ Cyber Samurai Rain</button>
                <button class="preset-btn" onclick="usePreset('Scenic Kaveri river flowing through lush tropical rainforest under a golden sunset sky with dramatic god rays')">🌊 Kaveri Sunset Forest</button>
                <button class="preset-btn" onclick="usePreset('Majestic golden lion king with glowing burning flame eyes and ethereal aura portrait')">🦁 Flame Crown Lion</button>
                <button class="preset-btn" onclick="usePreset('Hypercar supercar drifting at high speed on a dark highway at night with blue light trails')">🏎️ Night Highway Hypercar</button>
            </div>

            <!-- Start Generate Button Bar Downside -->
            <button class="btn-start-generate" onclick="startPhotoGeneration()">
                <span>📸</span> START GENERATE PHOTO
            </button>
        </div>

    </main>

    <script>
        const LIMIT_COUNT = 4;
        const LIMIT_TIME_MS = 24 * 60 * 60 * 1000; // 24 hours in milliseconds

        function getUsageData() {
            let usageData = JSON.parse(localStorage.getItem('photo_gen_usage_data') || '[]');
            const now = Date.now();
            // Filter out usage records older than 24 hours
            usageData = usageData.filter(timestamp => (now - timestamp) < LIMIT_TIME_MS);
            localStorage.setItem('photo_gen_usage_data', JSON.stringify(usageData));
            return usageData;
        }

        function updateLimitDisplay() {
            const usageData = getUsageData();
            const remaining = Math.max(0, LIMIT_COUNT - usageData.length);
            const badge = document.getElementById('limit-badge-display');
            if (badge) {
                if (remaining === 0) {
                    const oldestUsage = usageData[0];
                    const now = Date.now();
                    const timeRemainingMs = LIMIT_TIME_MS - (now - oldestUsage);
                    const hoursLeft = Math.floor(timeRemainingMs / (1000 * 60 * 60));
                    const minsLeft = Math.ceil((timeRemainingMs % (1000 * 60 * 60)) / (1000 * 60));
                    badge.innerHTML = `⚠️ DAILY LIMIT REACHED (0/4 REMAINING) · RESETS IN ${hoursLeft}h ${minsLeft}m`;
                    badge.style.color = '#FF2244';
                    badge.style.borderColor = 'rgba(255,34,68,0.4)';
                    badge.style.background = 'rgba(255,34,68,0.08)';
                } else {
                    badge.innerHTML = `⚡ DAILY LIMIT: 4 PHOTOS PER 24 HOURS (REMAINING: ${remaining}/4)`;
                    badge.style.color = '#FFD700';
                    badge.style.borderColor = 'rgba(255,215,0,0.25)';
                    badge.style.background = 'rgba(255,215,0,0.08)';
                }
            }
        }

        function goBack() {
            const dimmer = document.createElement('div');
            dimmer.style.cssText = `
                position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                background: #000; z-index: 99999; opacity: 0;
                transition: opacity 0.8s ease;
            `;
            document.body.appendChild(dimmer);
            requestAnimationFrame(() => requestAnimationFrame(() => {
                dimmer.style.opacity = '1';
                setTimeout(() => { window.location.href = 'attacks_game.html'; }, 900);
            }));
        }

        function usePreset(text) {
            document.getElementById('prompt-input').value = text;
        }

        function startPhotoGeneration() {
            const promptText = document.getElementById('prompt-input').value.trim();
            if (!promptText) {
                alert('Please type a prompt first before clicking START GENERATE PHOTO!');
                return;
            }

            const usageData = getUsageData();
            const now = Date.now();

            if (usageData.length >= LIMIT_COUNT) {
                const oldestUsage = usageData[0];
                const timeRemainingMs = LIMIT_TIME_MS - (now - oldestUsage);
                const hoursLeft = Math.floor(timeRemainingMs / (1000 * 60 * 60));
                const minsLeft = Math.ceil((timeRemainingMs % (1000 * 60 * 60)) / (1000 * 60));

                alert(`⚠️ DAILY LIMIT REACHED!\n\nYou can create up to ${LIMIT_COUNT} photos per 24 hours.\n\nPlease wait ${hoursLeft}h ${minsLeft}m before creating your next AI photo. Limits reset automatically after 24 hours!`);
                return;
            }

            // Record this generation attempt timestamp
            usageData.push(now);
            localStorage.setItem('photo_gen_usage_data', JSON.stringify(usageData));
            updateLimitDisplay();

            const dimmer = document.createElement('div');
            dimmer.style.cssText = `
                position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                background: #000; z-index: 99999; opacity: 0;
                transition: opacity 0.8s ease;
            `;
            document.body.appendChild(dimmer);
            requestAnimationFrame(() => requestAnimationFrame(() => {
                dimmer.style.opacity = '1';
                setTimeout(() => { 
                    window.location.href = 'photo_prompt_result.html?prompt=' + encodeURIComponent(promptText); 
                }, 900);
            }));
        }

        // Initialize limit display on page load
        window.addEventListener('DOMContentLoaded', updateLimitDisplay);

        // Particle Canvas Background
        (function() {
            const canvas = document.getElementById('particle-bg');
            const ctx = canvas.getContext('2d');
            let W, H, particles = [];

            function resize() {
                W = canvas.width  = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }

            resize();
            window.addEventListener('resize', resize);

            for (let i = 0; i < 45; i++) {
                particles.push({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight,
                    r: Math.random() * 1.3 + 0.3,
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.3,
                    alpha: Math.random() * 0.3 + 0.08
                });
            }

            function draw() {
                ctx.clearRect(0, 0, W, H);
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.x < 0 || p.x > W) p.vx *= -1;
                    if (p.y < 0 || p.y > H) p.vy *= -1;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,100,0,${p.alpha})`;
                    ctx.fill();
                });
                requestAnimationFrame(draw);
            }
            draw();
        })();
    </script>
</body>
</html>
