<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ATTACKS | Loading Simulation</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6400;
            --primary-glow: rgba(255, 100, 0, 0.4);
            --danger: #FF2200;
            --danger-glow: rgba(255, 34, 0, 0.35);
            --bg: #05050d;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            background-color: var(--bg);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Screen static & Scanlines overlays */
        .overlay-effects {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        .scanlines {
            width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.18), rgba(0,0,0,0.18) 1.5px, transparent 1.5px, transparent 3px);
            opacity: 0.85;
        }

        .noise {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.04;
            animation: noiseMove 0.2s infinite steps(4);
        }

        @keyframes noiseMove {
            0% { transform: translate(0, 0); }
            50% { transform: translate(-10px, 10px); }
            100% { transform: translate(10px, -10px); }
        }

        /* Stages container */
        .stage-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .stage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94), visibility 1.2s;
            z-index: 10;
        }

        .stage.active {
            opacity: 1;
            visibility: visible;
        }

        /* Stage 1: Typewriter intro stage */
        #canvas-stage {
            z-index: 1;
            background-color: #000;
        }

        .typewriter-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 15px;
            padding: 20px;
            width: 100%;
            max-width: 90%;
        }

        .typewriter-line {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(24px, 6.5vw, 56px);
            font-weight: 900;
            color: var(--primary);
            text-shadow: 0 0 10px rgba(255, 100, 0, 0.45), 0 0 25px var(--primary-glow);
            letter-spacing: 5px;
            text-transform: uppercase;
            min-height: 1.3em;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cursor {
            display: inline-block;
            width: 12px;
            height: clamp(24px, 6.5vw, 56px);
            background-color: var(--primary);
            margin-left: 5px;
            animation: blink 0.75s step-end infinite;
            box-shadow: 0 0 10px var(--primary);
        }

        @keyframes blink {
            from, to { background-color: transparent; }
            50% { background-color: var(--primary); }
        }

        .skip-prompt {
            position: absolute;
            bottom: 30px;
            right: 40px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 2px;
            cursor: pointer;
            z-index: 1000;
            transition: color 0.3s;
            border-bottom: 1px solid transparent;
        }

        .skip-prompt:hover {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        /* Stage 2: Squad grid styling */
        .squad-title {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 6px;
            color: #FFD700;
            text-align: center;
            text-transform: uppercase;
            margin-bottom: 40px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            animation: floatText 4s ease-in-out infinite alternate;
        }

        .squad-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            width: 90%;
            max-width: 950px;
        }

        @media (max-width: 768px) {
            .squad-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 480px) {
            .squad-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .friend-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 20px 10px;
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #ccc;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            opacity: 0;
            transform: translateY(20px);
            transition: transform 0.4s, border-color 0.4s, box-shadow 0.4s, color 0.4s;
        }

        .friend-card.reveal {
            animation: revealCard 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .friend-card:hover {
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 10px 25px rgba(255, 100, 0, 0.3), 0 0 15px var(--primary-glow);
            transform: translateY(-5px) scale(1.05);
        }

        @keyframes revealCard {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes floatText {
            0% { transform: translateY(0); }
            100% { transform: translateY(-8px); }
        }

        /* Stage 3: Disclaimer styling */
        .disclaimer-card {
            background: rgba(15, 5, 5, 0.82);
            border: 1px solid var(--danger-glow);
            border-radius: 20px;
            padding: 40px;
            max-width: 650px;
            width: 90%;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8), 0 0 30px var(--danger-glow);
            backdrop-filter: blur(15px);
            animation: pulseGlow 3s infinite alternate;
        }

        .disclaimer-header {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 8px;
            color: var(--danger);
            text-shadow: 0 0 15px var(--danger);
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .disclaimer-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            color: #ddd;
            line-height: 1.8;
            letter-spacing: 1px;
            margin-bottom: 35px;
        }

        .btn-battle {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 14px 35px;
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 3px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .btn-battle:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 25px var(--primary);
            transform: translateY(-2px);
        }

        @keyframes pulseGlow {
            0% { border-color: rgba(255, 34, 0, 0.25); box-shadow: 0 15px 40px rgba(0,0,0,0.8), 0 0 20px rgba(255, 34, 0, 0.2); }
            100% { border-color: rgba(255, 34, 0, 0.55); box-shadow: 0 15px 40px rgba(0,0,0,0.8), 0 0 35px rgba(255, 34, 0, 0.4); }
        }
    </style>
</head>
<body>
    <div class="overlay-effects">
        <div class="scanlines"></div>
        <div class="noise"></div>
    </div>

    <div class="stage-container">
        <!-- STAGE 1: Typewriter Effect ("WELCOME TO ATC STUDIO") -->
        <div id="canvas-stage" class="stage active">
            <div class="typewriter-container">
                <div id="line1" class="typewriter-line"></div>
                <div id="line2" class="typewriter-line"></div>
            </div>
            <div class="skip-prompt" onclick="skipIntro()">SKIP INTRO >></div>
        </div>

        <!-- STAGE 2: Welcome Squad members -->
        <div id="squad-stage" class="stage">
            <div class="squad-title">WELCOME YOU ALL MY FRIENDS:</div>
            <div class="squad-grid" id="squad-grid">
                <!-- Names will be dynamically generated and staggered -->
            </div>
            <div class="skip-prompt" onclick="skipToDisclaimer()">SKIP >></div>
        </div>

        <!-- STAGE 3: Disclaimer -->
        <div id="disclaimer-stage" class="stage">
            <div class="disclaimer-card">
                <div class="disclaimer-header">⚠️ DISCLAIMER ⚠️</div>
                <p class="disclaimer-text">
                    THIS GAME IS DEVELOPED ONLY FOR ENJOYMENT PURPOSE ONLY. ALL EVENTS, CHARACTERS, AND SQUAD MEMBERS REPRESENTED IN THIS GAME ARE PURELY FOR RECREATION.
                </p>
                <button class="btn-battle" onclick="goToLobby()">CONTINUE TO ARENA [K]</button>
            </div>
        </div>
    </div>

    <script>
        // --- Web Audio API Atmospheric Synthesizer ---
        let audioCtx = null;
        let ambientOsc = null;
        let noiseFilter = null;
        let synthRiser = null;
        let masterGain = null;

        function startSynth() {
            try {
                // Initialize Audio Context on click/keypress
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                masterGain = audioCtx.createGain();
                masterGain.gain.setValueAtTime(0.0, audioCtx.currentTime);
                masterGain.gain.linearRampToValueAtTime(0.65, audioCtx.currentTime + 1.5);
                masterGain.connect(audioCtx.destination);

                // LFO deep atmospheric rumble
                ambientOsc = audioCtx.createOscillator();
                ambientOsc.type = 'sawtooth';
                ambientOsc.frequency.setValueAtTime(32.0, audioCtx.currentTime); // C1 low pitch
                
                const lpFilter = audioCtx.createBiquadFilter();
                lpFilter.type = 'lowpass';
                lpFilter.frequency.setValueAtTime(75.0, audioCtx.currentTime);
                
                ambientOsc.connect(lpFilter);
                lpFilter.connect(masterGain);
                ambientOsc.start();

                // Wind sound synthesis using white noise and a modulated low-pass filter
                const bufferSize = audioCtx.sampleRate * 2;
                const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }
                const whiteNoise = audioCtx.createBufferSource();
                whiteNoise.buffer = noiseBuffer;
                whiteNoise.loop = true;

                noiseFilter = audioCtx.createBiquadFilter();
                noiseFilter.type = 'bandpass';
                noiseFilter.frequency.setValueAtTime(250.0, audioCtx.currentTime);
                noiseFilter.Q.setValueAtTime(4.0, audioCtx.currentTime);

                // Modulate bandpass frequency
                const lfo = audioCtx.createOscillator();
                lfo.frequency.setValueAtTime(0.2, audioCtx.currentTime); // Slow wave
                const lfoGain = audioCtx.createGain();
                lfoGain.gain.setValueAtTime(120.0, audioCtx.currentTime);
                
                lfo.connect(lfoGain);
                lfoGain.connect(noiseFilter.frequency);
                
                whiteNoise.connect(noiseFilter);
                noiseFilter.connect(masterGain);
                lfo.start();
                whiteNoise.start();

                // Suspense riser synth
                synthRiser = audioCtx.createOscillator();
                synthRiser.type = 'sine';
                synthRiser.frequency.setValueAtTime(80.0, audioCtx.currentTime);
                // Rise pitch over 8.5 seconds
                synthRiser.frequency.exponentialRampToValueAtTime(750.0, audioCtx.currentTime + 8.5);
                
                const riserGain = audioCtx.createGain();
                riserGain.gain.setValueAtTime(0.01, audioCtx.currentTime);
                riserGain.gain.linearRampToValueAtTime(0.22, audioCtx.currentTime + 13.5);
                
                synthRiser.connect(riserGain);
                riserGain.connect(masterGain);
                synthRiser.start();
            } catch (e) {
                console.warn("Web Audio API not supported or blocked: ", e);
            }
        }

        function stopSynth(fadeSeconds = 1.0) {
            if (audioCtx && masterGain) {
                try {
                    masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
                    masterGain.gain.setValueAtTime(masterGain.gain.value, audioCtx.currentTime);
                    masterGain.gain.linearRampToValueAtTime(0.0, audioCtx.currentTime + fadeSeconds);
                    setTimeout(() => {
                        audioCtx.close();
                    }, fadeSeconds * 1000 + 100);
                } catch(e){}
            }
        }

        // Trigger synth on first click/key
        document.body.addEventListener('click', () => {
            if (!audioCtx) startSynth();
        }, { once: true });


        // --- Stage Transition Coordinator ---
        let currentTimer = null;

        function playTypeSound() {
            if (!audioCtx || audioCtx.state === 'suspended') return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const freq = 450 + Math.random() * 150;
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                
                gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
                
                osc.connect(gain);
                gain.connect(masterGain);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } catch(e){}
        }

        const line1Text = "WELCOME TO";
        const line2Text = "ATC STUDIO";
        const typingSpeed = 100; // ms per character

        function typeText(element, text, index, callback) {
            let cursorSpan = element.querySelector('.cursor');
            if (!cursorSpan) {
                cursorSpan = document.createElement('span');
                cursorSpan.className = 'cursor';
                element.appendChild(cursorSpan);
            }
            
            if (index < text.length) {
                const char = text.charAt(index);
                const charNode = document.createTextNode(char);
                element.insertBefore(charNode, cursorSpan);
                
                playTypeSound();
                
                setTimeout(() => {
                    typeText(element, text, index + 1, callback);
                }, typingSpeed);
            } else {
                if (callback) callback();
            }
        }

        function startStageSequence() {
            const line1El = document.getElementById('line1');
            const line2El = document.getElementById('line2');
            
            if (!line1El || !line2El) return;
            
            line1El.innerHTML = '';
            line2El.innerHTML = '';
            
            // Start typing line 1
            typeText(line1El, line1Text, 0, () => {
                setTimeout(() => {
                    const cursor1 = line1El.querySelector('.cursor');
                    if (cursor1) cursor1.remove();
                    
                    // Start typing line 2
                    typeText(line2El, line2Text, 0, () => {
                        // Once typing is fully complete, wait 1.5 seconds and transition
                        currentTimer = setTimeout(() => {
                            transitionToStage2();
                        }, 1500);
                    });
                }, 400);
            });
        }

        function transitionToStage2() {
            if (currentTimer) clearTimeout(currentTimer);

            // Change active state to Stage 2 (Squad members list)
            document.getElementById('canvas-stage').classList.remove('active');
            document.getElementById('squad-stage').classList.add('active');

            // Generate and render squad members with staggered animations
            const squad = ["VAISAL", "GIRISH", "KISHOOR", "GIRI", "VASANTH", "LOGITH", "DHARNISH", "SURYA", "JD", "NITHISH", "SUDHISH", "THAYA"];
            const grid = document.getElementById('squad-grid');
            grid.innerHTML = '';
            
            squad.forEach((name, idx) => {
                const card = document.createElement('div');
                card.className = 'friend-card';
                card.textContent = name;
                grid.appendChild(card);
                
                // Stagger reveal card animation
                setTimeout(() => {
                    card.classList.add('reveal');
                }, idx * 180 + 100);
            });

            // Stage 2 -> Stage 3 after 7 seconds
            currentTimer = setTimeout(() => {
                transitionToStage3();
            }, 7000);
        }

        function transitionToStage3() {
            if (currentTimer) clearTimeout(currentTimer);

            // Fade ambient audio
            stopSynth(1.2);

            // Change active state to Stage 3 (Disclaimer)
            document.getElementById('squad-stage').classList.remove('active');
            document.getElementById('disclaimer-stage').classList.add('active');
        }

        function skipIntro() {
            transitionToStage2();
        }

        function skipToDisclaimer() {
            transitionToStage3();
        }

        function goToLobby() {
            window.location.href = 'attacks_lobby.html';
        }

        // Handle K keypress to trigger continue
        document.addEventListener('keydown', (e) => {
            if (e.key === 'k' || e.key === 'K') {
                const disclaimerStage = document.getElementById('disclaimer-stage');
                if (disclaimerStage && disclaimerStage.classList.contains('active')) {
                    const btn = disclaimerStage.querySelector('.btn-battle');
                    if (btn) {
                        btn.style.background = 'var(--primary)';
                        btn.style.color = '#000';
                        btn.style.boxShadow = '0 0 25px var(--primary)';
                        btn.style.transform = 'translateY(1px)';
                    }
                    setTimeout(() => {
                        goToLobby();
                    }, 150);
                }
            }
        });

        // Start typing on page load
        startStageSequence();
    </script>
</body>
</html>
