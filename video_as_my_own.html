<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ATTACKS | Video As My Own</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6400;
            --primary-glow: rgba(255, 100, 0, 0.45);
            --green: #00FF88;
            --green-glow: rgba(0, 255, 136, 0.35);
            --gold: #FFD700;
            --gold-glow: rgba(255, 215, 0, 0.35);
            --red: #FF2244;
            --bg: #04040c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Scanlines overlay */
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.14), rgba(0,0,0,0.14) 1.5px, transparent 1.5px, transparent 3px);
            pointer-events: none; z-index: 9999; opacity: 0.7;
        }

        /* Ambient particles bg */
        #particle-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }

        /* Header */
        .header {
            width: 100%; padding: 18px 30px 16px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid rgba(255, 100, 0, 0.12);
            background: rgba(4,4,12,0.9);
            backdrop-filter: blur(12px);
            position: sticky; top: 0; z-index: 100;
        }

        .header-logo {
            font-family: 'JetBrains Mono', monospace;
            font-size: 20px; font-weight: 900; letter-spacing: 6px;
            color: var(--primary);
            text-shadow: 0 0 12px var(--primary-glow);
        }

        .header-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px; letter-spacing: 3px; color: #555;
            text-transform: uppercase;
        }

        .btn-back {
            background: transparent;
            border: 1px solid rgba(255,100,0,0.3);
            color: rgba(255,100,0,0.7);
            padding: 8px 18px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px; letter-spacing: 2px;
            border-radius: 6px; cursor: pointer;
            transition: 0.25s;
        }

        .btn-back:hover {
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        /* Main Container */
        .main-container {
            width: 100%; max-width: 720px;
            padding: 30px 20px 80px;
            position: relative; z-index: 1;
            display: flex; flex-direction: column; align-items: center;
        }

        .card {
            width: 100%; background: rgba(10, 10, 24, 0.85);
            border: 1.5px solid rgba(255, 100, 0, 0.35);
            border-radius: 18px; padding: 30px;
            backdrop-filter: blur(14px);
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.6);
            margin-bottom: 30px; text-align: center;
        }

        .card-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 24px; font-weight: 900; letter-spacing: 4px;
            color: var(--primary); margin-bottom: 6px;
            text-transform: uppercase;
            text-shadow: 0 0 15px var(--primary-glow);
        }

        .card-sub {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px; color: rgba(255,255,255,0.45);
            letter-spacing: 2px; margin-bottom: 25px;
        }

        /* Video Player Frame */
        .video-player-wrapper {
            position: relative; width: 100%;
            background: #000; border-radius: 16px; overflow: hidden;
            border: 2px solid rgba(255, 100, 0, 0.4);
            box-shadow: 0 0 25px rgba(255, 100, 0, 0.25);
            margin-bottom: 25px;
        }

        .video-player-wrapper video {
            width: 100%; display: block;
            border-radius: 14px; max-height: 450px;
            object-fit: cover;
        }

        .video-overlay-badge {
            position: absolute; top: 12px; left: 12px;
            background: rgba(0,0,0,0.7); border: 1px solid var(--primary);
            color: var(--primary); font-family: 'JetBrains Mono', monospace;
            font-size: 10px; letter-spacing: 2px;
            padding: 4px 12px; border-radius: 20px;
            backdrop-filter: blur(8px);
        }

        /* Actions Grid */
        .controls-grid {
            display: flex; gap: 14px; flex-wrap: wrap; justify-content: center;
            width: 100%; margin-top: 15px;
        }

        .btn-action {
            flex: 1; min-width: 160px; padding: 14px;
            background: rgba(255, 100, 0, 0.1);
            border: 1.5px solid rgba(255, 100, 0, 0.35);
            color: #fff; font-family: 'JetBrains Mono', monospace;
            font-size: 11px; letter-spacing: 2px; font-weight: 700;
            border-radius: 10px; cursor: pointer; transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        .btn-action:hover {
            background: var(--primary); color: #000;
            box-shadow: 0 0 15px var(--primary-glow);
            transform: translateY(-2px);
        }

        .select-input {
            width: 100%; padding: 14px 18px;
            background: rgba(4, 4, 12, 0.85);
            border: 1.5px solid rgba(255, 100, 0, 0.35);
            border-radius: 10px; color: #fff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px; letter-spacing: 2px;
            outline: none; margin-bottom: 20px;
        }

        .select-input option {
            background: #0b0b14; color: #fff;
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>
    <canvas id="particle-bg"></canvas>

    <header class="header">
        <div>
            <div class="header-logo">ATTACKS</div>
            <div class="header-tag">VIDEO AS MY OWN v1.0</div>
        </div>

        <button class="btn-back" onclick="goBack()">← SEARCH ENGINE</button>
    </header>

    <main class="main-container">
        
        <div class="card">
            <div style="font-size: 40px; margin-bottom: 10px;">📹</div>
            <h1 class="card-title">VIDEO AS MY OWN</h1>
            <p class="card-sub">PLAY CUSTOM SQUAD RECORDINGS OR UPLOAD YOUR OWN VIDEO</p>

            <select id="squad-video-select" class="select-input" onchange="changeSquadVideo(this.value)">
                <option value="vaisal_video.mp4">📹 VAISAL VIDEO RECORD</option>
                <option value="WhatsApp nithish 2026-07-23 at 1.39.57 AM.mp4 .mp4">📹 NITHISH VIDEO RECORD</option>
                <option value="custom">📁 UPLOAD MY OWN CUSTOM VIDEO...</option>
            </select>

            <input type="file" id="custom-video-file" accept="video/*" style="display:none" onchange="handleCustomVideoUpload(event)">

            <div class="video-player-wrapper">
                <div class="video-overlay-badge" id="video-badge">📹 VAISAL VIDEO RECORDING</div>
                <video id="main-video-player" src="vaisal_video.mp4" controls autoplay loop playsinline></video>
            </div>

            <div class="controls-grid">
                <button class="btn-action" onclick="document.getElementById('custom-video-file').click()">
                    <span>📁</span> UPLOAD VIDEO
                </button>
                <button class="btn-action" onclick="toggleFullscreen()">
                    <span>⛶</span> FULLSCREEN
                </button>
            </div>
        </div>

    </main>

    <script>
        function goBack() {
            const dimmer = document.createElement('div');
            dimmer.style.cssText = `
                position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                background: #000; z-index: 99999; opacity: 0;
                transition: opacity 0.8s ease;
            `;
            document.body.appendChild(dimmer);
            requestAnimationFrame(() => requestAnimationFrame(() => {
                dimmer.style.opacity = '1';
                setTimeout(() => { window.location.href = 'attacks_game.html'; }, 900);
            }));
        }

        function changeSquadVideo(src) {
            if (src === 'custom') {
                document.getElementById('custom-video-file').click();
                return;
            }
            const player = document.getElementById('main-video-player');
            player.src = src;
            player.play();
            const badge = document.getElementById('video-badge');
            if (src.includes('vaisal')) badge.textContent = '📹 VAISAL VIDEO RECORDING';
            else if (src.includes('nithish')) badge.textContent = '📹 NITHISH VIDEO RECORDING';
            else badge.textContent = '📹 SQUAD VIDEO RECORDING';
        }

        function handleCustomVideoUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const url = URL.createObjectURL(file);
            const player = document.getElementById('main-video-player');
            player.src = url;
            player.play();

            document.getElementById('video-badge').textContent = `📹 AS MY OWN: ${file.name.toUpperCase()}`;
        }

        function toggleFullscreen() {
            const player = document.getElementById('main-video-player');
            if (player.requestFullscreen) player.requestFullscreen();
            else if (player.webkitRequestFullscreen) player.webkitRequestFullscreen();
            else if (player.msRequestFullscreen) player.msRequestFullscreen();
        }

        // Particle background
        (function() {
            const canvas = document.getElementById('particle-bg');
            const ctx = canvas.getContext('2d');
            let W, H, particles = [];

            function resize() {
                W = canvas.width  = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }

            resize();
            window.addEventListener('resize', resize);

            for (let i = 0; i < 45; i++) {
                particles.push({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight,
                    r: Math.random() * 1.3 + 0.3,
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.3,
                    alpha: Math.random() * 0.3 + 0.08
                });
            }

            function draw() {
                ctx.clearRect(0, 0, W, H);
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.x < 0 || p.x > W) p.vx *= -1;
                    if (p.y < 0 || p.y > H) p.vy *= -1;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,100,0,${p.alpha})`;
                    ctx.fill();
                });
                requestAnimationFrame(draw);
            }
            draw();
        })();
    </script>
</body>
</html>
